<title>JS and LeetCode Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one-column notebook — sticky bar with tabs and search, sections that open and close */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --fg: #1b2030; --muted: #5d6680; --line: #dfe3ee;
  --accent: #2f5bd3; --accent-soft: #e6ecfb; --done: #1f8a5b;
  --code-bg: #f0f2f8; --c-comment: #3e6b4f; --c-key: #8a2fb8; --c-str: #a3431b; --c-num: #0b6e8a; --c-fn: #2f5bd3;
  --f-head: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151f; --surface: #1a1e2b; --fg: #e6e9f2; --muted: #9aa3bb; --line: #2c3245;
  --accent: #8aa8ff; --accent-soft: #232c48; --done: #5fd39b;
  --code-bg: #151925; --c-comment: #8fc7a2; --c-key: #d6a2ff; --c-str: #ffb38a; --c-num: #7fd6ec; --c-fn: #8aa8ff;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151f; --surface: #1a1e2b; --fg: #e6e9f2; --muted: #9aa3bb; --line: #2c3245;
  --accent: #8aa8ff; --accent-soft: #232c48; --done: #5fd39b;
  --code-bg: #151925; --c-comment: #8fc7a2; --c-key: #d6a2ff; --c-str: #ffb38a; --c-num: #7fd6ec; --c-fn: #8aa8ff;
  color-scheme: dark }

body { background: var(--bg); color: var(--fg); font: 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header .wrap { display: grid; gap: 10px; padding-block: 12px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font: 700 1.2rem/1.2 var(--f-head); margin: 0; letter-spacing: -0.01em; }
.progress { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
nav a { flex: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); text-decoration: none; font: 500 0.95rem var(--f-head); border: 1px solid var(--line); }
nav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { font: 500 0.85rem var(--f-head); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main .wrap { display: grid; gap: 10px; padding-block: 16px 48px; }
.hint { color: var(--muted); font-size: 0.9rem; margin: 0; }
details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
details.sec > summary::-webkit-details-marker { display: none; }
.num { flex: none; font: 600 0.8rem var(--f-code); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; min-width: 2.6em; text-align: center; font-variant-numeric: tabular-nums; }
.title { flex: 1; min-width: 0; font: 500 1rem/1.3 var(--f-head); text-wrap: balance; }
.from { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.done-box { flex: none; display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.done-box input { width: 18px; height: 18px; accent-color: var(--done); }
details.sec.is-done .num { background: var(--done); color: var(--surface); }
details.sec.is-done .title { color: var(--muted); }
.body { padding: 0 14px 14px; min-width: 0; }

pre { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 14px; font: 0.88rem/1.65 var(--f-code); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.cases { display: grid; gap: 28px; min-width: 0; }
/* one concept = one card: title, plain-text boxes, then the code on its own */
.case { display: grid; gap: 12px; min-width: 0; padding-top: 18px; border-top: 2px solid var(--line); }
.cases .case:first-child { border-top: 0; padding-top: 4px; }
.case-name { margin: 0; font: 700 1.15rem/1.25 var(--f-head); }
.case-sub { margin: -6px 0 0; color: var(--muted); }
.lbl { display: block; font: 700 0.72rem var(--f-head); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 2px; }
.code-lbl { margin-bottom: -6px; }
.f { padding: 10px 14px; border-radius: 10px; max-width: 70ch; }
.f code { font: 0.85em var(--f-code); background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.f.serve { background: var(--accent-soft); font-size: 1.05rem; }
.f.serve .lbl, .f.rule .lbl { color: var(--accent); }
.f.rule { border: 1px solid var(--accent); }
.f.keep { padding-block: 0; color: var(--muted); font-size: 0.92rem; }
.f.confuse { border-left: 4px solid var(--c-str); background: var(--code-bg); border-radius: 0 10px 10px 0; }
.f.confuse .lbl { color: var(--c-str); }
.f.recall { border-left: 4px solid var(--done); background: var(--code-bg); border-radius: 0 10px 10px 0; font-weight: 700; }
.f.recall .lbl { color: var(--done); }
.f.quiz { border: 1px dashed var(--accent); }
.f.intro { background: var(--code-bg); margin-bottom: 14px; max-width: none; }
.f.intro p { margin: 0 0 4px; }
.intro-code { margin-bottom: 14px; }
.hljs-comment.res { color: var(--done); font-weight: 600; }
details.adv > summary { cursor: pointer; color: var(--muted); font: 500 0.9rem var(--f-head); }
details.adv > p { margin: 6px 0 0; color: var(--muted); }
details.answer > summary { cursor: pointer; color: var(--accent); font: 600 0.95rem var(--f-head); padding: 8px 0 0; }
details.answer > p { margin: 6px 0 0; }
.stepper { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
.stepper .pos { color: var(--muted); font: 600 0.9rem var(--f-head); font-variant-numeric: tabular-nums; text-align: center; }
.stepper .mode { margin-left: auto; color: var(--muted); }
.stepper button[data-step] { padding: 8px 14px; font-size: 0.95rem; }
.stepper button:disabled { opacity: 0.4; cursor: default; }
.stepper button { white-space: nowrap; }
.stepper .mode { padding: 6px 8px; }
.case[hidden], .stepper[hidden], .stepper [hidden] { display: none; }
.cases + .stepper { margin: 18px 0 0; }
.md { min-width: 0; }
.md h2 { font: 700 1.1rem var(--f-head); margin: 1.2em 0 0.4em; }
.md h3 { font: 600 1rem var(--f-head); margin: 1em 0 0.3em; }
.md p, .md li { max-width: 65ch; }
.md code { font: 0.85em var(--f-code); background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; padding: 0; }
.md a { color: var(--accent); overflow-wrap: anywhere; }
.md blockquote { margin: 0.8em 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; }
.table-wrap { overflow-x: auto; margin: 0.6em 0; }
.md table { border-collapse: collapse; font-size: 0.88rem; min-width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--code-bg); font-family: var(--f-head); }
mark { background: var(--accent-soft); color: var(--fg); border-radius: 3px; }

.hljs-comment { color: var(--c-comment); }
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--c-key); }
.hljs-string, .hljs-regexp { color: var(--c-str); }
.hljs-number { color: var(--c-num); }
.hljs-title, .hljs-title.function_ { color: var(--c-fn); }
footer { color: var(--muted); font-size: 0.8rem; }
@media (prefers-reduced-motion: no-preference) { details.sec[open] > .body { animation: in 160ms ease-out; } @keyframes in { from { opacity: 0.4 } to { opacity: 1 } } }
</style>

<header>
  <div class="wrap">
    <div class="top">
      <h1>JS and LeetCode Notebook</h1>
      <span class="progress" id="progress"></span>
    </div>
    <nav id="tabs" aria-label="Files"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search everything: reduce, Map, window, idempotency…" aria-label="Search">
      <button id="toggle" type="button">Open all</button>
    </div>
  </div>
</header>
<main>
  <div class="wrap" id="list"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const TABS = /*__DATA__*/null;
const BUILT = "__BUILT__";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const done = new Set(store.get("done") || []);
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderBody(sec) {
  if (sec.kind === "md") {
    const html = window.marked ? marked.parse(sec.body) : `<pre>${esc(sec.body)}</pre>`;
    return `<div class="md">${html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>")}</div>`;
  }
  // each "//-----" separator starts a new case → its own card; the prose comments become text boxes, only real code stays in <pre>
  const cases = sec.body.split(/^\s*\/\/-{20,}\s*$/m).map((c) => c.trim()).filter(Boolean).map(parseCase);
  // the block before the first labelled case is the section's intro ("Usar quando…"): a note on top, not a step
  const intro = cases.length && !Object.keys(cases[0].f).length && !cases[0].titled ? cases.shift() : null;
  const hl = (s) => {
    const h = window.hljs ? hljs.highlight(s, { language: "javascript" }).value : esc(s);
    return h.replace(/<span class="hljs-comment">\/\/ result ==&gt;/g, '<span class="hljs-comment res">// result ==&gt;');
  };
  const txt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const box = (cls, label, s) => (s ? `<div class="f ${cls}"><span class="lbl">${label}</span>${txt(s)}</div>` : "");
  const html = cases.map((c, i) => `<article class="case" data-i="${i}">
      ${c.name ? `<h3 class="case-name">${txt(c.name)}</h3>${c.sub && !c.titled ? `<p class="case-sub">${txt(c.sub)}</p>` : ""}` : ""}
      ${box("serve", "Para que serve", c.titled ? c.sub.replace(/^serve para\s*/i, "") : c.f["Para que serve"])}
      ${box("rule", "Regra essencial", c.f["Regra essencial"])}
      ${box("keep", "O que guarda", c.f["O que guarda"])}
      ${c.code ? `<span class="lbl code-lbl">Exemplo</span><pre><code>${hl(c.code)}</code></pre>` : ""}
      ${box("confuse", "Confusão possível", c.f["Confusão possível"])}
      ${box("recall", "Para recordar", c.f["Para recordar"])}
      ${c.f["Avançado"] ? `<details class="adv"><summary>Avançado</summary><p>${txt(c.f["Avançado"])}</p></details>` : ""}
      ${c.f["Pergunta"] ? `<div class="f quiz"><span class="lbl">Pergunta</span>${txt(c.f["Pergunta"])}${c.f["Resposta"] ? `<details class="answer"><summary>Ver resposta</summary><p>${txt(c.f["Resposta"])}</p></details>` : ""}</div>` : ""}
    </article>`).join("");
  const nav = cases.length > 1 ? `<div class="stepper"><button type="button" data-step="-1" aria-label="Anterior">←</button><span class="pos"></span><button type="button" data-step="1">Seguinte →</button><button type="button" class="mode"></button></div>` : "";
  const introLines = intro ? intro.raw.split("\n").filter((l) => l.trim()) : [];
  const introHtml = !intro ? ""
    : introLines.every((l) => /^\s*\/\//.test(l))
      ? introLines.some((l) => /[{};]|^\s*\/\/\s*(let|const|while|if|for|else|return)\b/.test(l))
        ? `<pre class="intro-code"><code>${hl(intro.raw.split("\n").map((l) => l.replace(/^(\s*)\/\/ ?/, "$1")).join("\n"))}</code></pre>` // a commented-out template: keep it monospace
        : `<div class="f intro">${introLines.map((l) => `<p>${txt(l.replace(/^\s*\/\/\s?/, ""))}</p>`).join("")}</div>`
      : `<pre class="intro-code"><code>${hl(intro.raw)}</code></pre>`;
  return `${introHtml}${nav}<div class="cases">${html}</div>${nav}`;
}

/*parse:start*/
// Splits one case into its title, labelled prose fields ("// Label: text", with "//   " continuation lines) and the code that is left
function parseCase(c) {
  const LABELS = ["Para que serve", "Regra essencial", "O que guarda", "Confusão possível", "Para recordar", "Avançado", "Pergunta", "Resposta"];
  const re = new RegExp(`^\\s*// (${LABELS.join("|")}):\\s*(.*)$`);
  const lines = c.split("\n");
  const out = { name: "", sub: "", f: {}, code: "", raw: c };
  const code = [];
  let cur = null;
  let i = 0;
  // first line "// NAME — what it does" is the card title (only when it carries no label)
  const own = lines[0].match(/^\s*\/\/ (.+?) - \/\/ (.+)$/); // his own shape: "// nome - // serve para …"
  if (own) {
    out.name = own[1].trim();
    out.sub = own[2].trim();
    out.titled = true;
    i = 1;
  } else if (/^\s*\/\/ /.test(lines[0]) && !re.test(lines[0])) {
    const t = lines[0].replace(/^\s*\/\/\s*/, "");
    const [name, ...rest] = t.split(" — ");
    out.name = name.trim();
    out.sub = rest.join(" — ").trim();
    i = 1;
  }
  for (; i < lines.length; i++) {
    const l = lines[i];
    const m = l.match(re);
    if (m) { cur = m[1]; out.f[cur] = out.f[cur] ? out.f[cur] + " " + m[2] : m[2]; continue; }
    if (cur && /^\s*\/\/\s{2,}\S/.test(l)) { out.f[cur] += " " + l.replace(/^\s*\/\/\s*/, ""); continue; }
    cur = null;
    code.push(l);
  }
  while (code.length && !code[0].trim()) code.shift();
  while (code.length && !code.at(-1).trim()) code.pop();
  out.code = code.join("\n");
  return out;
}
/*parse:end*/

// "Um de cada vez": shows one case of an open section, with Anterior / Seguinte
let oneAtATime = store.get("oneAtATime") ?? true;
function showCase(body, idx) {
  const cases = [...body.querySelectorAll(".case")];
  if (!cases.length) return;
  idx = Math.max(0, Math.min(cases.length - 1, idx));
  body.dataset.idx = idx;
  cases.forEach((c, i) => (c.hidden = oneAtATime && i !== idx));
  body.querySelectorAll(".stepper").forEach((s) => {
    s.querySelector(".pos").textContent = oneAtATime ? `${idx + 1} de ${cases.length}` : `${cases.length} conceitos`;
    s.querySelectorAll("[data-step]").forEach((b) => (b.hidden = !oneAtATime));
    s.querySelector("[data-step='-1']").disabled = idx === 0;
    s.querySelector("[data-step='1']").disabled = idx === cases.length - 1;
    s.querySelector(".mode").textContent = oneAtATime ? "Todos" : "Um a um";
  });
  // a second stepper only helps at the bottom of a long list
  const bottom = body.querySelectorAll(".stepper")[1];
  if (bottom) bottom.hidden = !oneAtATime;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".stepper button");
  if (!b) return;
  const body = b.closest(".body");
  if (b.classList.contains("mode")) {
    oneAtATime = !oneAtATime;
    store.set("oneAtATime", oneAtATime);
    document.querySelectorAll(".body").forEach((x) => x.querySelector(".case") && showCase(x, +x.dataset.idx || 0));
  } else {
    showCase(body, (+body.dataset.idx || 0) + +b.dataset.step);
    if (b.closest(".stepper") === body.querySelectorAll(".stepper")[1]) body.closest("details.sec").scrollIntoView({ block: "start" });
  }
});

function card(tab, sec, i, showFrom) {
  const key = `${tab.id}:${sec.n || "x" + i}:${sec.title}`;
  const d = document.createElement("details");
  d.className = "sec" + (done.has(key) ? " is-done" : "");
  d.innerHTML = `<summary>
      <span class="num">${sec.n ? "§" + sec.n : "★"}</span>
      <span class="title">${showFrom ? `<span class="from">${tab.label}</span><br>` : ""}${esc(sec.title)}</span>
      <label class="done-box"><input type="checkbox" ${done.has(key) ? "checked" : ""} aria-label="Mark as studied"> ok</label>
    </summary><div class="body"></div>`;
  const box = d.querySelector("input");
  box.addEventListener("click", (e) => e.stopPropagation());
  box.addEventListener("change", () => {
    box.checked ? done.add(key) : done.delete(key);
    d.classList.toggle("is-done", box.checked);
    store.set("done", [...done]);
    updateProgress();
  });
  // render the content only when opened (keeps the page light on phones)
  d.addEventListener("toggle", () => {
    const body = d.querySelector(".body");
    if (d.open && !body.innerHTML) { body.innerHTML = renderBody(sec); showCase(body, 0); }
  });
  return d;
}

function currentTab() { return TABS.find((t) => "#" + t.id === location.hash) || TABS[0]; }

function updateProgress() {
  const t = currentTab();
  const total = t.sections.length;
  const n = t.sections.filter((s, i) => done.has(`${t.id}:${s.n || "x" + i}:${s.title}`)).length;
  $("progress").textContent = `${n}/${total} studied`;
}

function render() {
  const q = norm($("q").value.trim());
  const list = $("list");
  list.innerHTML = "";
  const t = currentTab();
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.hash === "#" + t.id && !q ? "page" : "false"));
  if (q) {
    let hits = 0;
    for (const tab of TABS) tab.sections.forEach((s, i) => {
      if (norm(s.title + "\n" + s.body).includes(q)) { list.append(card(tab, s, i, true)); hits++; }
    });
    list.prepend(Object.assign(document.createElement("p"), { className: "hint", textContent: hits ? `${hits} sections mention "${$("q").value.trim()}". Open one to read it.` : "No match. Try another word (e.g. sort, Map, pointers)." }));
  } else {
    list.append(Object.assign(document.createElement("p"), { className: "hint", textContent: `${t.file} · tap a section to open it · tick “ok” once you know it` }));
    t.sections.forEach((s, i) => list.append(card(t, s, i, false)));
    if (t.id === "start") list.querySelector("details").open = true;
  }
  const foot = document.createElement("footer");
  foot.textContent = `Generated on ${BUILT} from the cheatSheet repo. Progress is saved in this browser only.`;
  list.append(foot);
  $("toggle").textContent = "Open all";
  updateProgress();
}

$("tabs").innerHTML = TABS.map((t) => `<a href="#${t.id}">${t.label}</a>`).join("");
$("tabs").addEventListener("click", () => { $("q").value = ""; });
$("q").addEventListener("input", render);
$("toggle").addEventListener("click", () => {
  const all = [...document.querySelectorAll("details.sec")];
  const open = all.some((d) => !d.open);
  all.forEach((d) => (d.open = open));
  $("toggle").textContent = open ? "Close all" : "Open all";
});
window.addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
