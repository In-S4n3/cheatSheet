Root, 4)).val; // result ==> 5  (o 5 pára logo e não desce; um está por cima do outro)\n  lowestCommonAncestor(lcaRoot, findNode(lcaRoot, 5), findNode(lcaRoot, 1)).val; // result ==> 3\n  lowestCommonAncestor(lcaRoot, findNode(lcaRoot, 7), findNode(lcaRoot, 8)).val; // result ==> 3\n  lowestCommonAncestor(lcaRoot, findNode(lcaRoot, 6), findNode(lcaRoot, 4)).val; // result ==> 5  (o 6 está à esquerda do 5 e o 4 à direita, por baixo do 2)\n}\n// nota: numa BST basta comparar values (os dois menores → esquerda); aqui não há ordem, por isso procura-se dos dois lados.\n// nota2: tempo O(n), espaço O(altura).\n\n//--------------------------------------------------------------------\n// Binary Tree Level Order Traversal (LC 102) - // serve para ler a tree um level de cada vez ([[3], [9, 20], [15, 7]]).\n{\n  const levelOrder = (root) => {\n    // passo 1 — esqueleto: tree vazia dá []; a queue começa na root\n    if (root === null) {\n      return [];\n    }\n    const levels = [];\n    const queue = [root];\n    // passo 2 — uma iteration do while = um level\n    while (queue.length > 0) {\n      // passo 3 — só os nodes que já estão na queue (este level); os children ficam para a iteration seguinte\n      const size = queue.length;\n      const level = [];\n      for (let i = 0; i \u003c size; i++) {\n        const node = queue.shift();\n        level.push(node.val);\n        // passo 4 — pôr os children na queue\n        // esquerda\n        if (node.left !== null) {\n          queue.push(node.left);\n        }\n        // direita\n        if (node.right !== null) {\n          queue.push(node.right);\n        }\n      }\n      levels.push(level);\n    }\n    return levels;\n  };\n\n  levelOrder(toTree([3, 9, 20, null, null, 15, 7])); // result ==> [[3], [9, 20], [15, 7]]\n  levelOrder(toTree([1])); // result ==> [[1]]\n  levelOrder(null); // result ==> []\n  levelOrder(toTree([1, 2, null, 3])); // result ==> [[1], [2], [3]]  (tree torta)\n  levelOrder(toTree([1, 2, 3])); // result ==> [[1], [2, 3]]  (a root, depois os dois children)\n}\n// nota: o mesmo código resolve LC 199 Right Side View (o último de cada level) e LC 103 Zigzag (inverter os levels ímpares).\n// nota2: DFS desce até ao fundo de um branch primeiro; para \"level a level\" usa BFS com uma queue. Tempo e espaço O(n)."},{"n":"15","title":"TABELA FINAL: SINAL NO ENUNCIADO → PADRÃO","kind":"code","body":"/*\n  SINAL NO ENUNCIADO                                   → PADRÃO                           §\n  ---------------------------------------------------------------------------------------------\n  \"subarray com soma K\" (com negativos)                → prefix sum + Map                 §2\n  \"agrupar\", \"anagramas\", \"contar\", \"já vi isto?\"      → Map / Set                        §2\n  \"os k mais frequentes\"                               → Map + buckets (ou sort)          §2\n  \"ordenado\", \"par/trio com soma X\"                    → two pointers                     §3\n  \"substring/subarray contíguo mais longo/curto\"       → sliding window                   §4\n  \"todas as posições de um anagrama/permutation\"       → window FIXA + contagens          §4\n  \"próximo maior/menor\", \"quantos dias até\"            → monotonic stack                  §5\n  \"parênteses\", \"expressão\", \"desfazer\"                → stack                            §5\n  \"O(log n)\", \"ordenado mas rodado\"                    → binary search                    §6\n  \"menor velocidade/capacidade que consegue\"           → binary search na resposta        §6\n  \"intervalos\", \"reuniões\", \"sobrepostos\"              → ordenar por início + juntar      §7\n  \"grid\", \"ilhas\", \"regiões\"                           → DFS na grid                      §8\n  \"menos passos\", \"minutos até espalhar\"               → BFS (várias origens)             §8\n  \"pré-requisitos\", \"dependências\", \"ordem válida\"     → graph + Kahn (topological sort)  §9\n  \"todas as combinações/subsets/permutations\"          → backtracking                     §10\n  \"k-ésimo maior\", \"top k\", \"sempre o mínimo\"          → heap (ou sort)                   §11\n  \"número de maneiras\", \"mín/máx de…\", \"é possível?\"   → dynamic programming              §12\n  \"remover a contar do fim\", \"numa passagem\" (list)    → dummy + two pointers             §13\n  \"BST válida\", \"common ancestor\", \"por levels\"        → DFS com limites / BFS            §14\n\n  O que o n permite (≈ 10^8 passos simples por segundo):\n    n ≤ 12         → O(n!)       permutations\n    n ≤ 20         → O(2^n)      subsets / backtracking\n    n ≤ 500        → O(n³)\n    n ≤ 10^4       → O(n²)       dois for, DP 2D\n    n ≤ 10^6       → O(n log n)  sort, heap, binary search num loop\n    n ≤ 10^8       → O(n)        um loop, Map, two pointers, window\n    maior          → O(log n) ou O(1)\n  ex.: \"nums.length \u003c= 10^5\" → querem O(n) ou O(n log n); dois for dão timeout.\n\n  Custos O(n) escondidos em JS: shift, unshift, includes, indexOf, splice, slice, [...arr], join.\n  sort → O(n log n). Map/Set get/has/set/add/delete → O(1).\n*/"},{"n":"16","title":"PLANO DE 7 DIAS","kind":"code","body":"/*\n  Como praticar:\n    - 25 min sozinho por problema. Encravado? Lê só a linha \"Usar quando\" e o molde. Mais 10 min.\n    - Continua encravado → lê a solução, fecha-a, reescreve-a de memória. Isso conta.\n    - Fala em voz alta enquanto escreves.\n    - Depois de cada problema: diz a complexidade e escreve 2 casos limite.\n    - \"Revisão\" = reescrever do zero, sem olhar, um problema de um dia anterior.\n\n  DIA 1 — Hash map (o mais importante para strings/arrays)\n    49 Group Anagrams · 347 Top K Frequent · 128 Longest Consecutive Sequence\n    + aquecimento fácil: 1 Two Sum, 242 Valid Anagram\n  DIA 2 — Prefix sum + two pointers\n    560 Subarray Sum Equals K · 15 3Sum · 11 Container With Most Water\n    + revisão: 49\n  DIA 3 — Sliding window (strings!)\n    3 Longest Substring Without Repeating · 424 Longest Repeating Char Replacement · 438 Find All Anagrams\n    + revisão: 560, 15\n  DIA 4 — Stack + binary search + intervalos\n    739 Daily Temperatures · 155 Min Stack · 33 Search in Rotated Sorted Array · 56 Merge Intervals\n    + revisão: 3\n  DIA 5 — Grid, graphs, linked lists e trees\n    200 Number of Islands · 207 Course Schedule · 19 Remove Nth From End · 102 Level Order\n    + revisão: 438, 56\n  DIA 6 — DP + backtracking + heap\n    198 House Robber · 322 Coin Change · 78 Subsets · 215 Kth Largest (primeiro com sort, depois com heap)\n    + revisão: 347, 739\n  DIA 7 — Entrevista simulada (sem olhar para este ficheiro)\n    Escolhe 2 que ainda não fizeste: 238 Product of Array Except Self, 5 Longest Palindromic Substring\n    (ou 875 Koko, 57 Insert Interval, 994 Rotting Oranges, 98 Validate BST).\n    45 min cada, em voz alta, com a lista do §1. Depois refaz os que falhaste nos dias 1–6.\n    Na véspera: relê só o §1 e o §15. Dorme.\n\n  Só há tempo para 10: 49, 347, 560, 15, 3, 438, 56, 739, 200, 322.\n*/\n\nconsole.log(\"✅ Medium OK\");"}]},{"id":"payments","label":"Payments","file":"04-Payments.md + .js","sections":[{"n":"1","title":"Dinheiro no código","kind":"md","body":"### Unidade mínima + moeda — guardar dinheiro como inteiro\n\n- Para que serve: guardar €12,34 como `1234` cêntimos, sem os erros do `float` (`0.1 + 0.2 !== 0.3`).\n- Regra essencial: dinheiro = inteiro na unidade mínima **+ a moeda**. As casas decimais vêm da moeda (ISO 4217); nunca assumir 2.\n- O que guarda: `EXPONENT` — key = código da moeda; value = casas decimais. O value é um `BigInt` / `int64` (ou uma biblioteca decimal: `decimal.js`, Go `shopspring/decimal`), lido de uma string, nunca de um float.\n\n| Texto | Moeda | Casas | Depois (`toMinor`) |\n|-------|-------|-------|--------------------|\n| `\"12.34\"` | EUR / USD | 2 | `1234n` |\n| `\"500\"` | JPY | 0 | `500n` |\n| `\"1.234\"` | BHD / KWD | 3 | `1234n` |\n\n- Confusão possível: `1234n` sozinho não diz nada — em EUR vale €12,34, em BHD vale 1,234 BHD. Guardar sempre `{ amount: 1234, currency: \"EUR\" }`.\n- Para recordar: inteiro na unidade mínima, com a moeda ao lado.\n- Pergunta: quanto dá `toMinor(\"7.5\", \"EUR\")`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`750n`. A parte decimal `\"5\"` é completada para `\"50\"` (EUR tem 2 casas): `\"7\" + \"50\"` = 750.\n\n\u003c/details>\n\n### Arredondamento bancário (half-even) + pontos base\n\n- Para que serve: cobrar 1,5% de comissão sobre €1234,56 e arredondar sem favorecer sempre o mesmo lado.\n- Regra essencial: só o empate exato (x,5) vai para o número **par**. Taxas em pontos base: 1 bp = 0,01%, logo 150 bp = 1,5%. Multiplicar primeiro, dividir e arredondar **uma vez**, no fim.\n- O que guarda: `divHalfEven(a, b)` — `q` = quociente inteiro, `r` = resto, `2·|r|` comparado com `b` para saber se passou de metade.\n\n| Operação | Valor exato | Depois |\n|----------|-------------|--------|\n| `divHalfEven(25n, 10n)` | 2,5 (empate) | `2n` (já é par) |\n| `divHalfEven(35n, 10n)` | 3,5 (empate) | `4n` (sobe para o par) |\n| `123456n × 150n ÷ 10000n` | 1851,84 cêntimos | `1852n` = €18,52 |\n\n- Confusão possível: half-up vs half-even — half-up sobe sempre os empates e, em milhões de arredondamentos, o erro acumula; half-even equilibra.\n- Para recordar: empate vai para o par; arredondar uma vez, com regra explícita.\n- Pergunta: quanto dá `divHalfEven(45n, 10n)`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`4n`. 4,5 é empate e 4 já é par.\n\n\u003c/details>\n\n### Allocate — dividir sem perder um cêntimo\n\n- Para que serve: dividir uma conta de €10,00 por 3 pessoas.\n- Regra essencial: a soma das partes **tem** de dar o total. O que sobra vai, cêntimo a cêntimo, para o maior resto.\n- O que guarda: `parts` = parte inteira de cada pessoa; `rems` = resto de cada uma; `left` = cêntimos ainda por dar.\n\n| Passo | `parts` | `left` |\n|-------|---------|--------|\n| Divisão inteira 1000 / 3 | `[333, 333, 333]` | 1 |\n| +1 ao maior resto | `[334, 333, 333]` | 0 |\n\n- Confusão possível: arredondar cada parte (333 × 3 = 999) perde 1 cêntimo; allocate não perde.\n- Para recordar: a soma das partes é sempre o total.\n- Pergunta: quanto dá `allocate(500n, [1n, 1n, 1n])`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`[167n, 167n, 166n]`. 166 × 3 = 498; os 2 cêntimos que sobram vão para os dois primeiros (restos iguais → ordem original).\n\n\u003c/details>\n\n- Na entrevista: \"Dinheiro é um inteiro na unidade mínima, mais a moeda. Arredondo uma vez, half-even, e faço allocate do resto para o total bater sempre.\"\n\n→ `04-Payments.js` §1\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// float vs cêntimos — porque o dinheiro nunca é float\n// Para que serve: somar €0,10 + €0,20 e obter exatamente €0,30.\n// Regra essencial: 0.1 não cabe exatamente num float; em cêntimos inteiros a conta é exata.\n// O que guarda: nada; compara as duas formas de somar o mesmo dinheiro.\n\n0.1 + 0.2; // result ==> 0.30000000000000004\n0.1 + 0.2 === 0.3; // result ==> false\n10n + 20n === 30n; // result ==> true\n\n// Antes → operação → depois\n//   forma       operação     depois\n//   float       0.1 + 0.2    0.30000000000000004  (errado por um bocadinho)\n//   cêntimos    10n + 20n    30n = €0,30 exatos\n\n// Confusão possível: toFixed(2) vs guardar inteiros — toFixed só arruma o ecrã; o valor guardado continua errado e o erro acumula.\n// Para recordar: dinheiro = inteiro na unidade mínima (cêntimos).\n// Pergunta: quanto dá 0.1 * 3 === 0.3?\n// Resposta: false. 0.1 * 3 dá 0.30000000000000004; em cêntimos, 10n * 3n === 30n dá true.\n\n//--------------------------------------------------------------------\n// toMinor() — string \"12.34\" → inteiro na unidade mínima\n// Para que serve: o cliente escreve \"12.34\" € e o sistema guarda 1234 cêntimos.\n// Regra essencial: as casas decimais vêm da moeda (ISO 4217). Ler da string, nunca de um float.\n// O que guarda: EXPONENT — key = código da moeda; value = número de casas decimais.\n//               minor = o value em unidades mínimas, como BigInt.\n\nconst EXPONENT = { JPY: 0, EUR: 2, USD: 2, BHD: 3 };\n\nfunction toMinor(str, currency) {\n  const exp = EXPONENT[currency];\n  if (exp === undefined) throw new Error(`moeda desconhecida ${currency}`);\n  if (!/^-?\\d+(\\.\\d+)?$/.test(str)) throw new Error(`invalid amount ${str}`);\n  const [int, frac = \"\"] = str.replace(\"-\", \"\").split(\".\");\n  if (frac.length > exp) throw new Error(`${currency} only has ${exp} decimal places`);\n  const minor = BigInt(int + frac.padEnd(exp, \"0\")); // \"12\" + \"34\" → 1234n\n  return str.startsWith(\"-\") ? -minor : minor;\n}\n\n// Antes → operação → depois\n//   string    moeda   casas   depois\n//   \"12.34\"   EUR     2       1234n\n//   \"500\"     JPY     0       500n\n//   \"1.234\"   BHD     3       1234n\ntoMinor(\"12.34\", \"EUR\"); // result ==> 1234n\ntoMinor(\"500\", \"JPY\"); // result ==> 500n\ntoMinor(\"1.234\", \"BHD\"); // result ==> 1234n\nassert.throws(() => toMinor(\"1.234\", \"EUR\")); // note: lança erro — EUR só tem 2 casas\n\n// Confusão possível: 1234n em EUR vs 1234n em BHD — o mesmo inteiro vale €12,34 ou 1,234 BHD. Sem moeda, não é dinheiro.\n// Para recordar: nunca assumir 2 casas; perguntar à moeda.\n// Pergunta: quanto dá toMinor(\"7.5\", \"EUR\")?\n// Resposta: 750n. A parte \"5\" é completada para \"50\" (2 casas), e \"7\" + \"50\" = 750.\n\n//--------------------------------------------------------------------\n// fromMinor() — inteiro → string para mostrar ao cliente\n// Para que serve: mostrar 5 cêntimos como \"0.05\" num recibo.\n// Regra essencial: só se converte para string na saída; as contas fazem-se sempre em inteiros.\n// O que guarda: s = os dígitos com zeros à esquerda; out = os dígitos com o ponto no sítio certo.\n\nfunction fromMinor(minor, currency) {\n  const exp = EXPONENT[currency];\n  const neg = minor \u003c 0n;\n  const s = (neg ? -minor : minor).toString().padStart(exp + 1, \"0\"); // 5n → \"005\"\n  const out = exp === 0 ? s : `${s.slice(0, -exp)}.${s.slice(-exp)}`; // \"0\" + \".\" + \"05\"\n  return (neg ? \"-\" : \"\") + out;\n}\n\n// Antes → operação → depois\n//   minor     moeda   s        depois\n//   5n        EUR     \"005\"    \"0.05\"\n//   -1234n    BHD     \"1234\"   \"-1.234\"\nfromMinor(5n, \"EUR\"); // result ==> \"0.05\"\nfromMinor(-1234n, \"BHD\"); // result ==> \"-1.234\"\n\n// Confusão possível: guardar \"0.05\" vs guardar 5n — a string é só para ler; guardar strings obriga a converter em cada conta.\n// Para recordar: inteiro dentro, string só à saída.\n// Pergunta: quanto dá fromMinor(500n, \"JPY\")?\n// Resposta: \"500\". JPY tem 0 casas, por isso não há ponto.\n\n//--------------------------------------------------------------------\n// divHalfEven() — dividir e arredondar o empate para o par (arredondamento bancário)\n// Para que serve: arredondar juros de 2,5 cêntimos sem favorecer sempre o banco ou sempre o cliente.\n// Regra essencial: só o empate exato (x,5) vai para o número par; o resto arredonda normalmente.\n// O que guarda: q = quociente inteiro; r = resto; twice = 2 × |resto|, para comparar com b sem frações.\n\nfunction divHalfEven(a, b) {\n  // a, b BigInt, b > 0\n  let q = a / b; // BigInt corta as decimais (em direção a zero)\n  const r = a % b;\n  const twice = 2n * (r \u003c 0n ? -r : r);\n  if (twice > b || (twice === b && q % 2n !== 0n)) q += a \u003c 0n ? -1n : 1n;\n  return q;\n}\n\n// Antes → operação → depois\n//   a / b       valor   q    empate?   depois\n//   25n / 10n   2,5     2    sim       2n  (2 já é par)\n//   35n / 10n   3,5     3    sim       4n  (sobe para o par)\n//   26n / 10n   2,6     2    não       3n  (passa de metade)\ndivHalfEven(25n, 10n); // result ==> 2n\ndivHalfEven(35n, 10n); // result ==> 4n\ndivHalfEven(26n, 10n); // result ==> 3n\ndivHalfEven(-25n, 10n); // result ==> -2n\n\n// Confusão possível: half-up vs half-even — half-up sobe sempre os empates, e em milhões de arredondamentos o erro acumula para cima; half-even equilibra.\n// Para recordar: empate vai para o par; arredondar uma vez, no fim.\n// Pergunta: quanto dá divHalfEven(45n, 10n)?\n// Resposta: 4n. 4,5 é empate e 4 já é par.\n\n//--------------------------------------------------------------------\n// pontos base (basis points) — taxas como inteiros\n// Para que serve: cobrar uma comissão de 1,5% sobre €1234,56 sem usar floats.\n// Regra essencial: 1 bp = 0,01%, logo 150 bp = 1,5%. Multiplicar primeiro, dividir por 10 000 no fim.\n// O que guarda: gross = cêntimos × bp (ainda sem dividir); fee = comissão em cêntimos, já arredondada.\n\nconst gross = 123456n * 150n; // result ==> 18518400n\nconst fee = divHalfEven(gross, 10000n); // result ==> 1852n\n\n// Antes → operação → depois\n//   passo                 valor\n//   123456n × 150n        18518400n\n//   ÷ 10000               1851,84 cêntimos\n//   half-even             1852n = €18,52\n\n// Confusão possível: 150 bp vs 150% — bp é centésimo de ponto percentual; 150 bp é só 1,5%.\n// Para recordar: multiplicar primeiro, dividir uma vez, arredondar uma vez.\n// Pergunta: quanto é a comissão de 100 bp sobre €10,00 (1000n)?\n// Resposta: 10n (€0,10). 1000 × 100 / 10000 = 10, sem resto.\n\n//--------------------------------------------------------------------\n// allocate() — dividir sem perder um cêntimo\n// Para que serve: dividir uma conta de €10,00 por 3 pessoas.\n// Regra essencial: a soma das partes TEM de dar o total. O que sobra vai, cêntimo a cêntimo, para o maior resto.\n// O que guarda: parts = a parte inteira de cada pessoa; rems = o resto de cada uma; left = cêntimos ainda por dar.\n\nfunction allocate(total, ratios) {\n  const sum = ratios.reduce((a, b) => a + b, 0n);\n  const parts = ratios.map((r) => (total * r) / sum);\n  const rems = ratios.map((r, i) => ({ i, rem: (total * r) % sum }));\n  let left = total - parts.reduce((a, b) => a + b, 0n);\n  rems.sort((x, y) => (y.rem > x.rem ? 1 : y.rem \u003c x.rem ? -1 : x.i - y.i)); // maior resto primeiro; empate → ordem original\n  for (let k = 0; left > 0n; k++, left--) parts[rems[k].i] += 1n;\n  return parts;\n}\n\n// Antes → operação → depois (1000n por [1, 1, 1])\n//   passo              parts               left\n//   divisão inteira    [333, 333, 333]     1\n//   +1 ao maior resto  [334, 333, 333]     0\nconst split = allocate(1000n, [1n, 1n, 1n]); // result ==> [334n, 333n, 333n]\nsplit.reduce((a, b) => a + b, 0n); // result ==> 1000n  (nenhum cêntimo perdido)\nallocate(100n, [70n, 30n]); // result ==> [70n, 30n]\n\n// Confusão possível: arredondar cada parte vs allocate — 1000/3 arredondado dá 333 × 3 = 999; perde-se 1 cêntimo.\n// Para recordar: a soma das partes é sempre o total.\n// Pergunta: quanto dá allocate(500n, [1n, 1n, 1n])?\n// Resposta: [167n, 167n, 166n]. 166 × 3 = 498; sobram 2 cêntimos para os dois primeiros (restos iguais → ordem original).\n```"},{"n":"2","title":"Ledger de dupla entrada","kind":"md","body":"### Ledger — cada movimento soma zero\n\n- Para que serve: um depósito de €100 fica registado para sempre, e o dinheiro nunca aparece nem desaparece.\n- Regra essencial: o ledger só cresce (append-only; nunca `UPDATE`). Cada transação tem ≥ 2 lançamentos (postings) que **somam 0**. O saldo é **derivado**: a soma dos lançamentos da conta (`SELECT SUM(amount) … WHERE account = 'alice'`, talvez com um snapshot em cache), nunca uma coluna editada.\n- O que guarda: cada lançamento `{ txId, account, amount, phase }`. `amount`: + entra na conta, − sai. Contas: clientes (`\"alice\"`), lojas (`\"merchant\"`) e contas internas do banco (`\"bank:cash\"`, juros, comissões), que podem ficar negativas.\n\n| Conta | Antes | `transfer(\"dep-1\", \"bank:cash\", \"alice\", 10000n)` | Depois |\n|-------|-------|---------------------------------------------------|--------|\n| `bank:cash` | 0 | −10000 | −10000 |\n| `alice` | 0 | +10000 | 10000 |\n| soma | 0 | | 0 |\n\n- Confusão possível: débito/crédito vs o sinal do código. Em contabilidade bancária, um depósito **debita** a caixa do banco (ativo sobe) e **credita** a conta do cliente (o depósito é um **passivo** do banco, que sobe). Os sinais mudam conforme a convenção; \"soma zero\" não muda.\n- Para recordar: cada transação soma 0; o saldo é derivado.\n- Pergunta: que acontece a uma transação com lançamentos −3000 e +2000?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nÉ recusada (\"does not sum to zero (−1000)\") e nada é gravado. Um ledger desequilibrado é um bug provado.\n\n\u003c/details>\n\n### Pendente vs liquidado + saldo disponível\n\n- Para que serve: a Alice paga €30 com cartão; o dinheiro fica retido mas ainda não saiu.\n- Regra essencial: a autorização só mexe na fase **pending**. Saldo liquidado não muda. **Disponível = liquidado − retenções a sair**; uma retenção a entrar não conta.\n- O que guarda: fase `committed` = dinheiro que se moveu; fase `pending` = retenções. Cada lançamento pendente leva `hold` = id da autorização, para somar por retenção.\n\n| Alice | Antes | `authorise(\"auth-1\", \"alice\", \"merchant\", 3000n)` | Depois |\n|-------|-------|---------------------------------------------------|--------|\n| liquidado | 10000 | — | 10000 |\n| pending | 0 | −3000 | −3000 |\n| disponível | 10000 | | 7000 |\n| merchant disponível | 0 | +3000 a entrar (não conta) | 0 |\n\n- Confusão possível: saldo vs saldo disponível — o cliente vê €100 no extrato, mas só pode gastar €70.\n- Para recordar: retido ≠ liquidado.\n- Pergunta: com €70 disponíveis, a Alice tenta reter mais €70. Passa?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nSim. 7000 não é menor que 7000, por isso há fundos; fica com 0 disponível.\n\n\u003c/details>\n\n### Liquidação parcial + estorno\n\n- Para que serve: a loja captura só €25 dos €30 (um artigo esgotou) e depois reembolsa os €25.\n- Regra essencial: liquidar = libertar a retenção inteira + lançar o valor final (pode ser menos, nunca mais). Corrigir = **estorno** (reversal): uma transação nova, ao contrário, com referência à original.\n- O que guarda: `settle` grava `set-1:release` (pending, anula a retenção) e `set-1` (committed, −2500/+2500). `reverse` grava o simétrico de cada lançamento de `set-1`, com `reverses: \"set-1\"`.\n\n| Alice | Antes | `settle(\"set-1\", \"auth-1\", 2500n)` | Depois | `reverse(\"ref-1\", \"set-1\")` | Depois |\n|-------|-------|-----------------------------------|--------|-----------------------------|--------|\n| liquidado | 10000 | −2500 | 7500 | +2500 | 10000 |\n| pending | −3000 | +3000 | 0 | — | 0 |\n| disponível | 7000 | | 7500 | | 10000 |\n\n- Confusão possível: captura parcial vs reembolso parcial — na captura parcial os €5 nunca saíram; o reembolso devolve dinheiro que já saiu.\n- Para recordar: o ledger só cresce; corrigir = estornar. `assertInvariants()` confirma que cada fase soma 0.\n- Pergunta: e se a loja tentasse liquidar €35?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nErro \"settlement above authorised amount\": 3500 > 3000 retidos.\n\n\u003c/details>\n\n- Na entrevista: \"Um ledger append-only de dupla entrada: cada transação soma zero, o saldo é derivado e as correções são estornos.\"\n\n→ `04-Payments.js` §2\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// Ledger — o livro onde cada movimento soma zero\n// Para que serve: registar cada euro que entra ou sai, sem nunca apagar nada.\n// Regra essencial: cada transação tem ≥ 2 lançamentos que somam 0; o saldo é a SOMA dos lançamentos, não uma column editada.\n// O que guarda: #entries = array só de acrescentar (append-only) de { txId, phase, account, amount };\n//               #txIds = ids já usados (impede a mesma transação duas vezes);\n//               #internal = contas internas do banco, que podem ficar negativas.\n//               amount: + entra na conta, − sai da conta. phase: \"committed\" (liquidado) ou \"pending\" (retido).\n\nclass Ledger {\n  #entries = []; // append-only: nunca se edita nem apaga\n  #txIds = new Set();\n  #internal = new Set();\n\n  openInternal(acc) { this.#internal.add(acc); }\n\n  #post(txId, phase, legs) {\n    if (this.#txIds.has(txId)) throw new Error(`duplicate tx ${txId}`);\n    if (legs.length \u003c 2) throw new Error(\"needs ≥ 2 entries\");\n    const sum = legs.reduce((s, l) => s + l.amount, 0n);\n    if (sum !== 0n) throw new Error(`tx ${txId} does not sum to zero (${sum})`);\n    this.#txIds.add(txId);\n    for (const l of legs) this.#entries.push(Object.freeze({ txId, phase, ...l }));\n  }\n\n  balance(acc, phase = \"committed\") {\n    return this.#entries\n      .filter((e) => e.account === acc && e.phase === phase)\n      .reduce((s, e) => s + e.amount, 0n);\n  }\n\n  // Disponível = liquidado − retenções a SAIR. Uma retenção a entrar não conta.\n  // Soma por retenção (hold): uma retenção libertada soma 0 e deixa de contar.\n  available(acc) {\n    const byHold = new Map(); // key = id da autorização; value = soma pendente dessa autorização nesta conta\n    for (const e of this.#entries)\n      if (e.account === acc && e.phase === \"pending\") byHold.set(e.hold, (byHold.get(e.hold) ?? 0n) + e.amount);\n    let held = 0n;\n    for (const v of byHold.values()) if (v \u003c 0n) held += v;\n    return this.balance(acc) + held;\n  }\n\n  #checkFunds(acc, amount) {\n    if (!this.#internal.has(acc) && this.available(acc) \u003c amount) throw new Error(`insufficient funds in ${acc}`);\n  }\n\n  transfer(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"committed\", [{ account: from, amount: -amount }, { account: to, amount }]);\n  }\n\n  // Autorização = retenção. Só mexe na fase pending.\n  authorise(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"pending\", [{ account: from, amount: -amount, hold: txId }, { account: to, amount, hold: txId }]);\n  }\n\n  // Liquidação: liberta a retenção e lança o valor final (pode ser \u003c autorizado).\n  settle(txId, authTxId, finalAmount) {\n    const auth = this.#entries.filter((e) => e.txId === authTxId);\n    const [from, to] = [auth.find((e) => e.amount \u003c 0n), auth.find((e) => e.amount > 0n)];\n    if (finalAmount > to.amount) throw new Error(\"settlement above authorised amount\");\n    this.#post(`${txId}:release`, \"pending\", auth.map((e) => ({ account: e.account, amount: -e.amount, hold: authTxId })));\n    this.#post(txId, \"committed\", [{ account: from.account, amount: -finalAmount }, { account: to.account, amount: finalAmount }]);\n  }\n\n  // Corrigir = nova transação, ao contrário, com referência à original. Nunca editar a original.\n  reverse(txId, originalTxId) {\n    const orig = this.#entries.filter((e) => e.txId === originalTxId && e.phase === \"committed\");\n    if (orig.length === 0) throw new Error(\"nothing to reverse\");\n    this.#post(txId, \"committed\", orig.map((e) => ({ account: e.account, amount: -e.amount, reverses: originalTxId })));\n  }\n\n  // Invariante global: a soma de TODOS os lançamentos, por fase, é zero.\n  assertInvariants() {\n    for (const phase of [\"pending\", \"committed\"]) {\n      const total = this.#entries.filter((e) => e.phase === phase).reduce((s, e) => s + e.amount, 0n);\n      assert.equal(total, 0n, `ledger unbalanced in phase ${phase}`);\n    }\n  }\n}\n\n// Antes → operação → depois (o que cada método escreve)\n//   método        fase                   lançamentos\n//   transfer      committed              from −X, to +X\n//   authorise     pending                from −X, to +X (só retém)\n//   settle        pending + committed    liberta a retenção (+X, −X) e lança o valor final\n//   reverse       committed              o oposto de cada lançamento da original\n\n// Confusão possível: débito/crédito vs o sinal deste código — aqui + é \"entra nesta conta\". Em contabilidade, um depósito\n//   DEBITA a caixa do banco (ativo sobe) e CREDITA a conta do cliente (passivo do banco sobe). Os sinais mudam; a soma zero não.\n// Para recordar: cada transação soma 0; o saldo é derivado; corrigir = estornar.\n// Pergunta: que acontece se uma transação tiver os lançamentos −3000n e +2000n?\n// Resposta: #post lança erro \"does not sum to zero (-1000)\". Nada é gravado: a verificação vem antes do push.\n\n//--------------------------------------------------------------------\n// transfer() — mover dinheiro já\n// Para que serve: depositar €100 na conta da Alice.\n// Regra essencial: uma conta desce e outra sobe o mesmo valor; o mesmo txId não entra duas vezes.\n// O que guarda: L = um ledger; \"bank:cash\" = conta interna do banco (pode ficar negativa); \"alice\" = cliente.\n\nconst L = new Ledger();\nL.openInternal(\"bank:cash\");\nL.transfer(\"dep-1\", \"bank:cash\", \"alice\", 10000n); // depósito de €100,00\n\n// Antes → operação → depois\n//   conta        antes   transfer(\"dep-1\", 10000n)   depois\n//   bank:cash    0       −10000                      −10000n\n//   alice        0       +10000                      10000n\n//   soma         0                                   0\nL.balance(\"alice\"); // result ==> 10000n\nL.balance(\"bank:cash\"); // result ==> -10000n\nassert.throws(() => L.transfer(\"dep-1\", \"bank:cash\", \"alice\", 1n), /duplicate/); // note: lança erro — mesmo txId duas vezes\n\n// Confusão possível: txId vs idempotency key — o txId impede a mesma transação no ledger; a key (§4) impede o mesmo request HTTP de correr duas vezes.\n// Para recordar: transferir = −X de um lado, +X do outro.\n// Pergunta: depois de L.transfer(\"dep-2\", \"bank:cash\", \"alice\", 500n), quanto dá L.balance(\"alice\")?\n// Resposta: 10500n. 10000 + 500; é um txId novo, por isso é aceite.\n\n//--------------------------------------------------------------------\n// authorise() — reter sem mover\n// Para que serve: a Alice paga €30 com cartão; o dinheiro fica preso, mas ainda não saiu.\n// Regra essencial: a retenção só mexe na fase pending. O saldo liquidado não muda; o disponível desce.\n// O que guarda: os lançamentos pending levam hold = \"auth-1\", para saber a que retenção pertencem.\n\nL.authorise(\"auth-1\", \"alice\", \"merchant\", 3000n);\n\n// Antes → operação → depois\n//   conta / saldo             antes    authorise €30   depois\n//   alice  liquidado          10000    —               10000n\n//   alice  pending            0        −3000           −3000n\n//   alice  disponível         10000    −3000           7000n\n//   merchant disponível       0        (+3000 a entrar não conta)   0n\nL.balance(\"alice\"); // result ==> 10000n  (o liquidado continua €100)\nL.balance(\"alice\", \"pending\"); // result ==> -3000n\nL.available(\"alice\"); // result ==> 7000n  (pode gastar €70)\nL.available(\"merchant\"); // result ==> 0n  (uma retenção a entrar não é dinheiro disponível)\nassert.throws(() => L.authorise(\"auth-2\", \"alice\", \"merchant\", 8000n), /insufficient/); // note: lança erro — 8000 > 7000 disponíveis\n\n// Confusão possível: saldo vs saldo disponível — saldo = liquidado; disponível = liquidado − retenções a sair.\n// Para recordar: retido ≠ liquidado.\n// Pergunta: a Alice tenta reter mais €70 (7000n). Passa?\n// Resposta: sim. available = 7000n e 7000 \u003c 7000 é falso, por isso não há erro. Ficaria com 0n disponível.\n\n//--------------------------------------------------------------------\n// settle() — libertar a retenção e mover o valor final\n// Para que serve: a loja só tinha 1 de 2 artigos e captura €25 dos €30 retidos.\n// Regra essencial: a liquidação liberta a retenção inteira e lança o valor final; pode ser menos, nunca mais.\n// O que guarda: auth = os lançamentos da autorização; from/to = quem paga e quem recebe; finalAmount = o valor capturado.\n\nL.settle(\"set-1\", \"auth-1\", 2500n);\n\n// Antes → operação → depois\n//   alice              antes    settle €25                 depois\n//   liquidado          10000    −2500                      7500n\n//   pending            −3000    +3000 (liberta)            0n\n//   disponível         7000     (os €5 voltam)             7500n\nL.balance(\"alice\"); // result ==> 7500n\nL.balance(\"alice\", \"pending\"); // result ==> 0n\nL.available(\"alice\"); // result ==> 7500n\n\n// Confusão possível: captura parcial vs reembolso parcial — na captura parcial os €5 nunca saíram (a retenção é libertada); um reembolso devolve dinheiro que já saiu.\n// Para recordar: liquidar = libertar a retenção + mover o valor final.\n// Pergunta: e se a loja tentasse liquidar €35 (3500n)?\n// Resposta: erro \"settlement above authorised amount\". 3500 > 3000 retidos.\n\n//--------------------------------------------------------------------\n// reverse() — corrigir com o lançamento oposto\n// Para que serve: reembolsar os €25 à Alice.\n// Regra essencial: nunca se edita a transação original; acrescenta-se outra, ao contrário, com referência (reverses).\n// O que guarda: orig = os lançamentos committed da transação original; o estorno grava o simétrico de cada um.\n\nL.reverse(\"ref-1\", \"set-1\");\n\n// Antes → operação → depois\n//   conta       antes    reverse(\"set-1\")   depois\n//   alice       7500     +2500              10000n\n//   merchant    2500     −2500              0n\nL.balance(\"alice\"); // result ==> 10000n\nL.balance(\"merchant\"); // result ==> 0n\nL.assertInvariants(); // note: lança erro se alguma fase não somar 0\n\n// Confusão possível: estorno vs UPDATE — um UPDATE apaga a história; o estorno mantém o erro e a correção, e a auditoria vê os dois.\n// Para recordar: o ledger só cresce; corrigir = estornar.\n// Pergunta: quantos lançamentos tem o ledger agora, contando dep-1, auth-1, set-1:release, set-1 e ref-1?\n// Resposta: 10. Cada uma das 5 transações tem 2 lançamentos; nada foi apagado.\n```"},{"n":"3","title":"Ciclo de vida de um pagamento com cartão","kind":"md","body":"### Ciclo de vida — estados, não uma chamada\n\n- Para que serve: uma encomenda de €30 → autorizar €30 → capturar €25 (um artigo esgotou) → liquidar → reembolsar €25.\n- Regra essencial: cada estado tem regras de dinheiro diferentes (retido, movido, devolvido). As armadilhas: capturar depois de a autorização expirar, ou fazer refund do que nunca foi capturado (isso é um void).\n- O que guarda: o pagamento tem um `status` e um `authExpiresAt`.\n\n```\nauthorise ──► capture ──► settle ──► refund / refund parcial\n    │                        └─────► dispute ──► chargeback (ganho/perdido)\n    └──► void / expire (retenção libertada)\n```\n\n| Passo | Antes → depois do dinheiro |\n|-------|----------------------------|\n| Authorise | O emissor diz sim e **retém** o valor. Nada se moveu ainda |\n| Capture | A loja reclama o valor (total ou parcial; o resto é libertado) |\n| Settle / clearing | O dinheiro move-se mesmo: emissor → rede → adquirente → loja (dias) |\n| Refund | Operação nova no sentido contrário; pode ser parcial |\n| Chargeback | O titular contesta junto do emissor; a loja perde o valor + uma taxa, salvo se provar o contrário |\n\n| Ator | Papel |\n|------|-------|\n| Titular (cardholder) | Dono do cartão |\n| Loja (merchant) | Vende; recebe o dinheiro |\n| Adquirente (acquirer) | O banco da loja |\n| Emissor (issuer) | O banco do titular; aprova ou recusa |\n| Rede (scheme) | Visa / Mastercard: regras e rede |\n| PSP | Stripe, Adyen, RocketGate: liga a loja ao adquirente |\n\n- Avançado: **Stripe PaymentIntent** — `requires_payment_method → requires_confirmation → requires_action (3DS) → processing / requires_capture → succeeded | canceled`. **3DS / SCA (PSD2)**: 2 de 3 fatores (sabes, tens, és); ex.: impressão digital (és) na app do banco no telemóvel (tens). Com 3DS, a responsabilidade pela fraude passa para o emissor.\n- Confusão possível: void vs refund — void cancela a retenção antes da captura; refund devolve dinheiro capturado.\n- Para recordar: autorizar retém; capturar reclama; liquidar move.\n- Pergunta: a loja autorizou €30 e o cliente desiste antes da captura. Refund ou void?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nVoid. Nada foi capturado, por isso só há uma retenção para libertar.\n\n\u003c/details>\n\n### Validade da autorização + máquina de estados\n\n- Para que serve: impedir a captura de uma autorização Visa feita na segunda-feira, se a loja só tentar na terça da semana seguinte.\n- Regra essencial: um passo só é válido se estiver na tabela de transições; uma autorização expirada conta como `expired`, que não tem saídas. Validade online (Stripe): Visa 7 dias CIT, 5 dias MIT (exatamente 4 d 18 h); Mastercard 7. Presencial: Visa 5 dias, Mastercard 2.\n- O que guarda: `TRANSITIONS` — key = estado atual; value = estados permitidos a seguir.\n\n| Estado | Pedido | Quando (validade 7 dias) | Estado efetivo | Depois |\n|--------|--------|--------------------------|----------------|--------|\n| authorised | captured | dia 1 | authorised | captured |\n| authorised | captured | dia 8 | expired | erro |\n| authorised | refunded | dia 1 | authorised | erro (é void) |\n\n- Confusão possível: CIT vs MIT — CIT = o cliente está presente a pagar; MIT = a loja cobra sozinha (ex.: rebill de uma subscrição). A Visa dá-lhes validades diferentes.\n- Para recordar: uma captura tardia é uma transição ilegal na tabela, não um if solto.\n- Pergunta: ao dia 8, um void funciona?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. O estado efetivo é `expired`, que não tem saídas: a retenção já se libertou sozinha.\n\n\u003c/details>\n\n- Na entrevista: \"Modelo o pagamento como uma máquina de estados com transições permitidas. Uma captura tardia é uma transição ilegal, não um if perdido.\"\n\n→ `04-Payments.js` §3\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// transition() — só deixar fazer os passos permitidos\n// Para que serve: impedir a loja de capturar uma autorização que já expirou.\n// Regra essencial: um passo só é válido se estiver na tabela. Uma autorização expirada conta como \"expired\".\n// O que guarda: TRANSITIONS — key = estado atual; value = estados para onde pode ir.\n//               payment = { status, authExpiresAt }; now = instante do request (ms).\n\nconst TRANSITIONS = {\n  authorised: [\"captured\", \"voided\", \"expired\"],\n  captured: [\"settled\", \"refunded\", \"partially_refunded\"],\n  settled: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  partially_refunded: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  disputed: [\"chargeback_lost\", \"chargeback_won\"],\n};\n\nfunction transition(payment, to, now = Date.now()) {\n  // Guarda de autorização tardia: depois de expirar, o estado efetivo é \"expired\".\n  const from = payment.status === \"authorised\" && now > payment.authExpiresAt ? \"expired\" : payment.status;\n  if (!(TRANSITIONS[from] ?? []).includes(to)) throw new Error(`illegal transition ${from} → ${to}`);\n  return { ...payment, status: to };\n}\n\nconst DAY = 86_400_000;\nconst p0 = { status: \"authorised\", authExpiresAt: 7 * DAY }; // validade de 7 dias\n\n// Antes → operação → depois\n//   estado        pedido       quando    estado efetivo   depois\n//   authorised    captured     dia 1     authorised       captured\n//   authorised    captured     dia 8     expired          erro\n//   authorised    refunded     dia 1     authorised       erro (sem captura → void, não refund)\ntransition(p0, \"captured\", 1 * DAY).status; // result ==> \"captured\"\nassert.throws(() => transition(p0, \"captured\", 8 * DAY), /expired → captured/); // note: lança erro — a retenção expirou\nassert.throws(() => transition(p0, \"refunded\", 1 * DAY), /authorised → refunded/); // note: lança erro — nada foi capturado\n\n// Confusão possível: void vs refund — void cancela uma retenção antes da captura (o dinheiro nunca saiu); refund devolve dinheiro capturado.\n// Para recordar: uma captura tardia é uma transição ilegal na tabela, não um if solto.\n// Pergunta: ao dia 8, transition(p0, \"voided\", 8 * DAY) funciona?\n// Resposta: não. O estado efetivo é \"expired\", que não tem saídas: a retenção já foi libertada sozinha.\n```"},{"n":"4","title":"Idempotência","kind":"md","body":"### Idempotency key + reserva única\n\n- Para que serve: um duplo clique em \"Pagar €10\" envia dois `POST /charges` com a mesma key → uma só cobrança.\n- Regra essencial: o cliente gera uma key (UUID v4; na Stripe vai no header `Idempotency-Key`, até 255 caracteres). O servidor **reserva** a key **antes** de cobrar; quem chega em segundo recebe 409 \"em curso\".\n- O que guarda: tabela `idempotency_keys` — `key` (UNIQUE), `request_hash`, `state` (`in_progress` / `done`), `response`.\n\n```sql\nINSERT INTO idempotency_keys (key, request_hash, state)\nVALUES ($1, $2, 'in_progress')\nON CONFLICT (key) DO NOTHING;      -- 0 rows = já existe → repetição ou 409\n```\n\n| Pedido | Linha `k1` antes | O que faz | Resposta | Cobranças |\n|--------|------------------|-----------|----------|-----------|\n| A | não existe | reserva e cobra | 201 | 1 |\n| B (ao mesmo tempo) | `in_progress` | não cobra | 409 | 1 |\n\n- Confusão possível: verificar-e-depois-inserir vs reservar — dois requests podem passar o \"existe?\" ao mesmo tempo; só o `UNIQUE` escolhe um vencedor.\n- Para recordar: reservar a key antes do efeito.\n- Pergunta: se o request B usasse a key `k2`, quantas cobranças haveria?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2. Keys diferentes são requests diferentes.\n\n\u003c/details>\n\n### Hash do request + response guardada + TTL\n\n- Para que serve: o cliente perde a response e repete `k1`; recebe a mesma response sem nova cobrança.\n- Regra essencial: mesma key + mesmo body → a response guardada (mesmo status + body). Mesma key + body diferente → erro (a Stripe compara os parâmetros). A Stripe v1 guarda também responses 500 e pode apagar keys com ≥ 24 h (TTL).\n- O que guarda: `request_hash` = hash do body; `response` = status + body da primeira execução.\n\n| Pedido | Linha `k1` antes | Resposta | Cobranças |\n|--------|------------------|----------|-----------|\n| `k1`, €10,00 (repetição) | `done` | 201 `{ chargeId: \"ch_1\" }` | 1 |\n| `k1`, €99,99 | `done` | 422 | 1 |\n| `k1` reutilizada 3 dias depois | apagada (TTL) | tratada como request novo | 2 |\n\n- Confusão possível: 409 vs 422 — 409 = o mesmo request ainda está a correr (tenta depois); 422 = key reutilizada com outro body (erro do cliente).\n- Para recordar: repetição devolve a mesma response; body diferente é recusado.\n- Pergunta: o body repetido tem os mesmos campos noutra ordem. Com `JSON.stringify` simples, que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n422: a ordem muda a string e portanto o hash. Em produção normaliza-se o body antes do hash.\n\n\u003c/details>\n\n### Escrita atómica + idempotência natural\n\n- Para que serve: garantir que o efeito (lançamentos no ledger) e a response guardada nunca ficam desencontrados.\n- Regra essencial: os dois na **mesma** transação da DB — ou ficam os dois, ou nenhum. Se os dados já têm um id único, usar esse: `UNIQUE(provider_event_id)` nos webhooks, `UNIQUE(order_id)` nas cobranças.\n- O que guarda: `entries` (o efeito) e `idempotency_keys.response` (a response).\n\n```sql\nBEGIN;\nINSERT INTO entries ...;                                          -- o efeito\nUPDATE idempotency_keys SET state = 'done', response = $r WHERE key = $1;\nCOMMIT;                                                           -- os dois ou nenhum\n```\n\n| Falha | Sem transação | Com transação |\n|-------|---------------|---------------|\n| Processo morre entre os dois passos | cobrado, key ainda `in_progress` | nada gravado; repetir é seguro |\n\n- Confusão possível: a cobrança no PSP fica fora desta transação — por isso a mesma key também vai para o PSP (§5).\n- Para recordar: efeito e response no mesmo `COMMIT`.\n- Pergunta: porque é que `UNIQUE(order_id)` dispensa uma key à parte?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nPorque a encomenda já identifica o request: uma segunda cobrança da mesma encomenda falha no `INSERT`.\n\n\u003c/details>\n\n- Na entrevista: \"Uma idempotency key com constraint única, reservada antes do efeito, com hash do request e response guardada para repetição.\"\n\n→ `04-Payments.js` §4\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// IdempotencyStore — mesma key, um só efeito\n// Para que serve: um duplo clique em \"Pagar €10\" envia dois requests com a mesma key; só se cobra uma vez.\n// Regra essencial: a key é RESERVADA antes de cobrar. O segundo request vê \"em curso\" e recebe 409.\n// O que guarda: #rows é um Map; key = idempotency key; value = { hash do body, state, response }.\n//               charges = quantas cobranças aconteceram de facto.\n\nclass IdempotencyStore {\n  #rows = new Map(); // em produção: uma table com UNIQUE(key)\n\n  async run(key, body, handler) {\n    const hash = crypto.createHash(\"sha256\").update(JSON.stringify(body)).digest(\"hex\");\n    const row = this.#rows.get(key);\n    if (row) {\n      if (row.hash !== hash) return { status: 422, body: \"same key, different request\" };\n      if (row.state === \"in_progress\") return { status: 409, body: \"request in progress, try again later\" };\n      return row.response; // repetição: a MESMA response, sem correr outra vez\n    }\n    this.#rows.set(key, { hash, state: \"in_progress\" }); // reservar ANTES do primeiro await = INSERT ... UNIQUE\n    try {\n      const response = { status: 201, body: await handler() };\n      this.#rows.set(key, { hash, state: \"done\", response });\n      return response;\n    } catch (err) {\n      this.#rows.delete(key); // shortcut: só é seguro se a falha veio antes de qualquer efeito\n      throw err;\n    }\n  }\n}\n\nconst store = new IdempotencyStore();\nlet charges = 0;\nconst charge = async () => { await new Promise((r) => setTimeout(r, 5)); return { chargeId: `ch_${++charges}` }; };\nconst body = { amount: 1000, currency: \"EUR\" };\n\nasync function concurrentIdempotencyDemo() {\n  const [a, b] = await Promise.all([store.run(\"k1\", body, charge), store.run(\"k1\", body, charge)]);\n\n  // Antes → operação → depois\n  //   request  row \"k1\" antes     o que faz              response\n  //   A        não existe         reserva e cobra        201\n  //   B        in_progress        não cobra              409\n  [a.status, b.status].sort(); // result ==> [201, 409]\n  charges; // result ==> 1  (cobrado uma vez)\n}\n\n// Confusão possível: verificar-e-depois-inserir vs reservar — dois requests podem passar o \"existe?\" ao mesmo tempo; só a reserva atómica (UNIQUE) decide um vencedor.\n// Para recordar: reservar a key antes do efeito.\n// Pergunta: se o segundo request usasse a key \"k2\", quanto daria charges?\n// Resposta: 2. Keys diferentes são requests diferentes; cada um cobra.\n\n//--------------------------------------------------------------------\n// response guardada + hash do request — repetir em segurança\n// Para que serve: o cliente perdeu a response e repete o request \"k1\"; recebe a mesma response, sem nova cobrança.\n// Regra essencial: mesma key + mesmo body → response guardada. Mesma key + body diferente → 422.\n// O que guarda: replay = a response guardada na primeira vez; o hash do body distingue \"mesmo request\" de \"request diferente\".\n\nasync function replayIdempotencyDemo() {\n  const replay = await store.run(\"k1\", body, charge);\n\n  // Antes → operação → depois\n  //   request              row \"k1\" antes     response    charges\n  //   k1, €10,00           done               201 ch_1    1\n  //   k1, €99,99           done               422         1\n  replay; // result ==> { status: 201, body: { chargeId: \"ch_1\" } }\n  charges; // result ==> 1\n  (await store.run(\"k1\", { amount: 9999, currency: \"EUR\" }, charge)).status; // result ==> 422\n}\n\n// Confusão possível: 409 vs 422 — 409 = mesmo request ainda em curso (tenta mais tarde); 422 = key reutilizada com outro body (erro do cliente).\n// Para recordar: repetição devolve a mesma response; body diferente é recusado.\n// Avançado: a Stripe guarda também responses 500; aqui um erro apaga a key, o que só é seguro se nada foi cobrado.\n// Pergunta: o cliente repete \"k1\" com { currency: \"EUR\", amount: 1000 } (mesmos values, outra ordem). Que recebe aqui?\n// Resposta: 422. JSON.stringify depende da ordem das keys, por isso o hash muda; em produção normaliza-se o body antes do hash.\n```"},{"n":"5","title":"Retries","kind":"md","body":"### Que erros repetir\n\n- Para que serve: o PSP responde 503 duas vezes e depois funciona; um cartão recusado nunca se repete.\n- Regra essencial: só se repete o que pode passar sozinho. Retries maus derrubam um serviço que está a recuperar e duplicam cobranças.\n- O que guarda: `err.status` (HTTP) e `err.code` (`ETIMEDOUT`, `card_declined`, …).\n\n| Repetir | Não repetir |\n|---------|-------------|\n| Timeout, `ECONNRESET` | 4xx de validação |\n| 5xx, 429 (respeitar `Retry-After`) | Recusa do emissor (`card_declined`) |\n| — | Suspeita de fraude, cartão roubado |\n\n- Confusão possível: 429 é 4xx mas é temporário (\"estás a pedir demais\").\n- Para recordar: uma recusa é uma response, não uma falha.\n- Pergunta: `isRetryable({ status: 402, code: \"card_declined\" })`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`false`. O emissor respondeu \"não\"; repetir não muda a response.\n\n\u003c/details>\n\n### Backoff + jitter, numa só camada, com orçamento\n\n- Para que serve: 10 000 clientes falham ao mesmo tempo; sem jitter repetiam todos no mesmo instante.\n- Regra essencial: espera = `aleatório(0, min(teto, base · 2^n))` (full jitter). Repetir numa **só** camada: tentativas aninhadas multiplicam (AWS: 3 tentativas × 5 camadas = **243×** carga na DB). Orçamento (retry budget): um token bucket por cliente; sem tokens, sem retry.\n- O que guarda: `attempt` = n.º da tentativa; `base` = 100 ms; `cap` = 5000 ms.\n\n| Tentativa | `base · 2^n` | Com teto | `rand` | Espera |\n|-----------|--------------|----------|--------|--------|\n| 0 | 100 | 100 | 0.999 | 99 ms |\n| 3 | 800 | 800 | 0.5 | 400 ms |\n| 20 | 104 857 600 | 5000 | 0.999 | 4995 ms |\n\n- Confusão possível: backoff vs jitter — backoff faz a espera crescer; jitter espalha os clientes. Precisa-se dos dois.\n- Para recordar: crescer + aleatório + teto, numa camada.\n- Pergunta: um cliente com 10 tokens de retry, a meio de uma falha geral, tenta o 11.º retry. Que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nFalha logo, sem repetir: não há tokens. Assim não acrescenta carga a quem está a recuperar.\n\n\u003c/details>\n\n### Resultado desconhecido\n\n- Para que serve: o PSP cobra a encomenda 42, mas a response perde-se num timeout.\n- Regra essencial: timeout ≠ falha. Antes de repetir, consultar o PSP com a **mesma** key (`psp.find(key)`). Se não for possível, marcar `unknown` e deixar a reconciliação (§8) decidir.\n- O que guarda: `psp.charges` — key = key do request (`\"order-42\"`); value = a cobrança.\n\n| Tentativa | O que faz | `psp.charges` | Resultado |\n|-----------|-----------|---------------|-----------|\n| 0 | `charge` | `order-42 → ch_1` | timeout (mas cobrou!) |\n| 1 | `find(\"order-42\")` | igual | `ch_1`, sem nova cobrança |\n\n- Confusão possível: \"deu erro\" vs \"não sei\" — o PSP pode ter cobrado e só a response se perdeu.\n- Para recordar: timeout = \"ainda não sei\".\n- Pergunta: sem o `find` e com um PSP que ignora a key, quantas cobranças?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2. A primeira aconteceu apesar do timeout; a segunda seria nova.\n\n\u003c/details>\n\n- Na entrevista: \"Só repito erros temporários, com backoff e jitter, numa camada, dentro de um orçamento. Um timeout é um resultado desconhecido: verifico antes de repetir.\"\n\n→ `04-Payments.js` §5\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// isRetryable() — o erro pode passar sozinho?\n// Para que serve: o PSP responde 503 → tentar outra vez; o banco recusa o cartão → nunca repetir.\n// Regra essencial: só se repete o que é temporário (timeout, ligação cortada, 5xx, 429).\n// O que guarda: err.status = código HTTP; err.code = código do erro (ETIMEDOUT, card_declined, …).\n\nfunction isRetryable(err) {\n  if (err.code === \"ETIMEDOUT\" || err.code === \"ECONNRESET\") return true;\n  if (err.status === 429 || (err.status >= 500 && err.status \u003c= 599)) return true;\n  return false; // 4xx, recusa do emissor (card_declined), fraude → nunca repetir\n}\n\n// Antes → operação → depois\n//   erro                       temporário?   depois\n//   503                        sim           true\n//   402 card_declined          não           false\n//   400 (validação)            não           false\nisRetryable({ status: 503 }); // result ==> true\nisRetryable({ status: 402, code: \"card_declined\" }); // result ==> false\nisRetryable({ status: 400 }); // result ==> false\n\n// Confusão possível: 429 vs 4xx — 429 é 4xx mas é temporário (\"estás a pedir demais\"); repete-se respeitando Retry-After.\n// Para recordar: repetir só o temporário; uma recusa é uma response, não uma falha.\n// Pergunta: quanto dá isRetryable({ code: \"ECONNRESET\" })?\n// Resposta: true. A ligação caiu; o request pode resultar numa nova tentativa.\n\n//--------------------------------------------------------------------\n// backoff() — esperar cada vez mais, a um tempo aleatório (\"full jitter\")\n// Para que serve: 10 000 clientes falham ao mesmo tempo; sem jitter repetiam todos no mesmo milissegundo.\n// Regra essencial: espera = aleatório(0, min(teto, base · 2^tentativa)).\n// O que guarda: attempt = número da tentativa (0, 1, 2…); rand = function que dá um número em [0, 1); base = 100 ms; cap = 5000 ms.\n\nconst backoff = (attempt, rand, base = 100, cap = 5000) => Math.floor(rand() * Math.min(cap, base * 2 ** attempt));\n\n// Antes → operação → depois\n//   attempt   base · 2^n   teto aplicado   rand    depois\n//   0         100          100             0.999   99\n//   3         800          800             0.5     400\n//   20        104857600    5000            0.999   4995\nbackoff(0, () => 0.999); // result ==> 99\nbackoff(3, () => 0.5); // result ==> 400\nbackoff(20, () => 0.999); // result ==> 4995  (nunca acima do teto)\n\n// Confusão possível: backoff vs jitter — backoff faz a espera crescer; jitter espalha os clientes no tempo. Precisa-se dos dois.\n// Para recordar: crescer + aleatório + teto.\n// Pergunta: quanto dá backoff(2, () => 0.5)?\n// Resposta: 200. 100 · 2² = 400, abaixo do teto; 0.5 × 400 = 200.\n\n//--------------------------------------------------------------------\n// withRetry() — repetir só o que é temporário, até um limite\n// Para que serve: o PSP dá 503 duas vezes e à terceira responde \"ok\".\n// Regra essencial: para logo se o erro não for temporário ou se chegou ao máximo de tentativas.\n// O que guarda: attempt = tentativa atual; maxAttempts = limite (4); calls/declines = quantas vezes a function correu.\n\nasync function withRetry(fn, { maxAttempts = 4, sleep = async () => {}, rand = Math.random } = {}) {\n  for (let attempt = 0; ; attempt++) {\n    try {\n      return await fn(attempt); // sucesso: o return termina o loop\n    } catch (err) {\n      if (!isRetryable(err) || attempt + 1 >= maxAttempts) throw err;\n      await sleep(backoff(attempt, rand));\n    }\n  }\n}\n\nasync function retryDemo() {\n  let calls = 0;\n  const flaky = async () => { calls++; if (calls \u003c 3) throw { status: 503 }; return \"ok\"; };\n  // Antes → operação → depois (uma linha por tentativa)\n  //   attempt   calls   resultado   decisão\n  //   0         1       503         repetir\n  //   1         2       503         repetir\n  //   2         3       \"ok\"        devolver\n  await withRetry(flaky); // result ==> \"ok\"\n  calls; // result ==> 3\n\n  let declines = 0;\n  await assert.rejects(withRetry(async () => { declines++; throw { status: 402, code: \"card_declined\" }; })); // note: rejeita — a recusa volta logo\n  declines; // result ==> 1  (uma recusa não se repete)\n}\n\n// Confusão possível: maxAttempts vs retries — maxAttempts = 4 são 4 calls no total (1 + 3 repetições), não 4 repetições.\n// Para recordar: temporário → espera e repete; definitivo → falha já.\n// Pergunta: se flaky falhasse sempre com 503, quantas vezes corria?\n// Resposta: 4. À 4.ª falha, attempt + 1 >= 4 e o erro é lançado.\n\n//--------------------------------------------------------------------\n// retries em camadas — porque só se repete numa camada\n// Para que serve: perceber porque um pequeno problema na DB vira uma avalanche.\n// Regra essencial: 3 tentativas em cada uma de 5 camadas multiplicam: 3^5 requests chegam à DB.\n// O que guarda: nada; é a conta da multiplicação.\n\n3 ** 5; // result ==> 243\n\n// Antes → operação → depois\n//   camadas   requests à DB por cada request do cliente\n//   1         3\n//   2         9\n//   5         243\n\n// Confusão possível: limite por camada vs limite global — 3 por camada parece pouco, mas os limites multiplicam-se. Usar uma camada e um orçamento (retry budget: sem tokens, sem retry).\n// Para recordar: retries aninhados multiplicam a carga.\n// Pergunta: e 2 tentativas em 4 camadas?\n// Resposta: 16. 2^4 = 16 requests à DB.\n\n//--------------------------------------------------------------------\n// resultado desconhecido — timeout depois de cobrar\n// Para que serve: o PSP cobra a encomenda 42, mas a response perde-se num timeout. Não cobrar outra vez.\n// Regra essencial: timeout ≠ falha. Antes de repetir, perguntar \"já aconteceu?\" e usar a MESMA key.\n// O que guarda: psp.charges é um Map; key = key do request (\"order-42\"); value = { id, amount } da cobrança.\n//               dropNext = true faz a primeira response perder-se.\n\nasync function unknownOutcomeDemo() {\n  const psp = { charges: new Map(), dropNext: true };\n  psp.charge = async (key, amount) => {\n    if (!psp.charges.has(key)) psp.charges.set(key, { id: `ch_${psp.charges.size + 1}`, amount });\n    if (psp.dropNext) { psp.dropNext = false; throw { code: \"ETIMEDOUT\" }; } // cobrou, mas a response perdeu-se\n    return psp.charges.get(key);\n  };\n  psp.find = async (key) => psp.charges.get(key) ?? null;\n\n  const key = \"order-42\";\n  const result = await withRetry(async (attempt) => (attempt > 0 && (await psp.find(key))) || psp.charge(key, 1000));\n\n  // Antes → operação → depois\n  //   attempt   o que faz            psp.charges     resultado\n  //   0         charge               order-42 → ch_1 ETIMEDOUT (cobrou!)\n  //   1         find(\"order-42\")     igual           ch_1 (não cobra outra vez)\n  result.id; // result ==> \"ch_1\"\n  psp.charges.size; // result ==> 1  (cobrado uma vez)\n}\n\n// Confusão possível: \"deu erro\" vs \"não sei\" — um timeout pode esconder uma cobrança feita. Se não for possível consultar, marcar \"unknown\" e deixar a reconciliação (§8) decidir.\n// Para recordar: timeout = \"ainda não sei\", não \"falhou\".\n// Pergunta: se o retry não chamasse find e o PSP ignorasse a key, quantas cobranças haveria?\n// Resposta: 2. A primeira aconteceu mesmo, apesar do timeout, e a segunda seria nova.\n```"},{"n":"6","title":"Concorrência","kind":"md","body":"### Corrida no saldo (lost update) + update condicional\n\n- Para que serve: impedir que dois levantamentos de €30 de uma conta com €50 passem os dois (double-spend).\n- Regra essencial: a armadilha é ler → verificar no código → escrever; entre a leitura e a escrita o mundo mudou. Caso simples: deixar a DB verificar numa só row — `UPDATE accounts SET balance = balance - 3000 WHERE id = $id AND balance >= 3000`; 0 rows alteradas = recusado.\n- O que guarda: `acc.balance` = saldo partilhado; `read` = a cópia velha que cada request leu.\n\n| Passo | Pedido A | Pedido B | Saldo |\n|-------|----------|----------|-------|\n| ler | 5000 | 5000 | 5000 |\n| verificar | 5000 ≥ 3000 | 5000 ≥ 3000 | 5000 |\n| escrever | 5000 − 3000 | 5000 − 3000 | 2000 (saíram €60, desceu €30) |\n\n- Confusão possível: mutex em Go (`sync.Mutex`) vs lock na DB — o mutex protege a memória de um processo; com 2 réplicas, cada uma tem o seu e os dois levantamentos passam. O lock vive na DB.\n- Para recordar: nunca verificar o saldo no código entre ler e escrever.\n- Pergunta: com o `UPDATE` condicional, o segundo levantamento de €30 vê que saldo?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2000. O primeiro já escreveu; `2000 >= 3000` é falso, 0 rows alteradas → recusado.\n\n\u003c/details>\n\n### Escolher a ferramenta: version, FOR UPDATE, SERIALIZABLE, UNIQUE, um escritor\n\n- Para que serve: escolher a proteção certa para o tipo de conflito.\n- Regra essencial: a DB é o árbitro. Lock otimista: `UPDATE … WHERE version = $lida`; 0 rows → reler e decidir de novo.\n- O que guarda: `accounts.version` = contador que sobe a cada escrita.\n\n```sql\nUPDATE accounts SET balance = $new, version = version + 1\nWHERE id = $id AND version = $read_version;   -- 0 rows → conflito, reler\n```\n\n| Situação | Ferramenta | Antes → depois |\n|----------|------------|----------------|\n| Conflitos raros | `version` (otimista) | A escreve v0→v1; B falha, relê 2000, recusa |\n| Muitos requests na mesma conta | `SELECT … FOR UPDATE` (trancar por ordem de id, evita deadlock) | B espera que A faça `COMMIT` |\n| Regra sobre várias rows (\"máx. €1000/dia em todas as contas\") | `SERIALIZABLE`; erro Postgres `40001` → repetir a transação toda | a segunda transação falha e repete |\n| \"Só um pode ganhar\" (um refund por pagamento) | `UNIQUE(payment_id)` | o 2.º `INSERT` falha |\n| Volume muito alto | um escritor por conta (queue/partição por `account_id`) **[inferido]** | a corrida deixa de existir |\n\n- Confusão possível: lock otimista vs `FOR UPDATE` — o otimista não bloqueia e repete em conflito; `FOR UPDATE` bloqueia a row até ao fim da transação.\n- Para recordar: a versão diz se alguém chegou primeiro.\n- Pergunta: com `version`, dois levantamentos de €20 de €50 — quanto fica?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n€10. B falha a primeira escrita, relê 3000 (v1), 3000 ≥ 2000, escreve 1000 (v2). Passam os dois.\n\n\u003c/details>\n\n- Na entrevista: \"A DB é o árbitro: update condicional, versão ou FOR UPDATE. Nunca verifico o saldo no código entre uma leitura e uma escrita.\"\n\n→ `04-Payments.js` §6\n\n### Code (04-Payments.js)\n\n```js\nconst tick = () => new Promise((r) => setImmediate(r));\n\n//--------------------------------------------------------------------\n// lost update — ler, esperar, escrever\n// Para que serve: mostrar o bug em que dois levantamentos de €30 de uma conta com €50 passam os dois.\n// Regra essencial: entre ler o saldo e escrevê-lo, outro request pode ter mudado o saldo.\n// O que guarda: acc.balance = saldo partilhado; read = a cópia que cada request leu.\n\nasync function lostUpdateDemo() {\n  const acc = { balance: 5000n };\n  const naiveWithdraw = async (amt) => {\n    const read = acc.balance;\n    await tick(); // o outro \"request\" corre aqui\n    if (read \u003c amt) throw new Error(\"insufficient funds\");\n    acc.balance = read - amt;\n  };\n  await Promise.all([naiveWithdraw(3000n), naiveWithdraw(3000n)]);\n\n  // Antes → operação → depois\n  //   passo         request A       request B       acc.balance\n  //   ler           read = 5000     read = 5000     5000\n  //   verificar     5000 ≥ 3000     5000 ≥ 3000     5000\n  //   escrever      5000 − 3000     5000 − 3000     2000 (saíram €60, desceu €30)\n  acc.balance; // result ==> 2000n  (BUG)\n}\n\n// Confusão possível: verificar no código vs verificar na DB — o if no código vê um value velho; a DB vê o value atual (UPDATE ... WHERE balance >= 3000).\n// Para recordar: nunca ler → verificar → escrever sem proteção.\n// Pergunta: com 3 levantamentos de €30 em simultâneo, quanto daria acc.balance?\n// Resposta: 2000n. Os três leem 5000 e todos escrevem 5000 − 3000; saem €90 e o saldo só desce €30.\n\n//--------------------------------------------------------------------\n// lock otimista (version) — escrever só se ninguém mudou a row\n// Para que serve: corrigir o bug anterior: dos dois levantamentos de €30, só um passa.\n// Regra essencial: UPDATE ... WHERE version = $lida. 0 rows alteradas = conflito → ler outra vez e decidir de novo.\n// O que guarda: row = { balance, version }; compareAndSet devolve false se a versão mudou (= 0 rows alteradas).\n\nasync function optimisticLockDemo() {\n  const row = { balance: 5000n, version: 0 };\n  const compareAndSet = (expectedVersion, balance) => {\n    if (row.version !== expectedVersion) return false;\n    Object.assign(row, { balance, version: row.version + 1 });\n    return true;\n  };\n  const safeWithdraw = async (amt) => {\n    for (;;) {\n      const { balance, version } = { ...row };\n      await tick();\n      if (balance \u003c amt) return \"declined\";\n      if (compareAndSet(version, balance - amt)) return \"ok\";\n    }\n  };\n  const results = await Promise.all([safeWithdraw(3000n), safeWithdraw(3000n)]);\n\n  // Antes → operação → depois\n  //   passo                       A                   B                        row\n  //   ler                         5000, v0            5000, v0                 5000, v0\n  //   escrever (WHERE v = 0)      ok                  0 rows → reler          2000, v1\n  //   reler e verificar           —                   2000 \u003c 3000 → declined   2000, v1\n  results.sort(); // result ==> [\"declined\", \"ok\"]\n  row.balance; // result ==> 2000n\n  row.version; // result ==> 1\n}\n\n// Confusão possível: lock otimista vs FOR UPDATE — o otimista não bloqueia e repete em conflito (bom se os conflitos são raros); FOR UPDATE bloqueia a row (bom se muitos requests batem na mesma conta).\n// Para recordar: a DB é o árbitro; a versão diz se alguém chegou primeiro.\n// Pergunta: se os dois levantamentos fossem de €20, quanto daria row.balance?\n// Resposta: 1000n. B falha a primeira escrita, relê 3000 (v1), 3000 ≥ 2000, escreve 1000 (v2). Os dois passam.\n\n//--------------------------------------------------------------------\n// Correr os exemplos assíncronos por ordem (fora da resposta escondida do último bloco).\n(async () => {\n  await concurrentIdempotencyDemo();\n  await replayIdempotencyDemo();\n  await retryDemo();\n  await unknownOutcomeDemo();\n  await lostUpdateDemo();\n  await optimisticLockDemo();\n  console.log(\"✅ Payments OK\");\n})().catch((err) => {\n  console.error(\"❌\", err);\n  process.exit(1);\n});\n```"},{"n":"7","title":"Consistência entre sistemas","kind":"md","body":"### Outbox — publicar um evento sem o perder\n\n- Para que serve: o ledger lança um pagamento de €25 e o serviço de emails tem de receber `payment.succeeded`.\n- Regra essencial: sem transação distribuída. `db.commit(); kafka.publish()` perde o evento se o processo morrer entre os dois. Em vez disso, escrever o evento numa tabela `outbox` na **mesma** transação; um relay publica-o depois.\n- O que guarda: `outbox` — `event_id`, `type`, `payload`, e se já foi enviado.\n\n```sql\nBEGIN;\nINSERT INTO entries ...;\nINSERT INTO outbox (event_id, type, payload) VALUES ($e, 'payment.succeeded', $p);\nCOMMIT;   -- o relay lê a outbox e publica no Kafka\n```\n\n| Processo morre depois do COMMIT | `entries` | Evento |\n|---------------------------------|-----------|--------|\n| `commit` + `publish` direto | gravado | perdido |\n| Outbox | gravado | na `outbox`; o relay publica quando voltar |\n\n- Confusão possível: outbox vs \"publicar e depois gravar\" — ao contrário também falha: evento enviado de um pagamento que nunca foi gravado.\n- Para recordar: evento e dados no mesmo `COMMIT`.\n- Pergunta: o relay publica e morre antes de marcar a row como enviada. Que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nPublica o mesmo evento outra vez quando voltar. É entrega at-least-once — o consumidor tem de ser idempotente.\n\n\u003c/details>\n\n### At-least-once + consumidor idempotente\n\n- Para que serve: o evento `e1` chega duas vezes e o email só sai uma vez.\n- Regra essencial: um evento pode chegar 2×. O consumidor regista `event_id` numa tabela `processed_events` com `UNIQUE`, **dentro** da transação do efeito. \"Exactly-once\" na prática = at-least-once + deduplicação.\n- O que guarda: `processed_events.event_id` = eventos já tratados.\n\n| Chegada | `INSERT … ON CONFLICT DO NOTHING` | Efeito |\n|---------|-----------------------------------|--------|\n| `e1` (1.ª) | 1 row | aplica |\n| `e1` (2.ª) | 0 rows = já visto | ignora |\n\n- Avançado: **ordem no Kafka** — key = `account_id`; a ordem só vale dentro de uma partição. **Saga** — desfazer um fluxo de vários passos com **compensações** (refund, libertar a retenção), não com rollback: reter €300 → reservar o voo → emissão falha → cancelar a reserva e libertar a retenção. **Webhooks** — verificar a assinatura HMAC, deduplicar por id, responder 2xx depressa e processar de uma queue; podem chegar fora de ordem (`refunded` antes de `succeeded`): usar a máquina de estados (§3) e ignorar passos para trás, ou reler o object na API.\n- Confusão possível: registar o `event_id` fora da transação do efeito — se o efeito falhar, o evento fica \"visto\" e nunca é aplicado.\n- Para recordar: exactly-once = at-least-once + dedupe.\n- Pergunta: um webhook `refunded` chega antes de `succeeded`. Que faz a máquina de estados?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nAplica `refunded` se a transição for válida a partir do estado atual; quando `succeeded` chega depois, é um passo para trás e é ignorado.\n\n\u003c/details>\n\n- Na entrevista: \"Outbox para publicar, consumidores idempotentes para receber, sagas com compensações entre serviços. Exactly-once é at-least-once com dedupe.\""},{"n":"8","title":"Reconciliação e liquidação","kind":"md","body":"### Reconciliação — comparar linha a linha\n\n- Para que serve: comparar o ledger com os relatórios do PSP e o extrato do banco; é a rede de segurança que apanha o que a idempotência e os retries falharam.\n- Regra essencial: linha a linha, por referência externa — nunca pelo total do dia. Diferenças vão para uma queue de exceções para humanos; nunca \"acertar\" um saldo à mão sem um lançamento.\n- O que guarda: de cada lado, id externo (charge id, end-to-end id), valor, moeda e data.\n\n| PSP | Ledger | Resultado |\n|-----|--------|-----------|\n| `ch_1` €25,00 | `set-1` €25,00 | casado |\n| `ch_2` €10,00 | nada | queue de exceções |\n| depósito líquido €24,30 | `set-1` €25,00 | lançar a comissão de €0,70 |\n\n| Passo | O que fazer |\n|-------|-------------|\n| Casar | Pelo id externo; depois valor + moeda + data |\n| Diferenças | Falta no PSP, falta do nosso lado, valor diferente, duplicado |\n| Comissões | A liquidação chega **líquida** de comissões: lançar a comissão no ledger |\n| Tempo | T+1 / T+2: o dinheiro chega dias depois da captura |\n\n- Confusão possível: totais iguais não provam nada — um duplicado e uma falta do mesmo valor anulam-se no total.\n- Para recordar: linha a linha, por referência.\n- Pergunta: o total do dia bate certo. Pode haver erro?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nSim: uma cobrança duplicada e outra em falta, do mesmo valor, dão o mesmo total.\n\n\u003c/details>\n\n### Registo de câmbio (FX) — conversão reproduzível\n\n- Para que serve: converter €100 em USD e conseguir provar o valor meses depois numa auditoria.\n- Regra essencial: guardar a taxa, a fonte, o instante e os dois valores; nunca recalcular depois. Arredondar para a unidade mínima com half-even (§1). Se a fonte principal falhar, usar uma secundária com idade máxima; se as duas falharem, recusar em vez de inventar.\n- O que guarda: `{ from: \"EUR\", to: \"USD\", rate: \"1.08425\", source: \"primary\", at: \"2026-11-13T15:00:00Z\", amountFrom: 10000n, amountTo: 10842n }`.\n\n| Passo | Valor |\n|-------|-------|\n| €100,00 × 1.08425 | $108,425 (empate) |\n| half-even | $108,42 (`10842n`, o 2 é par) |\n| Principal em baixo, secundária com 2 h, máximo 1 h | recusar a conversão |\n\n- Confusão possível: guardar só a taxa vs guardar a taxa + fonte + instante — sem a fonte e o instante, ninguém consegue verificar a taxa.\n- Para recordar: o valor convertido tem de ser reproduzível.\n- Pergunta: €100,00 a uma taxa de 1.08435, quanto dá em cêntimos de USD?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`10844n`. 10843,5 é empate; 10843 é ímpar, por isso sobe para o par 10844.\n\n\u003c/details>\n\n- Na entrevista: \"Reconciliação diária, linha a linha, por referência externa. Em FX guardo a taxa, a fonte e o instante — o valor tem de ser reproduzível.\""},{"n":"9","title":"Redes de pagamento e glossário curto","kind":"md","body":"| Termo | Numa linha | Exemplo |\n|-------|------------|---------|\n| SEPA SCT | Transferência em euros; liquida no dia útil seguinte | Renda enviada na sexta chega na segunda |\n| SEPA SCT Inst | Instantânea, 24/7, ≤ 10 s; o Regulamento (UE) 2024/886 obriga os PSP da zona euro a enviá-la desde 9 out 2025 | €20 a um amigo no domingo à noite chega em segundos |\n| SEPA SDD | Débito direto; precisa de mandato; o devedor pode contestar | O ginásio puxa €30 por mês |\n| SWIFT | Rede de mensagens entre bancos (internacional); sozinha não move dinheiro | Um pagamento EUR → USD para um banco nos EUA |\n| ISO 20022 | Padrão de mensagens XML. `pain` cliente↔banco, `pacs` banco↔banco, `camt` extratos | Ver a linha seguinte |\n| Exemplos | `pain.001` ordem, `pacs.008` transferência, `pacs.002` estado, `camt.053` extrato | Ficheiro de salários da empresa = `pain.001` |\n| Redes de cartões | Visa, Mastercard, Amex: regras, rede, taxas de intercâmbio | O emissor ganha intercâmbio em cada compra |\n| IBAN / BIC | Id da conta / id do banco | `DE89 3704 0044 0532 0130 00` / `DEUTDEFF` |\n| KYC / AML | Conhecer o cliente / anti-branqueamento (screening, monitorização) | Verificar o documento no registo; nomes contra listas de sanções |\n| PCI DSS | Regras para dados de cartão. **Nunca** guardar o PAN completo nem o CVV | Guardar `last4: \"4242\"`, nunca os 16 dígitos |\n| Tokenização | O PSP guarda o cartão; tu guardas um token (`pm_...`) | Cobrar `pm_123` no mês seguinte, sem dados do cartão do teu lado |\n\n- **[inferido]** Os exemplos ISO 20022 acima são de memória; a página oficial (iso20022.org) devolveu 403.\n- Confusão possível: SWIFT vs SEPA — SWIFT só transporta mensagens; SEPA é um esquema de pagamento em euros com regras de liquidação.\n- Para recordar: cartão = autorização + liquidação adiada; SEPA Inst = push, final em segundos.\n- Pergunta: posso guardar o CVV para facilitar a próxima compra?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. O PCI DSS proíbe guardar o CVV depois da autorização; tokeniza-se no PSP.\n\n\u003c/details>\n\n- Na entrevista: \"Cartões são autorização mais liquidação adiada; SEPA Inst é push e final em segundos. Não guardo o PAN nem o CVV — tokenizo no PSP.\""},{"n":"10","title":"Thought Machine / Vault em 10 linhas","kind":"md","body":"1. **Vault Core** é a plataforma de core banking: ledger + produtos. **Vault Payments** é um produto à parte (processamento de pagamentos).\n2. **Ledger em tempo real**, \"fonte única de verdade\", com fundos em qualquer **ativo e denominação** (moedas, cripto, pontos).\n3. **Sem batch**, diz a brochura de 2023; o whitepaper de 2025 já mede lançamentos \"offline\" de baixa prioridade.\n4. **Produtos = smart contracts** em Python (um subconjunto em sandbox), no \"Universal Product Engine\". O banco muda-os sem tocar no código da plataforma.\n5. **Contratos versionados e imutáveis**; cada conta fica na versão com que abriu. **Supervisor contracts** coordenam vários contratos.\n6. Uma **Postings API** síncrona (alvo \u003c 100 ms) move fundos; os contratos também criam lançamentos (ex.: juros diários).\n7. **Stack:** microserviços, Kubernetes, Istio, **Kafka**; streaming de dados em tempo real; independente da cloud.\n8. **Escala medida:** 4769 TPS online (p95 \u003c 500 ms), 15 035 TPS de consultas de saldo, 30 M de contas.\n9. **[inferido — docs atrás de login]** Os lançamentos agrupam-se num *Posting Instruction Batch*; tipos como authorisation, settlement, release, transfer, hard settlement, custom.\n10. **[inferido — docs atrás de login]** Saldo indexado por conta + endereço + ativo + denominação + fase (`committed`, `pending_in`, `pending_out`). O meu mini-ledger (§2) imita isto, com uma só fase `pending`.\n\n- Confusão possível: Vault Core vs Vault Payments — o Core é o ledger e os produtos; o Payments é o produto de pagamentos.\n- Para recordar: Vault = ledger em tempo real + produtos como código versionado.\n- Pergunta: um banco muda a taxa de juro de um produto. Mexe no código da plataforma?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. Muda o smart contract do produto (uma versão nova); as contas existentes ficam na versão com que abriram.\n\n\u003c/details>\n\n- Na entrevista: \"O Vault é um ledger em tempo real em que o produto é código versionado. O meu papel seria garantir que cada lançamento é atómico, idempotente e equilibrado.\""},{"n":"11","title":"Ponte para a tua experiência","kind":"md","body":"> ⚠️ A coluna \"Frase modelo\" é um exemplo de como nomear o conceito. Confirma no código o que fizeste de facto antes de o dizeres.\n\n| O que fizeste | Conceito | Frase modelo |\n|---------------|----------|--------------|\n| Notificações de falha de rebill (RocketGate, Paynova) | Recusa vs erro temporário; webhooks; MIT recorrente | \"Só uma falha técnica é repetida, nunca uma recusa do emissor.\" |\n| Preços e descontos do Top Up | Cêntimos; arredondamento; allocate | \"Descontos em inteiros, arredondados uma vez, com regra explícita.\" |\n| Fallback da taxa de câmbio | Fonte da taxa; idade máxima; reproduzível | \"Guardo a taxa e a fonte, para o valor poder ser auditado.\" |\n| Cancelamento + reembolso (Duffel) | Reembolso como compensação de uma saga | \"O reembolso é um passo de compensação, não um rollback.\" |\n| Guarda de autorização tardia | Ciclo de vida da autorização; máquina de estados | \"Capturar depois de expirar é uma transição ilegal.\" |\n| Retries aninhados | Tempestade de retries; orçamento; uma camada | \"Retries aninhados multiplicam a carga; passei-os para uma camada.\" |\n| Hotfix \"cobrado N, entregue N\" | Idempotência + cobrança e entrega atómicas | \"Uma key liga cobrança e entrega; um retry não duplica nenhuma.\" |\n\n- Regra: conta a história real por palavras tuas; usa a coluna \"Conceito\" para dar nome ao padrão.\n- Go vs TypeScript: os mesmos conceitos. Diz \"em Go fazia o mesmo com `database/sql` e uma transação\".\n- Para recordar: história real primeiro, nome do padrão depois.\n- Pergunta: que conceito nomeias ao falar dos retries aninhados?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nTempestade de retries: tentativas em várias camadas multiplicam-se (3^5 = 243); a correção é uma camada com orçamento.\n\n\u003c/details>"},{"n":"12","title":"Perguntas prováveis + resposta curta","kind":"md","body":"| Pergunta | Resposta curta |\n|----------|----------------|\n| Como evitas cobrar duas vezes? | Idempotency key com `UNIQUE`, reservada antes da cobrança, passada ao PSP, response guardada para repetição. |\n| O PSP deu timeout. Repetes? | Não às cegas. Consulto por id/key; se não for claro, marco `unk
