 em Math.floor((i - 1) / 2) e cada pai é \u003c= aos filhos; por isso o menor está em [0].\n// O que guarda: a = o array do heap; push sobe o novo valor até ao sítio; pop põe o último no topo e deixa-o afundar.\n\nclass MinHeap {\n  constructor() {\n    this.a = [];\n  }\n  get size() {\n    return this.a.length;\n  }\n  peek() {\n    return this.a[0];\n  }\n  push(x) {\n    const a = this.a;\n    a.push(x);\n    let i = a.length - 1;\n    while (i > 0) {\n      const parent = Math.floor((i - 1) / 2);\n      if (a[parent] \u003c= a[i]) break; // o pai já é menor: está no sítio\n      [a[parent], a[i]] = [a[i], a[parent]]; // sobe\n      i = parent;\n    }\n  }\n  pop() {\n    const a = this.a;\n    const top = a[0];\n    const last = a.pop();\n    if (a.length) {\n      a[0] = last; // o último vai para o topo e \"afunda\"\n      let i = 0;\n      while (true) {\n        const l = 2 * i + 1, r = 2 * i + 2;\n        let smallest = i;\n        if (l \u003c a.length && a[l] \u003c a[smallest]) smallest = l;\n        if (r \u003c a.length && a[r] \u003c a[smallest]) smallest = r;\n        if (smallest === i) break;\n        [a[smallest], a[i]] = [a[i], a[smallest]];\n        i = smallest;\n      }\n    }\n    return top; // devolve o menor guardado no início; o resto foi arrumação\n  }\n}\n\nconst h = new MinHeap();\nfor (const x of [5, 3, 8, 1]) h.push(x);\n// Antes → operação → depois\n//   operação   array depois    porquê\n//   push(3)    [3, 5]          3 \u003c pai 5 → troca\n//   push(8)    [3, 5, 8]       8 >= pai 3 → fica\n//   push(1)    [1, 3, 8, 5]    1 \u003c pai 5 → troca; 1 \u003c pai 3 → troca\nh.a; // result ==> [1, 3, 8, 5]  (não está ordenado; só o [0] é garantido)\nconst testHeap = new MinHeap();\nfor (const x of [5, 3, 8, 1, 9, 1, -2]) testHeap.push(x);\ntestHeap.peek(); // result ==> -2\nconst out = [];\nwhile (testHeap.size) out.push(testHeap.pop());\nout; // result ==> [-2,1,1,3,5,8,9]  (sai sempre por ordem)\nnew MinHeap().pop(); // result ==> undefined\n// Complexidade: push/pop O(log n), peek O(1).\n// usa: class + get → 01 §19 · troca com [a, b] = [b, a] → 01 §13 · Math.floor → 01 §8 · while (true) + break → 01 §6\n// Nota: JS não tem heap nativo. Na entrevista pergunta \"posso assumir um MinHeap?\"; se não, isto leva ~5 min.\n// Confusão possível: heap vs array ordenado. O heap só garante o menor em [0]; o resto fica \"meio arrumado\", e por isso push/pop custam O(log n) e não O(n).\n// Para recordar: pai em (i - 1) / 2, filhos em 2i + 1 e 2i + 2; push sobe, pop afunda.\n// Pergunta: depois dos push 5, 3, 8, 1 em h, quanto dão h.pop() e depois h.peek()?\n// Resposta: 1 e 3. O pop tira o 1; o 5 vai para o topo e afunda até ficar [3, 5, 8].\n\n//--------------------------------------------------------------------\n// Kth Largest Element in an Array (LC 215) — o k-ésimo maior número\n// Para que serve: o 2.º maior de [3,2,1,5,6,4] é 5.\n// Regra essencial: um MinHeap com no máximo k valores guarda os k maiores; o menor deles (o topo) é o k-ésimo maior.\n// O que guarda: heap = os k maiores vistos até agora; peek() = o menor desses k.\n\nfunction findKthLargest(nums, k) {\n  const heap = new MinHeap();\n  for (const n of nums) {\n    heap.push(n);\n    if (heap.size > k) heap.pop(); // tira o menor: nunca será o k-ésimo maior\n  }\n  return heap.peek();\n}\n// Também serve na entrevista (diz a complexidade!): ordenar → O(n log n), em 3 passos:\n//   const copy = [...nums]; copy.sort((a, b) => b - a); return copy[k - 1];\nconst kthLargestSort = (nums, k) => [...nums].sort((a, b) => b - a)[k - 1];\n\n// Antes → operação → depois ([3, 2, 1, 5, 6, 4], k = 2; conteúdo do heap, não a ordem do array)\n//   n   depois do push   size > 2?   heap fica\n//   1   {1, 2, 3}        sim         {2, 3}\n//   5   {2, 3, 5}        sim         {3, 5}\n//   6   {3, 5, 6}        sim         {5, 6}   (o 4 entra e sai a seguir → peek = 5)\nfindKthLargest([3, 2, 1, 5, 6, 4], 2); // result ==> 5\nfindKthLargest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4); // result ==> 4  (repetidos contam)\nfindKthLargest([1], 1); // result ==> 1\nfindKthLargest([-1, -5, -3], 1); // result ==> -1\nkthLargestSort([3, 2, 1, 5, 6, 4], 2); // result ==> 5\n// Complexidade: O(n log k) tempo, O(k) espaço.\n// usa: a classe MinHeap acima · for...of → 01 §6 · [...nums].sort((a, b) => b - a) → 01 §11, §13 · arrow → 01 §16\n// Confusão possível: MinHeap vs MaxHeap para \"k-ésimo MAIOR\". Usa-se MIN: ele deita fora o mais pequeno e ficam os k maiores.\n// Para recordar: k maiores num MinHeap; o topo é a resposta.\n// Pergunta: quanto dá findKthLargest([1, 2, 3], 3)?\n// Resposta: 1. O 3.º maior de três números é o menor; com k = 3 nunca se tira nada."},{"n":"12","title":"PROGRAMAÇÃO DINÂMICA","kind":"code","body":"// Usar quando o enunciado diz: \"número de maneiras\", \"mínimo/máximo de…\", \"é possível…?\", \"sem vizinhos\", \"maior subsequência\"\n// Molde: responde a 3 perguntas no quadro, por palavras.\n//   1. ESTADO:     o que significa dp[i]? ex.: \"o máximo que consigo roubar das casas 0..i\"\n//   2. TRANSIÇÃO:  como chego a dp[i] a partir dos menores? Pensa na ÚLTIMA decisão.\n//   3. BASE:       os casos pequenos que não precisam de nada. ex.: dp[0] = house[0]\n// MEMO = recursão + Map (mais fácil de pensar). TABELA = for a preencher dp (sem recursão). Mesmo resultado.\n\n//--------------------------------------------------------------------\n// House Robber (LC 198) — roubar o máximo sem roubar duas casas vizinhas\n// Para que serve: escolher valores de um array sem escolher dois seguidos, maximizando a soma.\n// Regra essencial: em cada casa, ou a saltas (fica o melhor até à anterior) ou a roubas (melhor até duas atrás + esta).\n// O que guarda: memo é um Map; chave = índice i; valor = o máximo roubável das casas 0..i.\n//   Na versão tabela: prev = melhor até à casa anterior; prevPrev = melhor até duas casas atrás.\n\n// Versão MEMO\nfunction robMemo(nums) {\n  const memo = new Map();\n  function bestUpTo(i) {\n    if (i \u003c 0) return 0; // base: sem casas\n    if (memo.has(i)) return memo.get(i); // já calculado: o return evita repetir o trabalho\n    const skip = bestUpTo(i - 1); //          saltar a casa i\n    const take = bestUpTo(i - 2) + nums[i]; // roubar a casa i\n    const r = Math.max(skip, take);\n    memo.set(i, r);\n    return r;\n  }\n  return bestUpTo(nums.length - 1);\n}\n// Versão TABELA (só precisas das 2 últimas → O(1) espaço)\nfunction rob(nums) {\n  let prevPrev = 0, prev = 0;\n  for (const house of nums) {\n    const current = Math.max(prev, prevPrev + house);\n    prevPrev = prev;\n    prev = current;\n  }\n  return prev;\n}\n\n// Antes → operação → depois (rob([2, 7, 9, 3, 1]))\n//   casa   max(prev, prevPrev + casa)   prevPrev   prev\n//   2      max(0, 0 + 2) = 2            0          2\n//   7      max(2, 0 + 7) = 7            2          7\n//   9      max(7, 2 + 9) = 11           7          11   (depois 3 → 11, 1 → 12)\nfor (const f of [rob, robMemo]) {\n  f([2, 7, 9, 3, 1]); // result ==> 12  (2 + 9 + 1)\n  f([1, 2, 3, 1]); // result ==> 4  (1 + 3)\n  f([]); // result ==> 0\n  f([5]); // result ==> 5\n  f([2, 1, 1, 2]); // result ==> 4  (salta 2 casas seguidas)\n}\n// Complexidade: O(n) tempo, O(1) espaço (memo: O(n)).\n// usa: recursão → 01 §16 · Map como memo → 01 §14, §17 · Math.max → 01 §8 · for...of → 01 §6\n// Confusão possível: memo vs tabela. O memo começa no fim e desce por recursão; a tabela começa no início e sobe com um for. Calculam o mesmo.\n// Para recordar: saltar (prev) ou roubar (prevPrev + casa).\n// Pergunta: quanto dá rob([5, 1, 1, 5])?\n// Resposta: 10. Rouba a 1.ª e a 4.ª casa (5 + 5); não são vizinhas.\n\n//--------------------------------------------------------------------\n// Coin Change (LC 322) — o menor número de moedas para fazer amount\n// Para que serve: [1, 2, 5] para 11 → 3 moedas (5 + 5 + 1).\n// Regra essencial: dp[v] = 1 + o menor dp[v - moeda], para cada moeda que cabe; dp[0] = 0; Infinity = impossível.\n// O que guarda: dp[v] = o menor número de moedas que faz o valor v (Infinity se ainda não dá).\n\nfunction coinChange(coins, amount) {\n  const dp = new Array(amount + 1).fill(Infinity);\n  dp[0] = 0;\n  for (let v = 1; v \u003c= amount; v++) {\n    for (const coin of coins) {\n      if (coin \u003c= v) dp[v] = Math.min(dp[v], dp[v - coin] + 1); // usar esta moeda como a última\n    }\n  }\n  return dp[amount] === Infinity ? -1 : dp[amount];\n}\n\n// Antes → operação → depois (coinChange([1, 2, 5], 11); primeiros valores)\n//   v   moeda 1          moeda 2          moeda 5   dp[v]\n//   1   dp[0] + 1 = 1    -                -         1\n//   2   dp[1] + 1 = 2    dp[0] + 1 = 1    -         1\n//   3   dp[2] + 1 = 2    dp[1] + 1 = 2    -         2   (… dp[11] = 3)\ncoinChange([1, 2, 5], 11); // result ==> 3  (5+5+1)\ncoinChange([2], 3); // result ==> -1\ncoinChange([1], 0); // result ==> 0\ncoinChange([1, 3, 4], 6); // result ==> 2  (3+3; o guloso daria 4+1+1)\n// Complexidade: O(amount · coins) tempo, O(amount) espaço.\n// usa: new Array(n).fill(Infinity) → 01 §9, §8 · for dentro de for → 01 §6 · Math.min → 01 §8 · ternário → 01 §3\n// Confusão possível: guloso vs DP. \"A maior moeda primeiro\" falha: para 6 com [1,3,4] daria 4+1+1 (3 moedas); a DP encontra 3+3 (2).\n// Para recordar: dp[v] = 1 + min(dp[v - moeda]).\n// Pergunta: quanto dá coinChange([2, 5], 7)?\n// Resposta: 2. dp[7] = dp[5] + 1 = 2 (5 + 2).\n\n//--------------------------------------------------------------------\n// Longest Increasing Subsequence (LC 300) — a maior sequência a subir, podendo saltar elementos\n// Para que serve: em [10,9,2,5,3,7,101,18], encontrar 2,3,7,101 (4).\n// Regra essencial: dp[i] = a maior subsequência que TERMINA em nums[i]; olha para cada j \u003c i com nums[j] \u003c nums[i].\n// O que guarda: dp[i] = tamanho da maior subsequência crescente que acaba no índice i (começa em 1: o próprio número).\n\nfunction lengthOfLIS(nums) {\n  if (nums.length === 0) return 0;\n  const dp = new Array(nums.length).fill(1);\n  for (let i = 1; i \u003c nums.length; i++) {\n    for (let j = 0; j \u003c i; j++) {\n      if (nums[j] \u003c nums[i]) dp[i] = Math.max(dp[i], dp[j] + 1); // prolongar a que acaba em j\n    }\n  }\n  return Math.max(...dp); // a resposta pode acabar em qualquer i\n}\n\n// Antes → operação → depois ([10, 9, 2, 5, 3, 7, 101, 18])\n//   i (valor)   j úteis (nums[j] \u003c nums[i])   dp[i]\n//   3 (5)       2 (2)                         2\n//   4 (3)       2 (2)                         2\n//   5 (7)       2, 3 (5), 4 (3)               3   (101 → 4; 18 → 4; max = 4)\nlengthOfLIS([10, 9, 2, 5, 3, 7, 101, 18]); // result ==> 4  (2,3,7,101)\nlengthOfLIS([0, 1, 0, 3, 2, 3]); // result ==> 4\nlengthOfLIS([7, 7, 7, 7]); // result ==> 1  (iguais não contam)\nlengthOfLIS([]); // result ==> 0\n// Complexidade: O(n²) tempo, O(n) espaço. Existe uma versão O(n log n); O(n²) é aceite.\n// usa: fill(1) → 01 §9 · for dentro de for → 01 §6 · Math.max(...dp) → 01 §8, §13\n// Confusão possível: devolver dp.at(-1) vs Math.max(...dp). dp.at(-1) é só a melhor que acaba no ÚLTIMO número; a melhor pode acabar antes.\n// Para recordar: dp[i] = a melhor que acaba em i.\n// Pergunta: quanto dá lengthOfLIS([3, 1, 2])?\n// Resposta: 2. A sequência 1, 2; o 3 não pode vir antes de números menores e continuar a subir.\n\n//--------------------------------------------------------------------\n// Longest Common Subsequence (LC 1143) — a maior sequência que duas strings partilham\n// Para que serve: \"abcde\" e \"ace\" partilham \"ace\" (3), com saltos permitidos.\n// Regra essencial: tabela 2D; letras iguais → diagonal + 1; diferentes → o melhor entre cima e esquerda.\n// O que guarda: dp[i][j] = LCS dos primeiros i caracteres de a com os primeiros j de b. Linha/coluna 0 = string vazia = 0.\n\nfunction longestCommonSubsequence(a, b) {\n  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));\n  for (let i = 1; i \u003c= a.length; i++) {\n    for (let j = 1; j \u003c= b.length; j++) {\n      if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1] + 1; // i - 1 porque dp tem uma linha a mais\n      else dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);\n    }\n  }\n  return dp[a.length][b.length];\n}\n\n// Antes → operação → depois (tabela de longestCommonSubsequence(\"abc\", \"ac\"))\n//          \"\"   a    c\n//   \"\"     0    0    0\n//   a      0    1    1      (a = a → diagonal 0 + 1)\n//   b      0    1    1      (b ≠ a, b ≠ c → max(cima, esquerda))\n//   c      0    1    2      (c = c → diagonal 1 + 1)\nlongestCommonSubsequence(\"abc\", \"ac\"); // result ==> 2\nlongestCommonSubsequence(\"abcde\", \"ace\"); // result ==> 3  (\"ace\")\nlongestCommonSubsequence(\"abc\", \"def\"); // result ==> 0\nlongestCommonSubsequence(\"\", \"abc\"); // result ==> 0\n// Complexidade: O(n · m) tempo e espaço.\n// usa: Array.from para construir uma matriz → 01 §9 · ciclo numa matriz → 01 §6 · s[i] → 01 §7 · Math.max → 01 §8\n// Confusão possível: subsequência vs substring comum. Subsequência permite saltos (\"ace\" em \"abcde\"); substring tem de ser contígua.\n// Para recordar: igual → diagonal + 1; diferente → max(cima, esquerda).\n// Pergunta: quanto dá longestCommonSubsequence(\"ab\", \"ba\")?\n// Resposta: 1. Partilham \"a\" ou \"b\", mas não os dois pela mesma ordem.\n\n//--------------------------------------------------------------------\n// Unique Paths (LC 62) — caminhos de um robô que só anda para a direita ou para baixo\n// Para que serve: contar caminhos do canto superior esquerdo ao inferior direito numa grelha m × n.\n// Regra essencial: caminhos até uma célula = os que chegam de cima + os que chegam da esquerda; a 1.ª linha e a 1.ª coluna valem 1.\n// O que guarda: dp[r][c] = quantos caminhos chegam à célula (r, c).\n\nfunction uniquePaths(m, n) {\n  const dp = Array.from({ length: m }, () => new Array(n).fill(1));\n  for (let r = 1; r \u003c m; r++) {\n    for (let c = 1; c \u003c n; c++) dp[r][c] = dp[r - 1][c] + dp[r][c - 1];\n  }\n  return dp[m - 1][n - 1];\n}\n\n// Antes → operação → depois (tabela de uniquePaths(3, 3))\n//   1   1   1\n//   1   2   3      (2 = 1 de cima + 1 da esquerda; 3 = 1 + 2)\n//   1   3   6      (6 = 3 de cima + 3 da esquerda)\nuniquePaths(3, 3); // result ==> 6\nuniquePaths(3, 7); // result ==> 28\nuniquePaths(3, 2); // result ==> 3\nuniquePaths(1, 1); // result ==> 1\n// Complexidade: O(m · n) tempo e espaço.\n// usa: Array.from + fill(1) → 01 §9 · ciclo numa matriz → 01 §6\n// Confusão possível: DP vs DFS a contar caminhos. Um DFS percorre cada caminho (exponencial); a DP soma contagens, cada célula uma vez.\n// Para recordar: cima + esquerda.\n// Pergunta: quanto dá uniquePaths(2, 3)?\n// Resposta: 3. Linha de baixo: 1, 1 + 1 = 2, 1 + 2 = 3."},{"n":"13","title":"LISTAS LIGADAS (médio)","kind":"code","body":"// Usar quando o enunciado diz: `head`, \"remover o n-ésimo a contar do fim\", \"numa só passagem\", \"dígitos por ordem inversa\", \"devolve a nova head\"\n// Molde (nó dummy): um nó falso antes da head evita o caso especial de mudar a head. Trabalha a partir do dummy e devolve dummy.next.\n//   const dummy = new ListNode(0, head); ...trabalhar a partir de dummy...; return dummy.next;\n// Auxiliares: toList([1, 2]) constrói 1 → 2 → null a partir do fim (reduceRight); toArray(head) volta a dar [1, 2].\nclass ListNode {\n  constructor(val, next = null) {\n    this.val = val;\n    this.next = next;\n  }\n}\nconst toList = (arr) => arr.reduceRight((next, val) => new ListNode(val, next), null);\nconst toArray = (head) => {\n  const out = [];\n  for (let n = head; n; n = n.next) out.push(n.val);\n  return out;\n};\n\n//--------------------------------------------------------------------\n// Remove Nth Node From End of List (LC 19) — apagar o n-ésimo nó a contar do fim, numa passagem\n// Para que serve: [1,2,3,4,5] com n = 2 → [1,2,3,5].\n// Regra essencial: fast vai n + 1 passos à frente de slow; quando fast chega a null, slow está mesmo ANTES do nó a apagar.\n// O que guarda: dummy = nó falso antes da head; fast = ponteiro da frente; slow = ponteiro de trás (pára antes do alvo).\n\nfunction removeNthFromEnd(head, n) {\n  const dummy = new ListNode(0, head); // se o alvo for a head, slow fica no dummy\n  let fast = dummy, slow = dummy;\n  for (let i = 0; i \u003c= n; i++) fast = fast.next; // n + 1 passos à frente\n  while (fast) {\n    fast = fast.next;\n    slow = slow.next;\n  }\n  const target = slow.next; // 1. o nó a apagar\n  slow.next = target.next; //  2. saltar por cima dele\n  return dummy.next;\n}\n// Versão compacta dos 2 passos: slow.next = slow.next.next;\n\n// Antes → operação → depois ([1, 2, 3, 4, 5], n = 2; depois dos 3 passos iniciais, fast está no 3)\n//   fast   slow    (cada linha = um passo do while; avançam os dois)\n//   3      dummy   início\n//   4      1\n//   5      2\n//   null   3       pára → 3.next passa a ser o 5 (o 4 sai)\ntoArray(removeNthFromEnd(toList([1, 2, 3, 4, 5]), 2)); // result ==> [1,2,3,5]\ntoArray(removeNthFromEnd(toList([1]), 1)); // result ==> []\ntoArray(removeNthFromEnd(toList([1, 2]), 2)); // result ==> [2]  (remove a head)\ntoArray(removeNthFromEnd(toList([1, 2]), 1)); // result ==> [1]\n// Complexidade: O(n) tempo, O(1) espaço.\n// usa: class ListNode acima → 01 §19 · for / while → 01 §6 · padrão dummy + dois ponteiros → 02 §8\n// Confusão possível: n vs n + 1 passos. Com n passos, slow parava EM cima do alvo; para o apagar é preciso estar no nó anterior.\n// Para recordar: distância n + 1; slow pára antes do alvo.\n// Pergunta: quanto dá toArray(removeNthFromEnd(toList([1, 2, 3]), 3))?\n// Resposta: [2, 3]. O 3.º a contar do fim é a head; slow fica no dummy e salta o 1.\n\n//--------------------------------------------------------------------\n// Add Two Numbers (LC 2) — somar dois números guardados ao contrário em listas (342 → 2→4→3)\n// Para que serve: somar números grandes dígito a dígito.\n// Regra essencial: soma como na escola — dígito = soma % 10, vai-um = Math.floor(soma / 10); continua enquanto houver dígitos OU vai-um.\n// O que guarda: dummy = nó falso antes do resultado; tail = último nó do resultado; carry = o \"vai-um\" (0 ou 1).\n\nfunction addTwoNumbers(l1, l2) {\n  const dummy = new ListNode(0);\n  let tail = dummy, carry = 0;\n  while (l1 || l2 || carry) {\n    // `|| carry`: 5 + 5 = 10 precisa de um nó extra no fim\n    const a = l1?.val ?? 0; // l1 null → l1?.val dá undefined → ?? troca por 0\n    const b = l2?.val ?? 0;\n    const sum = a + b + carry;\n    carry = Math.floor(sum / 10);\n    tail.next = new ListNode(sum % 10);\n    tail = tail.next;\n    l1 = l1?.next;\n    l2 = l2?.next;\n  }\n  return dummy.next;\n}\n\n// Antes → operação → depois (2→4→3 + 5→6→4, ou seja 342 + 465)\n//   a + b + carry   dígito (% 10)   carry   resultado\n//   2 + 5 + 0 = 7   7               0       7\n//   4 + 6 + 0 = 10  0               1       7→0\n//   3 + 4 + 1 = 8   8               0       7→0→8   (807)\ntoArray(addTwoNumbers(toList([2, 4, 3]), toList([5, 6, 4]))); // result ==> [7,0,8]  (342 + 465 = 807)\ntoArray(addTwoNumbers(toList([0]), toList([0]))); // result ==> [0]\ntoArray(addTwoNumbers(toList([9, 9, 9, 9]), toList([9, 9]))); // result ==> [8,9,0,0,1]  (tamanhos diferentes)\ntoArray(addTwoNumbers(toList([5]), toList([5]))); // result ==> [0,1]  (vai-um no fim)\n// Complexidade: O(max(n, m)) tempo e espaço.\n// usa: ?. e ?? → 01 §3 · Math.floor → 01 §8 · % → 01 §3 · while → 01 §6 · padrão dummy → 02 §8\n// Confusão possível: % vs Math.floor(/). sum % 10 dá o dígito que fica; Math.floor(sum / 10) dá o que vai para a casa seguinte.\n// Para recordar: dígito = % 10, vai-um = / 10; não pares enquanto houver carry.\n// Pergunta: quanto dá toArray(addTwoNumbers(toList([1]), toList([9, 9])))?\n// Resposta: [0, 0, 1]. 1 + 99 = 100: 1+9 = 10 (0, vai 1), 0+9+1 = 10 (0, vai 1), o carry cria o 1."},{"n":"14","title":"ÁRVORES (médio)","kind":"code","body":"// Usar quando o enunciado diz: `root`, \"BST válida\", \"antepassado comum\", \"nível a nível\", \"vista da direita\", \"profundidade mínima\"\n// Molde (DFS em árvore): a informação desce como parâmetro e sobe como valor de retorno.\n//   function dfs(node, infoDeCima) {\n//     if (!node) return valorBase;\n//     const left = dfs(node.left, ...), right = dfs(node.right, ...);\n//     return combinar(node, left, right);\n//   }\n// Auxiliar: toTree([3,9,20,null,null,15,7]) constrói a árvore a partir do array do LeetCode, nível a nível.\nclass TreeNode {\n  constructor(val, left = null, right = null) {\n    this.val = val;\n    this.left = left;\n    this.right = right;\n  }\n}\nfunction toTree(arr) {\n  if (!arr.length || arr[0] === null) return null;\n  const root = new TreeNode(arr[0]), queue = [root];\n  let i = 1;\n  for (let f = 0; f \u003c queue.length && i \u003c arr.length; f++) {\n    const node = queue[f];\n    if (i \u003c arr.length && arr[i] !== null) queue.push((node.left = new TreeNode(arr[i])));\n    i++;\n    if (i \u003c arr.length && arr[i] !== null) queue.push((node.right = new TreeNode(arr[i])));\n    i++;\n  }\n  return root;\n}\n\n//--------------------------------------------------------------------\n// Validate Binary Search Tree (LC 98) — todos os da esquerda menores, todos os da direita maiores\n// Para que serve: verificar se uma árvore é uma BST válida.\n// Regra essencial: passa para baixo o intervalo permitido (min, max); cada nó tem de estar estritamente dentro dele.\n// O que guarda: min/max = limites que vêm de TODOS os antepassados, não só do pai.\n\nfunction isValidBST(node, min = -Infinity, max = Infinity) {\n  if (!node) return true; // árvore vazia é válida\n  if (node.val \u003c= min || node.val >= max) return false; // BST do LeetCode: sem valores iguais\n  const leftOk = isValidBST(node.left, min, node.val); // à esquerda, o máximo passa a ser este nó\n  const rightOk = isValidBST(node.right, node.val, max); // à direita, o mínimo passa a ser este nó\n  return leftOk && rightOk;\n}\n// Versão compacta: return isValidBST(node.left, min, node.val) && isValidBST(node.right, node.val, max);\n// (a compacta nem visita a direita se a esquerda já falhou: && pára no primeiro false)\n\n// Antes → operação → depois (toTree([5, 4, 6, null, null, 3, 7]))\n//   nó   intervalo permitido   dentro?\n//   5    (-Infinity, Infinity) sim\n//   6    (5, Infinity)         sim\n//   3    (5, 6)                não → false   (o 3 está à direita do 5)\nisValidBST(toTree([5, 4, 6, null, null, 3, 7])); // result ==> false  (o 3 está à direita do 5)\nisValidBST(toTree([2, 1, 3])); // result ==> true\nisValidBST(toTree([5, 1, 4, null, null, 3, 6])); // result ==> false\nisValidBST(toTree([2, 2, 2])); // result ==> false  (valores iguais)\nisValidBST(null); // result ==> true\nisValidBST(toTree([-2147483648])); // result ==> true  (por isso -Infinity, e não um número)\n// Complexidade: O(n) tempo, O(altura) espaço.\n// usa: parâmetros por omissão / recursão → 01 §16 · -Infinity / Infinity → 01 §8 · && → 01 §3 · padrão recursão em árvore → 02 §9\n// Confusão possível: comparar só com os filhos diretos. [5,4,6,null,null,3,7] passa esse teste (3 \u003c 6), mas o 3 está na subárvore direita do 5.\n// Para recordar: passa (min, max) para baixo.\n// Pergunta: quanto dá isValidBST(toTree([10, 5, 15, null, null, 6, 20]))?\n// Resposta: false. O 6 está à direita do 10, por isso o intervalo dele é (10, 15).\n\n//--------------------------------------------------------------------\n// Lowest Common Ancestor of a Binary Tree (LC 236) — o nó mais baixo que tem p e q por baixo\n// Para que serve: o antepassado comum mais próximo de dois nós.\n// Regra essencial: se a esquerda E a direita encontraram alguma coisa, este nó é a resposta; senão, sobe o que foi encontrado.\n// O que guarda: left/right = o que cada lado devolveu (p, q, o LCA, ou null).\n\nfunction lowestCommonAncestor(node, p, q) {\n  if (!node || node === p || node === q) return node; // pára: vazio, ou encontrou p ou q\n  const left = lowestCommonAncestor(node.left, p, q);\n  const right = lowestCommonAncestor(node.right, p, q);\n  if (left && right) return node; // p de um lado, q do outro\n  return left ?? right; // só um lado encontrou: sobe esse\n}\n\nconst lcaRoot = toTree([3, 5, 1, 6, 2, 0, 8, null, null, 7, 4]);\nconst findNode = (node, val) => {\n  if (!node) return null;\n  if (node.val === val) return node;\n  return findNode(node.left, val) ?? findNode(node.right, val);\n};\n// Antes → operação → depois (p = 5, q = 4; o 4 está por baixo do 5)\n//   nó   left                 right              devolve\n//   5    -                    -                  5 (é p: pára logo, não desce)\n//   1    null (0)             null (8)           null\n//   3    5                    null               5\nlowestCommonAncestor(lcaRoot, findNode(lcaRoot, 5), findNode(lcaRoot, 4)).val; // result ==> 5  (um está por cima do outro)\nlowestCommonAncestor(lcaRoot, findNode(lcaRoot, 5), findNode(lcaRoot, 1)).val; // result ==> 3\nlowestCommonAncestor(lcaRoot, findNode(lcaRoot, 7), findNode(lcaRoot, 8)).val; // result ==> 3\n// Complexidade: O(n) tempo, O(altura) espaço.\n// usa: recursão → 01 §16 · && e ?? → 01 §3 · === → 01 §3 · padrão recursão em árvore → 02 §9\n// Confusão possível: LCA em BST vs em árvore qualquer. Numa BST basta comparar valores (os dois menores → esquerda); aqui não há ordem, por isso procura-se dos dois lados.\n// Para recordar: encontrou dos dois lados → sou eu.\n// Pergunta: no lcaRoot, qual é o LCA de 6 e 4?\n// Resposta: 5. O 6 está à esquerda do 5 e o 4 à direita (por baixo do 2).\n\n//--------------------------------------------------------------------\n// Binary Tree Level Order Traversal (LC 102) — ler a árvore um nível de cada vez\n// Para que serve: [[3], [9, 20], [15, 7]] — cada nível num array.\n// Regra essencial: BFS em que cada volta do while trata a fila inteira = um nível.\n// O que guarda: queue = nós do nível atual; next = filhos deles (o nível seguinte); levels = valores por nível.\n\nfunction levelOrder(root) {\n  if (!root) return [];\n  const levels = [];\n  let queue = [root];\n  while (queue.length) {\n    levels.push(queue.map((n) => n.val));\n    const next = [];\n    for (const n of queue) {\n      if (n.left) next.push(n.left);\n      if (n.right) next.push(n.right);\n    }\n    queue = next;\n  }\n  return levels;\n}\n\n// Antes → operação → depois (toTree([3, 9, 20, null, null, 15, 7]))\n//   queue     levels depois             next\n//   [3]       [[3]]                     [9, 20]\n//   [9, 20]   [[3], [9,20]]             [15, 7]\n//   [15, 7]   [[3], [9,20], [15,7]]     []   → o while termina\nlevelOrder(toTree([3, 9, 20, null, null, 15, 7])); // result ==> [[3], [9,20], [15,7]]\nlevelOrder(toTree([1])); // result ==> [[1]]\nlevelOrder(null); // result ==> []\nlevelOrder(toTree([1, 2, null, 3])); // result ==> [[1], [2], [3]]  (árvore torta)\n// Complexidade: O(n) tempo, O(n) espaço.\n// usa: map → 01 §10 · for...of / while → 01 §6 · padrão por níveis (BFS) → 02 §9\n// Nota: o mesmo código resolve LC 199 Right Side View (o último de cada nível) e LC 103 Zigzag (inverter os níveis ímpares).\n// Confusão possível: BFS vs DFS. DFS desce até ao fundo de um ramo primeiro; para \"nível a nível\" usa BFS com uma fila.\n// Para recordar: uma volta do while = um nível.\n// Pergunta: quanto dá levelOrder(toTree([1, 2, 3]))?\n// Resposta: [[1], [2, 3]]. O 1 é a raiz; o 2 e o 3 são os seus filhos, no nível seguinte."},{"n":"15","title":"TABELA FINAL: SINAL NO ENUNCIADO → PADRÃO","kind":"code","body":"/*\n  SINAL NO ENUNCIADO                                   → PADRÃO                           §\n  ---------------------------------------------------------------------------------------------\n  \"subarray com soma K\" (com negativos)                → prefix sum + Map                 §2\n  \"agrupar\", \"anagramas\", \"contar\", \"já vi isto?\"      → Map / Set                        §2\n  \"os k mais frequentes\"                               → Map + baldes (ou sort)           §2\n  \"ordenado\", \"par/trio com soma X\"                    → dois ponteiros                   §3\n  \"substring/subarray contíguo mais longo/curto\"       → janela deslizante                §4\n  \"todas as posições de um anagrama/permutação\"        → janela FIXA + contagens          §4\n  \"próximo maior/menor\", \"quantos dias até\"            → pilha monótona                   §5\n  \"parênteses\", \"expressão\", \"desfazer\"                → pilha                            §5\n  \"O(log n)\", \"ordenado mas rodado\"                    → pesquisa binária                 §6\n  \"menor velocidade/capacidade que consegue\"           → pesquisa binária na resposta     §6\n  \"intervalos\", \"reuniões\", \"sobrepostos\"              → ordenar por início + juntar      §7\n  \"grelha\", \"ilhas\", \"regiões\"                         → DFS na grelha                    §8\n  \"menos passos\", \"minutos até espalhar\"               → BFS (várias origens)             §8\n  \"pré-requisitos\", \"dependências\", \"ordem válida\"     → grafo + Kahn (topológica)        §9\n  \"todas as combinações/subconjuntos/permutações\"      → backtracking                     §10\n  \"k-ésimo maior\", \"top k\", \"sempre o mínimo\"          → heap (ou sort)                   §11\n  \"número de maneiras\", \"mín/máx de…\", \"é possível?\"   → programação dinâmica             §12\n  \"remover a contar do fim\", \"numa passagem\" (lista)   → dummy + dois ponteiros           §13\n  \"BST válida\", \"antepassado comum\", \"por níveis\"      → DFS com limites / BFS            §14\n\n  O que o n permite (≈ 10^8 passos simples por segundo):\n    n ≤ 12         → O(n!)       permutações\n    n ≤ 20         → O(2^n)      subconjuntos / backtracking\n    n ≤ 500        → O(n³)\n    n ≤ 10^4       → O(n²)       dois for, DP 2D\n    n ≤ 10^6       → O(n log n)  sort, heap, pesquisa binária num ciclo\n    n ≤ 10^8       → O(n)        um ciclo, Map, dois ponteiros, janela\n    maior          → O(log n) ou O(1)\n  ex.: \"nums.length \u003c= 10^5\" → querem O(n) ou O(n log n); dois for dão timeout.\n\n  Custos O(n) escondidos em JS: shift, unshift, includes, indexOf, splice, slice, [...arr], join.\n  sort → O(n log n). Map/Set get/has/set/add/delete → O(1).\n*/"},{"n":"16","title":"PLANO DE 7 DIAS","kind":"code","body":"/*\n  Como praticar:\n    - 25 min sozinho por problema. Encravado? Lê só a linha \"Usar quando\" e o molde. Mais 10 min.\n    - Continua encravado → lê a solução, fecha-a, reescreve-a de memória. Isso conta.\n    - Fala em voz alta enquanto escreves.\n    - Depois de cada problema: diz a complexidade e escreve 2 casos limite.\n    - \"Revisão\" = reescrever do zero, sem olhar, um problema de um dia anterior.\n\n  DIA 1 — Hash map (o mais importante para strings/arrays)\n    49 Group Anagrams · 347 Top K Frequent · 128 Longest Consecutive Sequence\n    + aquecimento fácil: 1 Two Sum, 242 Valid Anagram\n  DIA 2 — Prefix sum + dois ponteiros\n    560 Subarray Sum Equals K · 15 3Sum · 11 Container With Most Water\n    + revisão: 49\n  DIA 3 — Janela deslizante (strings!)\n    3 Longest Substring Without Repeating · 424 Longest Repeating Char Replacement · 438 Find All Anagrams\n    + revisão: 560, 15\n  DIA 4 — Pilha + pesquisa binária + intervalos\n    739 Daily Temperatures · 155 Min Stack · 33 Search in Rotated Sorted Array · 56 Merge Intervals\n    + revisão: 3\n  DIA 5 — Grelha, grafos, listas e árvores\n    200 Number of Islands · 207 Course Schedule · 19 Remove Nth From End · 102 Level Order\n    + revisão: 438, 56\n  DIA 6 — DP + backtracking + heap\n    198 House Robber · 322 Coin Change · 78 Subsets · 215 Kth Largest (primeiro com sort, depois com heap)\n    + revisão: 347, 739\n  DIA 7 — Entrevista simulada (sem olhar para este ficheiro)\n    Escolhe 2 que ainda não fizeste: 238 Product of Array Except Self, 5 Longest Palindromic Substring\n    (ou 875 Koko, 57 Insert Interval, 994 Rotting Oranges, 98 Validate BST).\n    45 min cada, em voz alta, com a lista do §1. Depois refaz os que falhaste nos dias 1–6.\n    Na véspera: relê só o §1 e o §15. Dorme.\n\n  Só há tempo para 10: 49, 347, 560, 15, 3, 438, 56, 739, 200, 322.\n*/\n\nconsole.log(\"✅ Medium OK\");"}]},{"id":"payments","label":"Payments","file":"04-Payments.md + .js","sections":[{"n":"1","title":"Dinheiro no código","kind":"md","body":"### Unidade mínima + moeda — guardar dinheiro como inteiro\n\n- Para que serve: guardar €12,34 como `1234` cêntimos, sem os erros do `float` (`0.1 + 0.2 !== 0.3`).\n- Regra essencial: dinheiro = inteiro na unidade mínima **+ a moeda**. As casas decimais vêm da moeda (ISO 4217); nunca assumir 2.\n- O que guarda: `EXPONENT` — chave = código da moeda; valor = casas decimais. O valor é um `BigInt` / `int64` (ou uma biblioteca decimal: `decimal.js`, Go `shopspring/decimal`), lido de texto, nunca de um float.\n\n| Texto | Moeda | Casas | Depois (`toMinor`) |\n|-------|-------|-------|--------------------|\n| `\"12.34\"` | EUR / USD | 2 | `1234n` |\n| `\"500\"` | JPY | 0 | `500n` |\n| `\"1.234\"` | BHD / KWD | 3 | `1234n` |\n\n- Confusão possível: `1234n` sozinho não diz nada — em EUR vale €12,34, em BHD vale 1,234 BHD. Guardar sempre `{ amount: 1234, currency: \"EUR\" }`.\n- Para recordar: inteiro na unidade mínima, com a moeda ao lado.\n- Pergunta: quanto dá `toMinor(\"7.5\", \"EUR\")`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`750n`. A parte decimal `\"5\"` é completada para `\"50\"` (EUR tem 2 casas): `\"7\" + \"50\"` = 750.\n\n\u003c/details>\n\n### Arredondamento bancário (half-even) + pontos base\n\n- Para que serve: cobrar 1,5% de comissão sobre €1234,56 e arredondar sem favorecer sempre o mesmo lado.\n- Regra essencial: só o empate exato (x,5) vai para o número **par**. Taxas em pontos base: 1 bp = 0,01%, logo 150 bp = 1,5%. Multiplicar primeiro, dividir e arredondar **uma vez**, no fim.\n- O que guarda: `divHalfEven(a, b)` — `q` = quociente inteiro, `r` = resto, `2·|r|` comparado com `b` para saber se passou de metade.\n\n| Operação | Valor exato | Depois |\n|----------|-------------|--------|\n| `divHalfEven(25n, 10n)` | 2,5 (empate) | `2n` (já é par) |\n| `divHalfEven(35n, 10n)` | 3,5 (empate) | `4n` (sobe para o par) |\n| `123456n × 150n ÷ 10000n` | 1851,84 cêntimos | `1852n` = €18,52 |\n\n- Confusão possível: half-up vs half-even — half-up sobe sempre os empates e, em milhões de arredondamentos, o erro acumula; half-even equilibra.\n- Para recordar: empate vai para o par; arredondar uma vez, com regra explícita.\n- Pergunta: quanto dá `divHalfEven(45n, 10n)`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`4n`. 4,5 é empate e 4 já é par.\n\n\u003c/details>\n\n### Allocate — dividir sem perder um cêntimo\n\n- Para que serve: dividir uma conta de €10,00 por 3 pessoas.\n- Regra essencial: a soma das partes **tem** de dar o total. O que sobra vai, cêntimo a cêntimo, para o maior resto.\n- O que guarda: `parts` = parte inteira de cada pessoa; `rems` = resto de cada uma; `left` = cêntimos ainda por dar.\n\n| Passo | `parts` | `left` |\n|-------|---------|--------|\n| Divisão inteira 1000 / 3 | `[333, 333, 333]` | 1 |\n| +1 ao maior resto | `[334, 333, 333]` | 0 |\n\n- Confusão possível: arredondar cada parte (333 × 3 = 999) perde 1 cêntimo; allocate não perde.\n- Para recordar: a soma das partes é sempre o total.\n- Pergunta: quanto dá `allocate(500n, [1n, 1n, 1n])`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`[167n, 167n, 166n]`. 166 × 3 = 498; os 2 cêntimos que sobram vão para os dois primeiros (restos iguais → ordem original).\n\n\u003c/details>\n\n- Na entrevista: \"Dinheiro é um inteiro na unidade mínima, mais a moeda. Arredondo uma vez, half-even, e faço allocate do resto para o total bater sempre.\"\n\n→ `04-Payments.js` §1\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// float vs cêntimos — porque o dinheiro nunca é float\n// Para que serve: somar €0,10 + €0,20 e obter exatamente €0,30.\n// Regra essencial: 0.1 não cabe exatamente num float; em cêntimos inteiros a conta é exata.\n// O que guarda: nada; compara as duas formas de somar o mesmo dinheiro.\n\n0.1 + 0.2; // result ==> 0.30000000000000004\n0.1 + 0.2 === 0.3; // result ==> false\n10n + 20n === 30n; // result ==> true\n\n// Antes → operação → depois\n//   forma       operação     depois\n//   float       0.1 + 0.2    0.30000000000000004  (errado por um bocadinho)\n//   cêntimos    10n + 20n    30n = €0,30 exatos\n\n// Confusão possível: toFixed(2) vs guardar inteiros — toFixed só arruma o ecrã; o valor guardado continua errado e o erro acumula.\n// Para recordar: dinheiro = inteiro na unidade mínima (cêntimos).\n// Pergunta: quanto dá 0.1 * 3 === 0.3?\n// Resposta: false. 0.1 * 3 dá 0.30000000000000004; em cêntimos, 10n * 3n === 30n dá true.\n\n//--------------------------------------------------------------------\n// toMinor() — texto \"12.34\" → inteiro na unidade mínima\n// Para que serve: o cliente escreve \"12.34\" € e o sistema guarda 1234 cêntimos.\n// Regra essencial: as casas decimais vêm da moeda (ISO 4217). Ler do texto, nunca de um float.\n// O que guarda: EXPONENT — chave = código da moeda; valor = número de casas decimais.\n//               minor = o valor em unidades mínimas, como BigInt.\n\nconst EXPONENT = { JPY: 0, EUR: 2, USD: 2, BHD: 3 };\n\nfunction toMinor(str, currency) {\n  const exp = EXPONENT[currency];\n  if (exp === undefined) throw new Error(`moeda desconhecida ${currency}`);\n  if (!/^-?\\d+(\\.\\d+)?$/.test(str)) throw new Error(`valor inválido ${str}`);\n  const [int, frac = \"\"] = str.replace(\"-\", \"\").split(\".\");\n  if (frac.length > exp) throw new Error(`${currency} só tem ${exp} casas decimais`);\n  const minor = BigInt(int + frac.padEnd(exp, \"0\")); // \"12\" + \"34\" → 1234n\n  return str.startsWith(\"-\") ? -minor : minor;\n}\n\n// Antes → operação → depois\n//   texto     moeda   casas   depois\n//   \"12.34\"   EUR     2       1234n\n//   \"500\"     JPY     0       500n\n//   \"1.234\"   BHD     3       1234n\ntoMinor(\"12.34\", \"EUR\"); // result ==> 1234n\ntoMinor(\"500\", \"JPY\"); // result ==> 500n\ntoMinor(\"1.234\", \"BHD\"); // result ==> 1234n\nassert.throws(() => toMinor(\"1.234\", \"EUR\")); // note: lança erro — EUR só tem 2 casas\n\n// Confusão possível: 1234n em EUR vs 1234n em BHD — o mesmo inteiro vale €12,34 ou 1,234 BHD. Sem moeda, não é dinheiro.\n// Para recordar: nunca assumir 2 casas; perguntar à moeda.\n// Pergunta: quanto dá toMinor(\"7.5\", \"EUR\")?\n// Resposta: 750n. A parte \"5\" é completada para \"50\" (2 casas), e \"7\" + \"50\" = 750.\n\n//--------------------------------------------------------------------\n// fromMinor() — inteiro → texto para mostrar ao cliente\n// Para que serve: mostrar 5 cêntimos como \"0.05\" num recibo.\n// Regra essencial: só se converte para texto na saída; as contas fazem-se sempre em inteiros.\n// O que guarda: s = os dígitos com zeros à esquerda; out = os dígitos com o ponto no sítio certo.\n\nfunction fromMinor(minor, currency) {\n  const exp = EXPONENT[currency];\n  const neg = minor \u003c 0n;\n  const s = (neg ? -minor : minor).toString().padStart(exp + 1, \"0\"); // 5n → \"005\"\n  const out = exp === 0 ? s : `${s.slice(0, -exp)}.${s.slice(-exp)}`; // \"0\" + \".\" + \"05\"\n  return (neg ? \"-\" : \"\") + out;\n}\n\n// Antes → operação → depois\n//   minor     moeda   s        depois\n//   5n        EUR     \"005\"    \"0.05\"\n//   -1234n    BHD     \"1234\"   \"-1.234\"\nfromMinor(5n, \"EUR\"); // result ==> \"0.05\"\nfromMinor(-1234n, \"BHD\"); // result ==> \"-1.234\"\n\n// Confusão possível: guardar \"0.05\" vs guardar 5n — o texto é só para ler; guardar texto obriga a converter em cada conta.\n// Para recordar: inteiro dentro, texto só à saída.\n// Pergunta: quanto dá fromMinor(500n, \"JPY\")?\n// Resposta: \"500\". JPY tem 0 casas, por isso não há ponto.\n\n//--------------------------------------------------------------------\n// divHalfEven() — dividir e arredondar o empate para o par (arredondamento bancário)\n// Para que serve: arredondar juros de 2,5 cêntimos sem favorecer sempre o banco ou sempre o cliente.\n// Regra essencial: só o empate exato (x,5) vai para o número par; o resto arredonda normalmente.\n// O que guarda: q = quociente inteiro; r = resto; twice = 2 × |resto|, para comparar com b sem frações.\n\nfunction divHalfEven(a, b) {\n  // a, b BigInt, b > 0\n  let q = a / b; // BigInt corta as decimais (em direção a zero)\n  const r = a % b;\n  const twice = 2n * (r \u003c 0n ? -r : r);\n  if (twice > b || (twice === b && q % 2n !== 0n)) q += a \u003c 0n ? -1n : 1n;\n  return q;\n}\n\n// Antes → operação → depois\n//   a / b       valor   q    empate?   depois\n//   25n / 10n   2,5     2    sim       2n  (2 já é par)\n//   35n / 10n   3,5     3    sim       4n  (sobe para o par)\n//   26n / 10n   2,6     2    não       3n  (passa de metade)\ndivHalfEven(25n, 10n); // result ==> 2n\ndivHalfEven(35n, 10n); // result ==> 4n\ndivHalfEven(26n, 10n); // result ==> 3n\ndivHalfEven(-25n, 10n); // result ==> -2n\n\n// Confusão possível: half-up vs half-even — half-up sobe sempre os empates, e em milhões de arredondamentos o erro acumula para cima; half-even equilibra.\n// Para recordar: empate vai para o par; arredondar uma vez, no fim.\n// Pergunta: quanto dá divHalfEven(45n, 10n)?\n// Resposta: 4n. 4,5 é empate e 4 já é par.\n\n//--------------------------------------------------------------------\n// pontos base (basis points) — taxas como inteiros\n// Para que serve: cobrar uma comissão de 1,5% sobre €1234,56 sem usar floats.\n// Regra essencial: 1 bp = 0,01%, logo 150 bp = 1,5%. Multiplicar primeiro, dividir por 10 000 no fim.\n// O que guarda: bruto = cêntimos × bp (ainda sem dividir); fee = comissão em cêntimos, já arredondada.\n\nconst bruto = 123456n * 150n; // result ==> 18518400n\nconst fee = divHalfEven(bruto, 10000n); // result ==> 1852n\n\n// Antes → operação → depois\n//   passo                 valor\n//   123456n × 150n        18518400n\n//   ÷ 10000               1851,84 cêntimos\n//   half-even             1852n = €18,52\n\n// Confusão possível: 150 bp vs 150% — bp é centésimo de ponto percentual; 150 bp é só 1,5%.\n// Para recordar: multiplicar primeiro, dividir uma vez, arredondar uma vez.\n// Pergunta: quanto é a comissão de 100 bp sobre €10,00 (1000n)?\n// Resposta: 10n (€0,10). 1000 × 100 / 10000 = 10, sem resto.\n\n//--------------------------------------------------------------------\n// allocate() — dividir sem perder um cêntimo\n// Para que serve: dividir uma conta de €10,00 por 3 pessoas.\n// Regra essencial: a soma das partes TEM de dar o total. O que sobra vai, cêntimo a cêntimo, para o maior resto.\n// O que guarda: parts = a parte inteira de cada pessoa; rems = o resto de cada uma; left = cêntimos ainda por dar.\n\nfunction allocate(total, ratios) {\n  const sum = ratios.reduce((a, b) => a + b, 0n);\n  const parts = ratios.map((r) => (total * r) / sum);\n  const rems = ratios.map((r, i) => ({ i, rem: (total * r) % sum }));\n  let left = total - parts.reduce((a, b) => a + b, 0n);\n  rems.sort((x, y) => (y.rem > x.rem ? 1 : y.rem \u003c x.rem ? -1 : x.i - y.i)); // maior resto primeiro; empate → ordem original\n  for (let k = 0; left > 0n; k++, left--) parts[rems[k].i] += 1n;\n  return parts;\n}\n\n// Antes → operação → depois (1000n por [1, 1, 1])\n//   passo              parts               left\n//   divisão inteira    [333, 333, 333]     1\n//   +1 ao maior resto  [334, 333, 333]     0\nconst split = allocate(1000n, [1n, 1n, 1n]); // result ==> [334n, 333n, 333n]\nsplit.reduce((a, b) => a + b, 0n); // result ==> 1000n  (nenhum cêntimo perdido)\nallocate(100n, [70n, 30n]); // result ==> [70n, 30n]\n\n// Confusão possível: arredondar cada parte vs allocate — 1000/3 arredondado dá 333 × 3 = 999; perde-se 1 cêntimo.\n// Para recordar: a soma das partes é sempre o total.\n// Pergunta: quanto dá allocate(500n, [1n, 1n, 1n])?\n// Resposta: [167n, 167n, 166n]. 166 × 3 = 498; sobram 2 cêntimos para os dois primeiros (restos iguais → ordem original).\n```"},{"n":"2","title":"Ledger de dupla entrada","kind":"md","body":"### Ledger — cada movimento soma zero\n\n- Para que serve: um depósito de €100 fica registado para sempre, e o dinheiro nunca aparece nem desaparece.\n- Regra essencial: o ledger só cresce (append-only; nunca `UPDATE`). Cada transação tem ≥ 2 lançamentos (postings) que **somam 0**. O saldo é **derivado**: a soma dos lançamentos da conta (`SELECT SUM(amount) … WHERE account = 'alice'`, talvez com um snapshot em cache), nunca uma coluna editada.\n- O que guarda: cada lançamento `{ txId, account, amount, phase }`. `amount`: + entra na conta, − sai. Contas: clientes (`\"alice\"`), lojas (`\"merchant\"`) e contas internas do banco (`\"bank:cash\"`, juros, comissões), que podem ficar negativas.\n\n| Conta | Antes | `transfer(\"dep-1\", \"bank:cash\", \"alice\", 10000n)` | Depois |\n|-------|-------|---------------------------------------------------|--------|\n| `bank:cash` | 0 | −10000 | −10000 |\n| `alice` | 0 | +10000 | 10000 |\n| soma | 0 | | 0 |\n\n- Confusão possível: débito/crédito vs o sinal do código. Em contabilidade bancária, um depósito **debita** a caixa do banco (ativo sobe) e **credita** a conta do cliente (o depósito é um **passivo** do banco, que sobe). Os sinais mudam conforme a convenção; \"soma zero\" não muda.\n- Para recordar: cada transação soma 0; o saldo é derivado.\n- Pergunta: que acontece a uma transação com lançamentos −3000 e +2000?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nÉ recusada (\"não soma zero (−1000)\") e nada é gravado. Um ledger desequilibrado é um bug provado.\n\n\u003c/details>\n\n### Pendente vs liquidado + saldo disponível\n\n- Para que serve: a Alice paga €30 com cartão; o dinheiro fica retido mas ainda não saiu.\n- Regra essencial: a autorização só mexe na fase **pending**. Saldo liquidado não muda. **Disponível = liquidado − retenções a sair**; uma retenção a entrar não conta.\n- O que guarda: fase `committed` = dinheiro que se moveu; fase `pending` = retenções. Cada lançamento pendente leva `hold` = id da autorização, para somar por retenção.\n\n| Alice | Antes | `authorise(\"auth-1\", \"alice\", \"merchant\", 3000n)` | Depois |\n|-------|-------|---------------------------------------------------|--------|\n| liquidado | 10000 | — | 10000 |\n| pending | 0 | −3000 | −3000 |\n| disponível | 10000 | | 7000 |\n| merchant disponível | 0 | +3000 a entrar (não conta) | 0 |\n\n- Confusão possível: saldo vs saldo disponível — o cliente vê €100 no extrato, mas só pode gastar €70.\n- Para recordar: retido ≠ liquidado.\n- Pergunta: com €70 disponíveis, a Alice tenta reter mais €70. Passa?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nSim. 7000 não é menor que 7000, por isso há fundos; fica com 0 disponível.\n\n\u003c/details>\n\n### Liquidação parcial + estorno\n\n- Para que serve: a loja captura só €25 dos €30 (um artigo esgotou) e depois reembolsa os €25.\n- Regra essencial: liquidar = libertar a retenção inteira + lançar o valor final (pode ser menos, nunca mais). Corrigir = **estorno** (reversal): uma transação nova, ao contrário, com referência à original.\n- O que guarda: `settle` grava `set-1:release` (pending, anula a retenção) e `set-1` (committed, −2500/+2500). `reverse` grava o simétrico de cada lançamento de `set-1`, com `reverses: \"set-1\"`.\n\n| Alice | Antes | `settle(\"set-1\", \"auth-1\", 2500n)` | Depois | `reverse(\"ref-1\", \"set-1\")` | Depois |\n|-------|-------|-----------------------------------|--------|-----------------------------|--------|\n| liquidado | 10000 | −2500 | 7500 | +2500 | 10000 |\n| pending | −3000 | +3000 | 0 | — | 0 |\n| disponível | 7000 | | 7500 | | 10000 |\n\n- Confusão possível: captura parcial vs reembolso parcial — na captura parcial os €5 nunca saíram; o reembolso devolve dinheiro que já saiu.\n- Para recordar: o ledger só cresce; corrigir = estornar. `assertInvariants()` confirma que cada fase soma 0.\n- Pergunta: e se a loja tentasse liquidar €35?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nErro \"liquidação acima do autorizado\": 3500 > 3000 retidos.\n\n\u003c/details>\n\n- Na entrevista: \"Um ledger append-only de dupla entrada: cada transação soma zero, o saldo é derivado e as correções são estornos.\"\n\n→ `04-Payments.js` §2\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// Ledger — o livro onde cada movimento soma zero\n// Para que serve: registar cada euro que entra ou sai, sem nunca apagar nada.\n// Regra essencial: cada transação tem ≥ 2 lançamentos que somam 0; o saldo é a SOMA dos lançamentos, não uma coluna editada.\n// O que guarda: #entries = lista só de acrescentar (append-only) de { txId, phase, account, amount };\n//               #txIds = ids já usados (impede a mesma transação duas vezes);\n//               #internal = contas internas do banco, que podem ficar negativas.\n//               amount: + entra na conta, − sai da conta. phase: \"committed\" (liquidado) ou \"pending\" (retido).\n\nclass Ledger {\n  #entries = []; // append-only: nunca se edita nem apaga\n  #txIds = new Set();\n  #internal = new Set();\n\n  openInternal(acc) { this.#internal.add(acc); }\n\n  #post(txId, phase, legs) {\n    if (this.#txIds.has(txId)) throw new Error(`tx duplicada ${txId}`);\n    if (legs.length \u003c 2) throw new Error(\"precisa de ≥ 2 lançamentos\");\n    const sum = legs.reduce((s, l) => s + l.amount, 0n);\n    if (sum !== 0n) throw new Error(`tx ${txId} não soma zero (${sum})`);\n    this.#txIds.add(txId);\n    for (const l of legs) this.#entries.push(Object.freeze({ txId, phase, ...l }));\n  }\n\n  balance(acc, phase = \"committed\") {\n    return this.#entries\n      .filter((e) => e.account === acc && e.phase === phase)\n      .reduce((s, e) => s + e.amount, 0n);\n  }\n\n  // Disponível = liquidado − retenções a SAIR. Uma retenção a entrar não conta.\n  // Soma por retenção (hold): uma retenção libertada soma 0 e deixa de contar.\n  available(acc) {\n    const porHold = new Map(); // chave = id da autorização; valor = soma pendente dessa autorização nesta conta\n    for (const e of this.#entries)\n      if (e.account === acc && e.phase === \"pending\") porHold.set(e.hold, (porHold.get(e.hold) ?? 0n) + e.amount);\n    let retido = 0n;\n    for (const v of porHold.values()) if (v \u003c 0n) retido += v;\n    return this.balance(acc) + retido;\n  }\n\n  #checkFunds(acc, amount) {\n    if (!this.#internal.has(acc) && this.available(acc) \u003c amount) throw new Error(`saldo insuficiente em ${acc}`);\n  }\n\n  transfer(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"committed\", [{ account: from, amount: -amount }, { account: to, amount }]);\n  }\n\n  // Autorização = retenção. Só mexe na fase pending.\n  authorise(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"pending\", [{ account: from, amount: -amount, hold: txId }, { account: to, amount, hold: txId }]);\n  }\n\n  // Liquidação: liberta a retenção e lança o valor final (pode ser \u003c autorizado).\n  settle(txId, authTxId, finalAmount) {\n    const auth = this.#entries.filter((e) => e.txId === authTxId);\n    const [from, to] = [auth.find((e) => e.amount \u003c 0n), auth.find((e) => e.amount > 0n)];\n    if (finalAmount > to.amount) throw new Error(\"liquidação acima do autorizado\");\n    this.#post(`${txId}:release`, \"pending\", auth.map((e) => ({ account: e.account, amount: -e.amount, hold: authTxId })));\n    this.#post(txId, \"committed\", [{ account: from.account, amount: -finalAmount }, { account: to.account, amount: finalAmount }]);\n  }\n\n  // Corrigir = nova transação, ao contrário, com referência à original. Nunca editar a original.\n  reverse(txId, originalTxId) {\n    const orig = this.#entries.filter((e) => e.txId === originalTxId && e.phase === \"committed\");\n    if (orig.length === 0) throw new Error(\"nada para estornar\");\n    this.#post(txId, \"committed\", orig.map((e) => ({ account: e.account, amount: -e.amount, reverses: originalTxId })));\n  }\n\n  // Invariante global: a soma de TODOS os lançamentos, por fase, é zero.\n  assertInvariants() {\n    for (const phase of [\"pending\", \"committed\"]) {\n      const total = this.#entries.filter((e) => e.phase === phase).reduce((s, e) => s + e.amount, 0n);\n      assert.equal(total, 0n, `ledger desequilibrado na fase ${phase}`);\n    }\n  }\n}\n\n// Antes → operação → depois (o que cada método escreve)\n//   método        fase                   lançamentos\n//   transfer      committed              from −X, to +X\n//   authorise     pending                from −X, to +X (só retém)\n//   settle        pending + committed    liberta a retenção (+X, −X) e lança o valor final\n//   reverse       committed              o oposto de cada lançamento da original\n\n// Confusão possível: débito/crédito vs o sinal deste código — aqui + é \"entra nesta conta\". Em contabilidade, um depósito\n//   DEBITA a caixa do banco (ativo sobe) e CREDITA a conta do cliente (passivo do banco sobe). Os sinais mudam; a soma zero não.\n// Para recordar: cada transação soma 0; o saldo é derivado; corrigir = estornar.\n// Pergunta: que acontece se uma transação tiver os lançamentos −3000n e +2000n?\n// Resposta: #post lança erro \"não soma zero (-1000)\". Nada é gravado: a verificação vem antes do push.\n\n//--------------------------------------------------------------------\n// transfer() — mover dinheiro já\n// Para que serve: depositar €100 na conta da Alice.\n// Regra essencial: uma conta desce e outra sobe o mesmo valor; o mesmo txId não entra duas vezes.\n// O que guarda: L = um ledger; \"bank:cash\" = conta interna do banco (pode ficar negativa); \"alice\" = cliente.\n\nconst L = new Ledger();\nL.openInternal(\"bank:cash\");\nL.transfer(\"dep-1\", \"bank:cash\", \"alice\", 10000n); // depósito de €100,00\n\n// Antes → operação → depois\n//   conta        antes   transfer(\"dep-1\", 10000n)   depois\n//   bank:cash    0       −10000                      −10000n\n//   alice        0       +10000                      10000n\n//   soma         0                                   0\nL.balance(\"alice\"); // result ==> 10000n\nL.balance(\"bank:cash\"); // result ==> -10000n\nassert.throws(() => L.transfer(\"dep-1\", \"bank:cash\", \"alice\", 1n), /duplicada/); // note: lança erro — mesmo txId duas vezes\n\n// Confusão possível: txId vs idempotency key — o txId impede a mesma transação no ledger; a chave (§4) impede o mesmo pedido HTTP de correr duas vezes.\n// Para recordar: transferir = −X de um lado, +X do outro.\n// Pergunta: depois de L.transfer(\"dep-2\", \"bank:cash\", \"alice\", 500n), quanto dá L.balance(\"alice\")?\n// Resposta: 10500n. 10000 + 500; é um txId novo, por isso é aceite.\n\n//--------------------------------------------------------------------\n// authorise() — reter sem mover\n// Para que serve: a Alice paga €30 com cartão; o dinheiro fica preso, mas ainda não saiu.\n// Regra essencial: a retenção só mexe na fase pending. O saldo liquidado não muda; o disponível desce.\n// O que guarda: os lançamentos pending levam hold = \"auth-1\", para saber a que retenção pertencem.\n\nL.authorise(\"auth-1\", \"alice\", \"merchant\", 3000n);\n\n// Antes → operação → depois\n//   conta / saldo             antes    authorise €30   depois\n//   alice  liquidado          10000    —               10000n\n//   alice  pending            0        −3000           −3000n\n//   alice  disponível         10000    −3000           7000n\n//   merchant disponível       0        (+3000 a entrar não conta)   0n\nL.balance(\"alice\"); // result ==> 10000n  (o liquidado continua €100)\nL.balance(\"alice\", \"pending\"); // result ==> -3000n\nL.available(\"alice\"); // result ==> 7000n  (pode gastar €70)\nL.available(\"merchant\"); // result ==> 0n  (uma retenção a entrar não é dinheiro disponível)\nassert.throws(() => L.authorise(\"auth-2\", \"alice\", \"merchant\", 8000n), /insuficiente/); // note: lança erro — 8000 > 7000 disponíveis\n\n// Confusão possível: saldo vs saldo disponível — saldo = liquidado; disponível = liquidado − retenções a sair.\n// Para recordar: retido ≠ liquidado.\n// Pergunta: a Alice tenta reter mais €70 (7000n). Passa?\n// Resposta: sim. available = 7000n e 7000 \u003c 7000 é falso, por isso não há erro. Ficaria com 0n disponível.\n\n//--------------------------------------------------------------------\n// settle() — libertar a retenção e mover o valor final\n// Para que serve: a loja só tinha 1 de 2 artigos e captura €25 dos €30 retidos.\n// Regra essencial: a liquidação liberta a retenção inteira e lança o valor final; pode ser menos, nunca mais.\n// O que guarda: auth = os lançamentos da autorização; from/to = quem paga e quem recebe; finalAmount = o valor capturado.\n\nL.settle(\"set-1\", \"auth-1\", 2500n);\n\n// Antes → operação → depois\n//   alice              antes    settle €25                 depois\n//   liquidado          10000    −2500                      7500n\n//   pending            −3000    +3000 (liberta)            0n\n//   disponível         7000     (os €5 voltam)             7500n\nL.balance(\"alice\"); // result ==> 7500n\nL.balance(\"alice\", \"pending\"); // result ==> 0n\nL.available(\"alice\"); // result ==> 7500n\n\n// Confusão possível: captura parcial vs reembolso parcial — na captura parcial os €5 nunca saíram (a retenção é libertada); um reembolso devolve dinheiro que já saiu.\n// Para recordar: liquidar = libertar a retenção + mover o valor final.\n// Pergunta: e se a loja tentasse liquidar €35 (3500n)?\n// Resposta: erro \"liquidação acima do autorizado\". 3500 > 3000 retidos.\n\n//--------------------------------------------------------------------\n// reverse() — corrigir com o lançamento oposto\n// Para que serve: reembolsar os €25 à Alice.\n// Regra essencial: nunca se edita a transação original; acrescenta-se outra, ao contrário, com referência (reverses).\n// O que guarda: orig = os lançamentos committed da transação original; o estorno grava o simétrico de cada um.\n\nL.reverse(\"ref-1\", \"set-1\");\n\n// Antes → operação → depois\n//   conta       antes    reverse(\"set-1\")   depois\n//   alice       7500     +2500              10000n\n//   merchant    2500     −2500              0n\nL.balance(\"alice\"); // result ==> 10000n\nL.balance(\"merchant\"); // result ==> 0n\nL.assertInvariants(); // note: lança erro se alguma fase não somar 0\n\n// Confusão possível: estorno vs UPDATE — um UPDATE apaga a história; o estorno mantém o erro e a correção, e a auditoria vê os dois.\n// Para recordar: o ledger só cresce; corrigir = estornar.\n// Pergunta: quantos lançamentos tem o ledger agora, contando dep-1, auth-1, set-1:release, set-1 e ref-1?\n// Resposta: 10. Cada uma das 5 transações tem 2 lançamentos; nada foi apagado.\n```"},{"n":"3","title":"Ciclo de vida de um pagamento com cartão","kind":"md","body":"### Ciclo de vida — estados, não uma chamada\n\n- Para que serve: uma encomenda de €30 → autorizar €30 → capturar €25 (um artigo esgotou) → liquidar → reembolsar €25.\n- Regra essencial: cada estado tem regras de dinheiro diferentes (retido, movido, devolvido). As armadilhas: capturar depois de a autorização expirar, ou fazer refund do que nunca foi capturado (isso é um void).\n- O que guarda: o pagamento tem um `status` e um `authExpiresAt`.\n\n```\nauthorise ──► capture ──► settle ──► refund / refund parcial\n    │                        └─────► dispute ──► chargeback (ganho/perdido)\n    └──► void / expire (retenção libertada)\n```\n\n| Passo | Antes → depois do dinheiro |\n|-------|----------------------------|\n| Authorise | O emissor diz sim e **retém** o valor. Nada se moveu ainda |\n| Capture | A loja reclama o valor (total ou parcial; o resto é libertado) |\n| Settle / clearing | O dinheiro move-se mesmo: emissor → rede → adquirente → loja (dias) |\n| Refund | Operação nova no sentido contrário; pode ser parcial |\n| Chargeback | O titular contesta junto do emissor; a loja perde o valor + uma taxa, salvo se provar o contrário |\n\n| Ator | Papel |\n|------|-------|\n| Titular (cardholder) | Dono do cartão |\n| Loja (merchant) | Vende; recebe o dinheiro |\n| Adquirente (acquirer) | O banco da loja |\n| Emissor (issuer) | O banco do titular; aprova ou recusa |\n| Rede (scheme) | Visa / Mastercard: regras e rede |\n| PSP | Stripe, Adyen, RocketGate: liga a loja ao adquirente |\n\n- Avançado: **Stripe PaymentIntent** — `requires_payment_method → requires_confirmation → requires_action (3DS) → processing / requires_capture → succeeded | canceled`. **3DS / SCA (PSD2)**: 2 de 3 fatores (sabes, tens, és); ex.: impressão digital (és) na app do banco no telemóvel (tens). Com 3DS, a responsabilidade pela fraude passa para o emissor.\n- Confusão possível: void vs refund — void cancela a retenção antes da captura; refund devolve dinheiro capturado.\n- Para recordar: autorizar retém; capturar reclama; liquidar move.\n- Pergunta: a loja autorizou €30 e o cliente desiste antes da captura. Refund ou void?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nVoid. Nada foi capturado, por isso só há uma retenção para libertar.\n\n\u003c/details>\n\n### Validade da autorização + máquina de estados\n\n- Para que serve: impedir a captura de uma autorização Visa feita na segunda-feira, se a loja só tentar na terça da semana seguinte.\n- Regra essencial: um passo só é válido se estiver na tabela de transições; uma autorização expirada conta como `expired`, que não tem saídas. Validade online (Stripe): Visa 7 dias CIT, 5 dias MIT (exatamente 4 d 18 h); Mastercard 7. Presencial: Visa 5 dias, Mastercard 2.\n- O que guarda: `TRANSITIONS` — chave = estado atual; valor = estados permitidos a seguir.\n\n| Estado | Pedido | Quando (validade 7 dias) | Estado efetivo | Depois |\n|--------|--------|--------------------------|----------------|--------|\n| authorised | captured | dia 1 | authorised | captured |\n| authorised | captured | dia 8 | expired | erro |\n| authorised | refunded | dia 1 | authorised | erro (é void) |\n\n- Confusão possível: CIT vs MIT — CIT = o cliente está presente a pagar; MIT = a loja cobra sozinha (ex.: rebill de uma subscrição). A Visa dá-lhes validades diferentes.\n- Para recordar: uma captura tardia é uma transição ilegal na tabela, não um if solto.\n- Pergunta: ao dia 8, um void funciona?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. O estado efetivo é `expired`, que não tem saídas: a retenção já se libertou sozinha.\n\n\u003c/details>\n\n- Na entrevista: \"Modelo o pagamento como uma máquina de estados com transições permitidas. Uma captura tardia é uma transição ilegal, não um if perdido.\"\n\n→ `04-Payments.js` §3\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// transition() — só deixar fazer os passos permitidos\n// Para que serve: impedir a loja de capturar uma autorização que já expirou.\n// Regra essencial: um passo só é válido se estiver na tabela. Uma autorização expirada conta como \"expired\".\n// O que guarda: TRANSITIONS — chave = estado atual; valor = estados para onde pode ir.\n//               payment = { status, authExpiresAt }; now = instante do pedido (ms).\n\nconst TRANSITIONS = {\n  authorised: [\"captured\", \"voided\", \"expired\"],\n  captured: [\"settled\", \"refunded\", \"partially_refunded\"],\n  settled: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  partially_refunded: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  disputed: [\"chargeback_lost\", \"chargeback_won\"],\n};\n\nfunction transition(payment, to, now = Date.now()) {\n  // Guarda de autorização tardia: depois de expirar, o estado efetivo é \"expired\".\n  const from = payment.status === \"authorised\" && now > payment.authExpiresAt ? \"expired\" : payment.status;\n  if (!(TRANSITIONS[from] ?? []).includes(to)) throw new Error(`transição ilegal ${from} → ${to}`);\n  return { ...payment, status: to };\n}\n\nconst DAY = 86_400_000;\nconst p0 = { status: \"authorised\", authExpiresAt: 7 * DAY }; // validade de 7 dias\n\n// Antes → operação → depois\n//   estado        pedido       quando    estado efetivo   depois\n//   authorised    captured     dia 1     authorised       captured\n//   authorised    captured     dia 8     expired          erro\n//   authorised    refunded     dia 1     authorised       erro (sem captura → void, não refund)\ntransition(p0, \"captured\", 1 * DAY).status; // result ==> \"captured\"\nassert.throws(() => transition(p0, \"captured\", 8 * DAY), /expired → captured/); // note: lança erro — a retenção expirou\nassert.throws(() => transition(p0, \"refunded\", 1 * DAY), /authorised → refunded/); // note: lança erro — nada foi capturado\n\n// Confusão possível: void vs refund — void cancela uma retenção antes da captura (o dinheiro nunca saiu); refund devolve dinheiro capturado.\n// Para recordar: uma captura tardia é uma transição ilegal na tabela, não um if solto.\n// Pergunta: ao dia 8, transition(p0, \"voided\", 8 * DAY) funciona?\n// Resposta: não. O estado efetivo é \"expired\", que não tem saídas: a retenção já foi libertada sozinha.\n```"},{"n":"4","title":"Idempotência","kind":"md","body":"### Idempotency key + reserva única\n\n- Para que serve: um duplo clique em \"Pagar €10\" envia dois `POST /charges` com a mesma chave → uma só cobrança.\n- Regra essencial: o cliente gera uma chave (UUID v4; na Stripe vai no header `Idempotency-Key`, até 255 caracteres). O servidor **reserva** a chave **antes** de cobrar; quem chega em segundo recebe 409 \"em curso\".\n- O que guarda: tabela `idempotency_keys` — `key` (UNIQUE), `request_hash`, `state` (`in_progress` / `done`), `response`.\n\n```sql\nINSERT INTO idempotency_keys (key, request_hash, state)\nVALUES ($1, $2, 'in_progress')\nON CONFLICT (key) DO NOTHING;      -- 0 linhas = já existe → repetição ou 409\n```\n\n| Pedido | Linha `k1` antes | O que faz | Resposta | Cobranças |\n|--------|------------------|-----------|----------|-----------|\n| A | não existe | reserva e cobra | 201 | 1 |\n| B (ao mesmo tempo) | `in_progress` | não cobra | 409 | 1 |\n\n- Confusão possível: verificar-e-depois-inserir vs reservar — dois pedidos podem passar o \"existe?\" ao mesmo tempo; só o `UNIQUE` escolhe um vencedor.\n- Para recordar: reservar a chave antes do efeito.\n- Pergunta: se o pedido B usasse a chave `k2`, quantas cobranças haveria?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2. Chaves diferentes são pedidos diferentes.\n\n\u003c/details>\n\n### Hash do pedido + resposta guardada + TTL\n\n- Para que serve: o cliente perde a resposta e repete `k1`; recebe a mesma resposta sem nova cobrança.\n- Regra essencial: mesma chave + mesmo corpo → a resposta guardada (mesmo status + corpo). Mesma chave + corpo diferente → erro (a Stripe compara os parâmetros). A Stripe v1 guarda também respostas 500 e pode apagar chaves com ≥ 24 h (TTL).\n- O que guarda: `request_hash` = hash do corpo; `response` = status + corpo da primeira execução.\n\n| Pedido | Linha `k1` antes | Resposta | Cobranças |\n|--------|------------------|----------|-----------|\n| `k1`, €10,00 (repetição) | `done` | 201 `{ chargeId: \"ch_1\" }` | 1 |\n| `k1`, €99,99 | `done` | 422 | 1 |\n| `k1` reutilizada 3 dias depois | apagada (TTL) | tratada como pedido novo | 2 |\n\n- Confusão possível: 409 vs 422 — 409 = o mesmo pedido ainda está a correr (tenta depois); 422 = chave reutilizada com outro corpo (erro do cliente).\n- Para recordar: repetição devolve a mesma resposta; corpo diferente é recusado.\n- Pergunta: o corpo repetido tem os mesmos campos noutra ordem. Com `JSON.stringify` simples, que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n422: a ordem muda a string e portanto o hash. Em produção normaliza-se o corpo antes do hash.\n\n\u003c/details>\n\n### Escrita atómica + idempotência natural\n\n- Para que serve: garantir que o efeito (lançamentos no ledger) e a resposta guardada nunca ficam desencontrados.\n- Regra essencial: os dois na **mesma** transação da BD — ou ficam os dois, ou nenhum. Se os dados já têm um id único, usar esse: `UNIQUE(provider_event_id)` nos webhooks, `UNIQUE(order_id)` nas cobranças.\n- O que guarda: `entries` (o efeito) e `idempotency_keys.response` (a resposta).\n\n```sql\nBEGIN;\nINSERT INTO entries ...;                                          -- o efeito\nUPDATE idempotency_keys SET state = 'done', response = $r WHERE key = $1;\nCOMMIT;                                                           -- os dois ou nenhum\n```\n\n| Falha | Sem transação | Com transação |\n|-------|---------------|---------------|\n| Processo morre entre os dois passos | cobrado, chave ainda `in_progress` | nada gravado; repetir é seguro |\n\n- Confusão possível: a cobrança no PSP fica fora desta transação — por isso a mesma chave também vai para o PSP (§5).\n- Para recordar: efeito e resposta no mesmo `COMMIT`.\n- Pergunta: porque é que `UNIQUE(order_id)` dispensa uma chave à parte?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nPorque a encomenda já identifica o pedido: uma segunda cobrança da mesma encomenda falha no `INSERT`.\n\n\u003c/details>\n\n- Na entrevista: \"Uma idempotency key com constraint única, reservada antes do efeito, com hash do pedido e resposta guardada para repetição.\"\n\n→ `04-Payments.js` §4\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// IdempotencyStore — mesma chave, um só efeito\n// Para que serve: um duplo clique em \"Pagar €10\" envia dois pedidos com a mesma chave; só se cobra uma vez.\n// Regra essencial: a chave é RESERVADA antes de cobrar. O segundo pedido vê \"em curso\" e recebe 409.\n// O que guarda: #rows é um Map; chave = idempotency key; valor = { hash do corpo, state, response }.\n//               charges = quantas cobranças aconteceram de facto.\n\nclass IdempotencyStore {\n  #rows = new Map(); // em produção: uma tabela com UNIQUE(key)\n\n  async run(key, body, handler) {\n    const hash = crypto.createHash(\"sha256\").update(JSON.stringify(body)).digest(\"hex\");\n    const row = this.#rows.get(key);\n    if (row) {\n      if (row.hash !== hash) return { status: 422, body: \"mesma chave, pedido diferente\" };\n      if (row.state === \"in_progress\") return { status: 409, body: \"pedido em curso, tenta mais tarde\" };\n      return row.response; // repetição: a MESMA resposta, sem correr outra vez\n    }\n    this.#rows.set(key, { hash, state: \"in_progress\" }); // reservar ANTES do primeiro await = INSERT ... UNIQUE\n    try {\n      const response = { status: 201, body: await handler() };\n      this.#rows.set(key, { hash, state: \"done\", response });\n      return response;\n    } catch (err) {\n      this.#rows.delete(key); // shortcut: só é seguro se a falha veio antes de qualquer efeito\n      throw err;\n    }\n  }\n}\n\nconst store = new IdempotencyStore();\nlet charges = 0;\nconst charge = async () => { await new Promise((r) => setTimeout(r, 5)); return { chargeId: `ch_${++charges}` }; };\nconst body = { amount: 1000, currency: \"EUR\" };\n\nasync function idempotenciaConcorrente() {\n  const [a, b] = await Promise.all([store.run(\"k1\", body, charge), store.run(\"k1\", body, charge)]);\n\n  // Antes → operação → depois\n  //   pedido   linha \"k1\" antes   o que faz              resposta\n  //   A        não existe         reserva e cobra        201\n  //   B        in_progress        não cobra              409\n  [a.status, b.status].sort(); // result ==> [201, 409]\n  charges; // result ==> 1  (cobrado uma vez)\n}\n\n// Confusão possível: verificar-e-depois-inserir vs reservar — dois pedidos podem passar o \"existe?\" ao mesmo tempo; só a reserva atómica (UNIQUE) decide um vencedor.\n// Para recordar: reservar a chave antes do efeito.\n// Pergunta: se o segundo pedido usasse a chave \"k2\", quanto daria charges?\n// Resposta: 2. Chaves diferentes são pedidos diferentes; cada um cobra.\n\n//--------------------------------------------------------------------\n// resposta guardada + hash do pedido — repetir em segurança\n// Para que serve: o cliente perdeu a resposta e repete o pedido \"k1\"; recebe a mesma resposta, sem nova cobrança.\n// Regra essencial: mesma chave + mesmo corpo → resposta guardada. Mesma chave + corpo diferente → 422.\n// O que guarda: replay = a resposta guardada na primeira vez; o hash do corpo distingue \"mesmo pedido\" de \"pedido diferente\".\n\nasync function idempotenciaRepeticao() {\n  const replay = await store.run(\"k1\", body, charge);\n\n  // Antes → operação → depois\n  //   pedido               linha \"k1\" antes   resposta    charges\n  //   k1, €10,00           done               201 ch_1    1\n  //   k1, €99,99           done               422         1\n  replay; // result ==> { status: 201, body: { chargeId: \"ch_1\" } }\n  charges; // result ==> 1\n  (await store.run(\"k1\", { amount: 9999, currency: \"EUR\" }, charge)).status; // result ==> 422\n}\n\n// Confusão possível: 409 vs 422 — 409 = mesmo pedido ainda em curso (tenta mais tarde); 422 = chave reutilizada com outro corpo (erro do cliente).\n// Para recordar: repetição devolve a mesma resposta; corpo diferente é recusado.\n// Avançado: a Stripe guarda também respostas 500; aqui um erro apaga a chave, o que só é seguro se nada foi cobrado.\n// Pergunta: o cliente repete \"k1\" com { currency: \"EUR\", amount: 1000 } (mesmos valores, outra ordem). Que recebe aqui?\n// Resposta: 422. JSON.stringify depende da ordem das chaves, por isso o hash muda; em produção normaliza-se o corpo antes do hash.\n```"},{"n":"5","title":"Retries","kind":"md","body":"### Que erros repetir\n\n- Para que serve: o PSP responde 503 duas vezes e depois funciona; um cartão recusado nunca se repete.\n- Regra essencial: só se repete o que pode passar sozinho. Retries maus derrubam um serviço que está a recuperar e duplicam cobranças.\n- O que guarda: `err.status` (HTTP) e `err.code` (`ETIMEDOUT`, `card_declined`, …).\n\n| Repetir | Não repetir |\n|---------|-------------|\n| Timeout, `ECONNRESET` | 4xx de validação |\n| 5xx, 429 (respeitar `Retry-After`) | Recusa do emissor (`card_declined`) |\n| — | Suspeita de fraude, cartão roubado |\n\n- Confusão possível: 429 é 4xx mas é temporário (\"estás a pedir demais\").\n- Para recordar: uma recusa é uma resposta, não uma falha.\n- Pergunta: `isRetryable({ status: 402, code: \"card_declined\" })`?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`false`. O emissor respondeu \"não\"; repetir não muda a resposta.\n\n\u003c/details>\n\n### Backoff + jitter, numa só camada, com orçamento\n\n- Para que serve: 10 000 clientes falham ao mesmo tempo; sem jitter repetiam todos no mesmo instante.\n- Regra essencial: espera = `aleatório(0, min(teto, base · 2^n))` (full jitter). Repetir numa **só** camada: tentativas aninhadas multiplicam (AWS: 3 tentativas × 5 camadas = **243×** carga na BD). Orçamento (retry budget): um token bucket por cliente; sem tokens, sem retry.\n- O que guarda: `attempt` = n.º da tentativa; `base` = 100 ms; `cap` = 5000 ms.\n\n| Tentativa | `base · 2^n` | Com teto | `rand` | Espera |\n|-----------|--------------|----------|--------|--------|\n| 0 | 100 | 100 | 0.999 | 99 ms |\n| 3 | 800 | 800 | 0.5 | 400 ms |\n| 20 | 104 857 600 | 5000 | 0.999 | 4995 ms |\n\n- Confusão possível: backoff vs jitter — backoff faz a espera crescer; jitter espalha os clientes. Precisa-se dos dois.\n- Para recordar: crescer + aleatório + teto, numa camada.\n- Pergunta: um cliente com 10 tokens de retry, a meio de uma falha geral, tenta o 11.º retry. Que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nFalha logo, sem repetir: não há tokens. Assim não acrescenta carga a quem está a recuperar.\n\n\u003c/details>\n\n### Resultado desconhecido\n\n- Para que serve: o PSP cobra a encomenda 42, mas a resposta perde-se num timeout.\n- Regra essencial: timeout ≠ falha. Antes de repetir, consultar o PSP com a **mesma** chave (`psp.find(key)`). Se não for possível, marcar `unknown` e deixar a reconciliação (§8) decidir.\n- O que guarda: `psp.charges` — chave = chave do pedido (`\"order-42\"`); valor = a cobrança.\n\n| Tentativa | O que faz | `psp.charges` | Resultado |\n|-----------|-----------|---------------|-----------|\n| 0 | `charge` | `order-42 → ch_1` | timeout (mas cobrou!) |\n| 1 | `find(\"order-42\")` | igual | `ch_1`, sem nova cobrança |\n\n- Confusão possível: \"deu erro\" vs \"não sei\" — o PSP pode ter cobrado e só a resposta se perdeu.\n- Para recordar: timeout = \"ainda não sei\".\n- Pergunta: sem o `find` e com um PSP que ignora a chave, quantas cobranças?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2. A primeira aconteceu apesar do timeout; a segunda seria nova.\n\n\u003c/details>\n\n- Na entrevista: \"Só repito erros temporários, com backoff e jitter, numa camada, dentro de um orçamento. Um timeout é um resultado desconhecido: verifico antes de repetir.\"\n\n→ `04-Payments.js` §5\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// isRetryable() — o erro pode passar sozinho?\n// Para que serve: o PSP responde 503 → tentar outra vez; o banco recusa o cartão → nunca repetir.\n// Regra essencial: só se repete o que é temporário (timeout, ligação cortada, 5xx, 429).\n// O que guarda: err.status = código HTTP; err.code = código do erro (ETIMEDOUT, card_declined, …).\n\nfunction isRetryable(err) {\n  if (err.code === \"ETIMEDOUT\" || err.code === \"ECONNRESET\") return true;\n  if (err.status === 429 || (err.status >= 500 && err.status \u003c= 599)) return true;\n  return false; // 4xx, recusa do emissor (card_declined), fraude → nunca repetir\n}\n\n// Antes → operação → depois\n//   erro                       temporário?   depois\n//   503                        sim           true\n//   402 card_declined          não           false\n//   400 (validação)            não           false\nisRetryable({ status: 503 }); // result ==> true\nisRetryable({ status: 402, code: \"card_declined\" }); // result ==> false\nisRetryable({ status: 400 }); // result ==> false\n\n// Confusão possível: 429 vs 4xx — 429 é 4xx mas é temporário (\"estás a pedir demais\"); repete-se respeitando Retry-After.\n// Para recordar: repetir só o temporário; uma recusa é uma resposta, não uma falha.\n// Pergunta: quanto dá isRetryable({ code: \"ECONNRESET\" })?\n// Resposta: true. A ligação caiu; o pedido pode resultar numa nova tentativa.\n\n//--------------------------------------------------------------------\n// backoff() — esperar cada vez mais, a um tempo aleatório (\"full jitter\")\n// Para que serve: 10 000 clientes falham ao mesmo tempo; sem jitter repetiam todos no mesmo milissegundo.\n// Regra essencial: espera = aleatório(0, min(teto, base · 2^tentativa)).\n// O que guarda: attempt = número da tentativa (0, 1, 2…); rand = função que dá um número em [0, 1); base = 100 ms; cap = 5000 ms.\n\nconst backoff = (attempt, rand, base = 100, cap = 5000) => Math.floor(rand() * Math.min(cap, base * 2 ** attempt));\n\n// Antes → operação → depois\n//   attempt   base · 2^n   teto aplicado   rand    depois\n//   0         100          100             0.999   99\n//   3         800          800             0.5     400\n//   20        104857600    5000            0.999   4995\nbackoff(0, () => 0.999); // result ==> 99\nbackoff(3, () => 0.5); // result ==> 400\nbackoff(20, () => 0.999); // result ==> 4995  (nunca
