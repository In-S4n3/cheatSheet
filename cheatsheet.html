acima do teto)\n\n// Confusão possível: backoff vs jitter — backoff faz a espera crescer; jitter espalha os clientes no tempo. Precisa-se dos dois.\n// Para recordar: crescer + aleatório + teto.\n// Pergunta: quanto dá backoff(2, () => 0.5)?\n// Resposta: 200. 100 · 2² = 400, abaixo do teto; 0.5 × 400 = 200.\n\n//--------------------------------------------------------------------\n// withRetry() — repetir só o que é temporário, até um limite\n// Para que serve: o PSP dá 503 duas vezes e à terceira responde \"ok\".\n// Regra essencial: para logo se o erro não for temporário ou se chegou ao máximo de tentativas.\n// O que guarda: attempt = tentativa atual; maxAttempts = limite (4); calls/declines = quantas vezes a função correu.\n\nasync function withRetry(fn, { maxAttempts = 4, sleep = async () => {}, rand = Math.random } = {}) {\n  for (let attempt = 0; ; attempt++) {\n    try {\n      return await fn(attempt); // sucesso: o return termina o ciclo\n    } catch (err) {\n      if (!isRetryable(err) || attempt + 1 >= maxAttempts) throw err;\n      await sleep(backoff(attempt, rand));\n    }\n  }\n}\n\nasync function retryDemo() {\n  let calls = 0;\n  const flaky = async () => { calls++; if (calls \u003c 3) throw { status: 503 }; return \"ok\"; };\n  // Antes → operação → depois (uma linha por tentativa)\n  //   attempt   calls   resultado   decisão\n  //   0         1       503         repetir\n  //   1         2       503         repetir\n  //   2         3       \"ok\"        devolver\n  await withRetry(flaky); // result ==> \"ok\"\n  calls; // result ==> 3\n\n  let declines = 0;\n  await assert.rejects(withRetry(async () => { declines++; throw { status: 402, code: \"card_declined\" }; })); // note: rejeita — a recusa volta logo\n  declines; // result ==> 1  (uma recusa não se repete)\n}\n\n// Confusão possível: maxAttempts vs retries — maxAttempts = 4 são 4 chamadas no total (1 + 3 repetições), não 4 repetições.\n// Para recordar: temporário → espera e repete; definitivo → falha já.\n// Pergunta: se flaky falhasse sempre com 503, quantas vezes corria?\n// Resposta: 4. À 4.ª falha, attempt + 1 >= 4 e o erro é lançado.\n\n//--------------------------------------------------------------------\n// retries em camadas — porque só se repete numa camada\n// Para que serve: perceber porque um pequeno problema na BD vira uma avalanche.\n// Regra essencial: 3 tentativas em cada uma de 5 camadas multiplicam: 3^5 pedidos chegam à BD.\n// O que guarda: nada; é a conta da multiplicação.\n\n3 ** 5; // result ==> 243\n\n// Antes → operação → depois\n//   camadas   pedidos à BD por cada pedido do cliente\n//   1         3\n//   2         9\n//   5         243\n\n// Confusão possível: limite por camada vs limite global — 3 por camada parece pouco, mas os limites multiplicam-se. Usar uma camada e um orçamento (retry budget: sem tokens, sem retry).\n// Para recordar: retries aninhados multiplicam a carga.\n// Pergunta: e 2 tentativas em 4 camadas?\n// Resposta: 16. 2^4 = 16 pedidos à BD.\n\n//--------------------------------------------------------------------\n// resultado desconhecido — timeout depois de cobrar\n// Para que serve: o PSP cobra a encomenda 42, mas a resposta perde-se num timeout. Não cobrar outra vez.\n// Regra essencial: timeout ≠ falha. Antes de repetir, perguntar \"já aconteceu?\" e usar a MESMA chave.\n// O que guarda: psp.charges é um Map; chave = chave do pedido (\"order-42\"); valor = { id, amount } da cobrança.\n//               dropNext = true faz a primeira resposta perder-se.\n\nasync function unknownOutcomeDemo() {\n  const psp = { charges: new Map(), dropNext: true };\n  psp.charge = async (key, amount) => {\n    if (!psp.charges.has(key)) psp.charges.set(key, { id: `ch_${psp.charges.size + 1}`, amount });\n    if (psp.dropNext) { psp.dropNext = false; throw { code: \"ETIMEDOUT\" }; } // cobrou, mas a resposta perdeu-se\n    return psp.charges.get(key);\n  };\n  psp.find = async (key) => psp.charges.get(key) ?? null;\n\n  const key = \"order-42\";\n  const result = await withRetry(async (attempt) => (attempt > 0 && (await psp.find(key))) || psp.charge(key, 1000));\n\n  // Antes → operação → depois\n  //   attempt   o que faz            psp.charges     resultado\n  //   0         charge               order-42 → ch_1 ETIMEDOUT (cobrou!)\n  //   1         find(\"order-42\")     igual           ch_1 (não cobra outra vez)\n  result.id; // result ==> \"ch_1\"\n  psp.charges.size; // result ==> 1  (cobrado uma vez)\n}\n\n// Confusão possível: \"deu erro\" vs \"não sei\" — um timeout pode esconder uma cobrança feita. Se não for possível consultar, marcar \"unknown\" e deixar a reconciliação (§8) decidir.\n// Para recordar: timeout = \"ainda não sei\", não \"falhou\".\n// Pergunta: se o retry não chamasse find e o PSP ignorasse a chave, quantas cobranças haveria?\n// Resposta: 2. A primeira aconteceu mesmo, apesar do timeout, e a segunda seria nova.\n```"},{"n":"6","title":"Concorrência","kind":"md","body":"### Corrida no saldo (lost update) + update condicional\n\n- Para que serve: impedir que dois levantamentos de €30 de uma conta com €50 passem os dois (double-spend).\n- Regra essencial: a armadilha é ler → verificar no código → escrever; entre a leitura e a escrita o mundo mudou. Caso simples: deixar a BD verificar numa só linha — `UPDATE accounts SET balance = balance - 3000 WHERE id = $id AND balance >= 3000`; 0 linhas alteradas = recusado.\n- O que guarda: `acc.balance` = saldo partilhado; `read` = a cópia velha que cada pedido leu.\n\n| Passo | Pedido A | Pedido B | Saldo |\n|-------|----------|----------|-------|\n| ler | 5000 | 5000 | 5000 |\n| verificar | 5000 ≥ 3000 | 5000 ≥ 3000 | 5000 |\n| escrever | 5000 − 3000 | 5000 − 3000 | 2000 (saíram €60, desceu €30) |\n\n- Confusão possível: mutex em Go (`sync.Mutex`) vs lock na BD — o mutex protege a memória de um processo; com 2 réplicas, cada uma tem o seu e os dois levantamentos passam. O lock vive na BD.\n- Para recordar: nunca verificar o saldo no código entre ler e escrever.\n- Pergunta: com o `UPDATE` condicional, o segundo levantamento de €30 vê que saldo?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n2000. O primeiro já escreveu; `2000 >= 3000` é falso, 0 linhas alteradas → recusado.\n\n\u003c/details>\n\n### Escolher a ferramenta: version, FOR UPDATE, SERIALIZABLE, UNIQUE, um escritor\n\n- Para que serve: escolher a proteção certa para o tipo de conflito.\n- Regra essencial: a BD é o árbitro. Lock otimista: `UPDATE … WHERE version = $lida`; 0 linhas → reler e decidir de novo.\n- O que guarda: `accounts.version` = contador que sobe a cada escrita.\n\n```sql\nUPDATE accounts SET balance = $new, version = version + 1\nWHERE id = $id AND version = $read_version;   -- 0 linhas → conflito, reler\n```\n\n| Situação | Ferramenta | Antes → depois |\n|----------|------------|----------------|\n| Conflitos raros | `version` (otimista) | A escreve v0→v1; B falha, relê 2000, recusa |\n| Muitos pedidos na mesma conta | `SELECT … FOR UPDATE` (trancar por ordem de id, evita deadlock) | B espera que A faça `COMMIT` |\n| Regra sobre várias linhas (\"máx. €1000/dia em todas as contas\") | `SERIALIZABLE`; erro Postgres `40001` → repetir a transação toda | a segunda transação falha e repete |\n| \"Só um pode ganhar\" (um refund por pagamento) | `UNIQUE(payment_id)` | o 2.º `INSERT` falha |\n| Volume muito alto | um escritor por conta (fila/partição por `account_id`) **[inferido]** | a corrida deixa de existir |\n\n- Confusão possível: lock otimista vs `FOR UPDATE` — o otimista não bloqueia e repete em conflito; `FOR UPDATE` bloqueia a linha até ao fim da transação.\n- Para recordar: a versão diz se alguém chegou primeiro.\n- Pergunta: com `version`, dois levantamentos de €20 de €50 — quanto fica?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n€10. B falha a primeira escrita, relê 3000 (v1), 3000 ≥ 2000, escreve 1000 (v2). Passam os dois.\n\n\u003c/details>\n\n- Na entrevista: \"A BD é o árbitro: update condicional, versão ou FOR UPDATE. Nunca verifico o saldo no código entre uma leitura e uma escrita.\"\n\n→ `04-Payments.js` §6\n\n### Code (04-Payments.js)\n\n```js\nconst tick = () => new Promise((r) => setImmediate(r));\n\n//--------------------------------------------------------------------\n// lost update — ler, esperar, escrever\n// Para que serve: mostrar o bug em que dois levantamentos de €30 de uma conta com €50 passam os dois.\n// Regra essencial: entre ler o saldo e escrevê-lo, outro pedido pode ter mudado o saldo.\n// O que guarda: acc.balance = saldo partilhado; read = a cópia que cada pedido leu.\n\nasync function lostUpdateDemo() {\n  const acc = { balance: 5000n };\n  const naiveWithdraw = async (amt) => {\n    const read = acc.balance;\n    await tick(); // o outro \"pedido\" corre aqui\n    if (read \u003c amt) throw new Error(\"sem saldo\");\n    acc.balance = read - amt;\n  };\n  await Promise.all([naiveWithdraw(3000n), naiveWithdraw(3000n)]);\n\n  // Antes → operação → depois\n  //   passo         pedido A        pedido B        acc.balance\n  //   ler           read = 5000     read = 5000     5000\n  //   verificar     5000 ≥ 3000     5000 ≥ 3000     5000\n  //   escrever      5000 − 3000     5000 − 3000     2000 (saíram €60, desceu €30)\n  acc.balance; // result ==> 2000n  (BUG)\n}\n\n// Confusão possível: verificar no código vs verificar na BD — o if no código vê um valor velho; a BD vê o valor atual (UPDATE ... WHERE balance >= 3000).\n// Para recordar: nunca ler → verificar → escrever sem proteção.\n// Pergunta: com 3 levantamentos de €30 em simultâneo, quanto daria acc.balance?\n// Resposta: 2000n. Os três leem 5000 e todos escrevem 5000 − 3000; saem €90 e o saldo só desce €30.\n\n//--------------------------------------------------------------------\n// lock otimista (version) — escrever só se ninguém mudou a linha\n// Para que serve: corrigir o bug anterior: dos dois levantamentos de €30, só um passa.\n// Regra essencial: UPDATE ... WHERE version = $lida. 0 linhas alteradas = conflito → ler outra vez e decidir de novo.\n// O que guarda: row = { balance, version }; compareAndSet devolve false se a versão mudou (= 0 linhas alteradas).\n\nasync function optimisticLockDemo() {\n  const row = { balance: 5000n, version: 0 };\n  const compareAndSet = (expectedVersion, balance) => {\n    if (row.version !== expectedVersion) return false;\n    Object.assign(row, { balance, version: row.version + 1 });\n    return true;\n  };\n  const safeWithdraw = async (amt) => {\n    for (;;) {\n      const { balance, version } = { ...row };\n      await tick();\n      if (balance \u003c amt) return \"declined\";\n      if (compareAndSet(version, balance - amt)) return \"ok\";\n    }\n  };\n  const results = await Promise.all([safeWithdraw(3000n), safeWithdraw(3000n)]);\n\n  // Antes → operação → depois\n  //   passo                       A                   B                        row\n  //   ler                         5000, v0            5000, v0                 5000, v0\n  //   escrever (WHERE v = 0)      ok                  0 linhas → reler         2000, v1\n  //   reler e verificar           —                   2000 \u003c 3000 → declined   2000, v1\n  results.sort(); // result ==> [\"declined\", \"ok\"]\n  row.balance; // result ==> 2000n\n  row.version; // result ==> 1\n}\n\n// Confusão possível: lock otimista vs FOR UPDATE — o otimista não bloqueia e repete em conflito (bom se os conflitos são raros); FOR UPDATE bloqueia a linha (bom se muitos pedidos batem na mesma conta).\n// Para recordar: a BD é o árbitro; a versão diz se alguém chegou primeiro.\n// Pergunta: se os dois levantamentos fossem de €20, quanto daria row.balance?\n// Resposta: 1000n. B falha a primeira escrita, relê 3000 (v1), 3000 ≥ 2000, escreve 1000 (v2). Os dois passam.\n\n//--------------------------------------------------------------------\n// Correr os exemplos assíncronos por ordem (fora da resposta escondida do último bloco).\n(async () => {\n  await idempotenciaConcorrente();\n  await idempotenciaRepeticao();\n  await retryDemo();\n  await unknownOutcomeDemo();\n  await lostUpdateDemo();\n  await optimisticLockDemo();\n  console.log(\"✅ Payments OK\");\n})().catch((err) => {\n  console.error(\"❌\", err);\n  process.exit(1);\n});\n```"},{"n":"7","title":"Consistência entre sistemas","kind":"md","body":"### Outbox — publicar um evento sem o perder\n\n- Para que serve: o ledger lança um pagamento de €25 e o serviço de emails tem de receber `payment.succeeded`.\n- Regra essencial: sem transação distribuída. `db.commit(); kafka.publish()` perde o evento se o processo morrer entre os dois. Em vez disso, escrever o evento numa tabela `outbox` na **mesma** transação; um relay publica-o depois.\n- O que guarda: `outbox` — `event_id`, `type`, `payload`, e se já foi enviado.\n\n```sql\nBEGIN;\nINSERT INTO entries ...;\nINSERT INTO outbox (event_id, type, payload) VALUES ($e, 'payment.succeeded', $p);\nCOMMIT;   -- o relay lê a outbox e publica no Kafka\n```\n\n| Processo morre depois do COMMIT | `entries` | Evento |\n|---------------------------------|-----------|--------|\n| `commit` + `publish` direto | gravado | perdido |\n| Outbox | gravado | na `outbox`; o relay publica quando voltar |\n\n- Confusão possível: outbox vs \"publicar e depois gravar\" — ao contrário também falha: evento enviado de um pagamento que nunca foi gravado.\n- Para recordar: evento e dados no mesmo `COMMIT`.\n- Pergunta: o relay publica e morre antes de marcar a linha como enviada. Que acontece?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nPublica o mesmo evento outra vez quando voltar. É entrega at-least-once — o consumidor tem de ser idempotente.\n\n\u003c/details>\n\n### At-least-once + consumidor idempotente\n\n- Para que serve: o evento `e1` chega duas vezes e o email só sai uma vez.\n- Regra essencial: um evento pode chegar 2×. O consumidor regista `event_id` numa tabela `processed_events` com `UNIQUE`, **dentro** da transação do efeito. \"Exactly-once\" na prática = at-least-once + deduplicação.\n- O que guarda: `processed_events.event_id` = eventos já tratados.\n\n| Chegada | `INSERT … ON CONFLICT DO NOTHING` | Efeito |\n|---------|-----------------------------------|--------|\n| `e1` (1.ª) | 1 linha | aplica |\n| `e1` (2.ª) | 0 linhas = já visto | ignora |\n\n- Avançado: **ordem no Kafka** — chave = `account_id`; a ordem só vale dentro de uma partição. **Saga** — desfazer um fluxo de vários passos com **compensações** (refund, libertar a retenção), não com rollback: reter €300 → reservar o voo → emissão falha → cancelar a reserva e libertar a retenção. **Webhooks** — verificar a assinatura HMAC, deduplicar por id, responder 2xx depressa e processar de uma fila; podem chegar fora de ordem (`refunded` antes de `succeeded`): usar a máquina de estados (§3) e ignorar passos para trás, ou reler o objeto na API.\n- Confusão possível: registar o `event_id` fora da transação do efeito — se o efeito falhar, o evento fica \"visto\" e nunca é aplicado.\n- Para recordar: exactly-once = at-least-once + dedupe.\n- Pergunta: um webhook `refunded` chega antes de `succeeded`. Que faz a máquina de estados?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nAplica `refunded` se a transição for válida a partir do estado atual; quando `succeeded` chega depois, é um passo para trás e é ignorado.\n\n\u003c/details>\n\n- Na entrevista: \"Outbox para publicar, consumidores idempotentes para receber, sagas com compensações entre serviços. Exactly-once é at-least-once com dedupe.\""},{"n":"8","title":"Reconciliação e liquidação","kind":"md","body":"### Reconciliação — comparar linha a linha\n\n- Para que serve: comparar o ledger com os relatórios do PSP e o extrato do banco; é a rede de segurança que apanha o que a idempotência e os retries falharam.\n- Regra essencial: linha a linha, por referência externa — nunca pelo total do dia. Diferenças vão para uma fila de exceções para humanos; nunca \"acertar\" um saldo à mão sem um lançamento.\n- O que guarda: de cada lado, id externo (charge id, end-to-end id), valor, moeda e data.\n\n| PSP | Ledger | Resultado |\n|-----|--------|-----------|\n| `ch_1` €25,00 | `set-1` €25,00 | casado |\n| `ch_2` €10,00 | nada | fila de exceções |\n| depósito líquido €24,30 | `set-1` €25,00 | lançar a comissão de €0,70 |\n\n| Passo | O que fazer |\n|-------|-------------|\n| Casar | Pelo id externo; depois valor + moeda + data |\n| Diferenças | Falta no PSP, falta do nosso lado, valor diferente, duplicado |\n| Comissões | A liquidação chega **líquida** de comissões: lançar a comissão no ledger |\n| Tempo | T+1 / T+2: o dinheiro chega dias depois da captura |\n\n- Confusão possível: totais iguais não provam nada — um duplicado e uma falta do mesmo valor anulam-se no total.\n- Para recordar: linha a linha, por referência.\n- Pergunta: o total do dia bate certo. Pode haver erro?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nSim: uma cobrança duplicada e outra em falta, do mesmo valor, dão o mesmo total.\n\n\u003c/details>\n\n### Registo de câmbio (FX) — conversão reproduzível\n\n- Para que serve: converter €100 em USD e conseguir provar o valor meses depois numa auditoria.\n- Regra essencial: guardar a taxa, a fonte, o instante e os dois valores; nunca recalcular depois. Arredondar para a unidade mínima com half-even (§1). Se a fonte principal falhar, usar uma secundária com idade máxima; se as duas falharem, recusar em vez de inventar.\n- O que guarda: `{ from: \"EUR\", to: \"USD\", rate: \"1.08425\", source: \"primary\", at: \"2026-11-13T15:00:00Z\", amountFrom: 10000n, amountTo: 10842n }`.\n\n| Passo | Valor |\n|-------|-------|\n| €100,00 × 1.08425 | $108,425 (empate) |\n| half-even | $108,42 (`10842n`, o 2 é par) |\n| Principal em baixo, secundária com 2 h, máximo 1 h | recusar a conversão |\n\n- Confusão possível: guardar só a taxa vs guardar a taxa + fonte + instante — sem a fonte e o instante, ninguém consegue verificar a taxa.\n- Para recordar: o valor convertido tem de ser reproduzível.\n- Pergunta: €100,00 a uma taxa de 1.08435, quanto dá em cêntimos de USD?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n`10844n`. 10843,5 é empate; 10843 é ímpar, por isso sobe para o par 10844.\n\n\u003c/details>\n\n- Na entrevista: \"Reconciliação diária, linha a linha, por referência externa. Em FX guardo a taxa, a fonte e o instante — o valor tem de ser reproduzível.\""},{"n":"9","title":"Redes de pagamento e glossário curto","kind":"md","body":"| Termo | Numa linha | Exemplo |\n|-------|------------|---------|\n| SEPA SCT | Transferência em euros; liquida no dia útil seguinte | Renda enviada na sexta chega na segunda |\n| SEPA SCT Inst | Instantânea, 24/7, ≤ 10 s; o Regulamento (UE) 2024/886 obriga os PSP da zona euro a enviá-la desde 9 out 2025 | €20 a um amigo no domingo à noite chega em segundos |\n| SEPA SDD | Débito direto; precisa de mandato; o devedor pode contestar | O ginásio puxa €30 por mês |\n| SWIFT | Rede de mensagens entre bancos (internacional); sozinha não move dinheiro | Um pagamento EUR → USD para um banco nos EUA |\n| ISO 20022 | Padrão de mensagens XML. `pain` cliente↔banco, `pacs` banco↔banco, `camt` extratos | Ver a linha seguinte |\n| Exemplos | `pain.001` ordem, `pacs.008` transferência, `pacs.002` estado, `camt.053` extrato | Ficheiro de salários da empresa = `pain.001` |\n| Redes de cartões | Visa, Mastercard, Amex: regras, rede, taxas de intercâmbio | O emissor ganha intercâmbio em cada compra |\n| IBAN / BIC | Id da conta / id do banco | `DE89 3704 0044 0532 0130 00` / `DEUTDEFF` |\n| KYC / AML | Conhecer o cliente / anti-branqueamento (screening, monitorização) | Verificar o documento no registo; nomes contra listas de sanções |\n| PCI DSS | Regras para dados de cartão. **Nunca** guardar o PAN completo nem o CVV | Guardar `last4: \"4242\"`, nunca os 16 dígitos |\n| Tokenização | O PSP guarda o cartão; tu guardas um token (`pm_...`) | Cobrar `pm_123` no mês seguinte, sem dados do cartão do teu lado |\n\n- **[inferido]** Os exemplos ISO 20022 acima são de memória; a página oficial (iso20022.org) devolveu 403.\n- Confusão possível: SWIFT vs SEPA — SWIFT só transporta mensagens; SEPA é um esquema de pagamento em euros com regras de liquidação.\n- Para recordar: cartão = autorização + liquidação adiada; SEPA Inst = push, final em segundos.\n- Pergunta: posso guardar o CVV para facilitar a próxima compra?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. O PCI DSS proíbe guardar o CVV depois da autorização; tokeniza-se no PSP.\n\n\u003c/details>\n\n- Na entrevista: \"Cartões são autorização mais liquidação adiada; SEPA Inst é push e final em segundos. Não guardo o PAN nem o CVV — tokenizo no PSP.\""},{"n":"10","title":"Thought Machine / Vault em 10 linhas","kind":"md","body":"1. **Vault Core** é a plataforma de core banking: ledger + produtos. **Vault Payments** é um produto à parte (processamento de pagamentos).\n2. **Ledger em tempo real**, \"fonte única de verdade\", com fundos em qualquer **ativo e denominação** (moedas, cripto, pontos).\n3. **Sem batch**, diz a brochura de 2023; o whitepaper de 2025 já mede lançamentos \"offline\" de baixa prioridade.\n4. **Produtos = smart contracts** em Python (um subconjunto em sandbox), no \"Universal Product Engine\". O banco muda-os sem tocar no código da plataforma.\n5. **Contratos versionados e imutáveis**; cada conta fica na versão com que abriu. **Supervisor contracts** coordenam vários contratos.\n6. Uma **Postings API** síncrona (alvo \u003c 100 ms) move fundos; os contratos também criam lançamentos (ex.: juros diários).\n7. **Stack:** microserviços, Kubernetes, Istio, **Kafka**; streaming de dados em tempo real; independente da cloud.\n8. **Escala medida:** 4769 TPS online (p95 \u003c 500 ms), 15 035 TPS de consultas de saldo, 30 M de contas.\n9. **[inferido — docs atrás de login]** Os lançamentos agrupam-se num *Posting Instruction Batch*; tipos como authorisation, settlement, release, transfer, hard settlement, custom.\n10. **[inferido — docs atrás de login]** Saldo indexado por conta + endereço + ativo + denominação + fase (`committed`, `pending_in`, `pending_out`). O meu mini-ledger (§2) imita isto, com uma só fase `pending`.\n\n- Confusão possível: Vault Core vs Vault Payments — o Core é o ledger e os produtos; o Payments é o produto de pagamentos.\n- Para recordar: Vault = ledger em tempo real + produtos como código versionado.\n- Pergunta: um banco muda a taxa de juro de um produto. Mexe no código da plataforma?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nNão. Muda o smart contract do produto (uma versão nova); as contas existentes ficam na versão com que abriram.\n\n\u003c/details>\n\n- Na entrevista: \"O Vault é um ledger em tempo real em que o produto é código versionado. O meu papel seria garantir que cada lançamento é atómico, idempotente e equilibrado.\""},{"n":"11","title":"Ponte para a tua experiência","kind":"md","body":"> ⚠️ A coluna \"Frase modelo\" é um exemplo de como nomear o conceito. Confirma no código o que fizeste de facto antes de o dizeres.\n\n| O que fizeste | Conceito | Frase modelo |\n|---------------|----------|--------------|\n| Notificações de falha de rebill (RocketGate, Paynova) | Recusa vs erro temporário; webhooks; MIT recorrente | \"Só uma falha técnica é repetida, nunca uma recusa do emissor.\" |\n| Preços e descontos do Top Up | Cêntimos; arredondamento; allocate | \"Descontos em inteiros, arredondados uma vez, com regra explícita.\" |\n| Fallback da taxa de câmbio | Fonte da taxa; idade máxima; reproduzível | \"Guardo a taxa e a fonte, para o valor poder ser auditado.\" |\n| Cancelamento + reembolso (Duffel) | Reembolso como compensação de uma saga | \"O reembolso é um passo de compensação, não um rollback.\" |\n| Guarda de autorização tardia | Ciclo de vida da autorização; máquina de estados | \"Capturar depois de expirar é uma transição ilegal.\" |\n| Retries aninhados | Tempestade de retries; orçamento; uma camada | \"Retries aninhados multiplicam a carga; passei-os para uma camada.\" |\n| Hotfix \"cobrado N, entregue N\" | Idempotência + cobrança e entrega atómicas | \"Uma chave liga cobrança e entrega; um retry não duplica nenhuma.\" |\n\n- Regra: conta a história real por palavras tuas; usa a coluna \"Conceito\" para dar nome ao padrão.\n- Go vs TypeScript: os mesmos conceitos. Diz \"em Go fazia o mesmo com `database/sql` e uma transação\".\n- Para recordar: história real primeiro, nome do padrão depois.\n- Pergunta: que conceito nomeias ao falar dos retries aninhados?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\nTempestade de retries: tentativas em várias camadas multiplicam-se (3^5 = 243); a correção é uma camada com orçamento.\n\n\u003c/details>"},{"n":"12","title":"Perguntas prováveis + resposta curta","kind":"md","body":"| Pergunta | Resposta curta |\n|----------|----------------|\n| Como evitas cobrar duas vezes? | Idempotency key com `UNIQUE`, reservada antes da cobrança, passada ao PSP, resposta guardada para repetição. |\n| O PSP deu timeout. Repetes? | Não às cegas. Consulto por id/chave; se não for claro, marco `unknown` e a reconciliação decide. |\n| Dois levantamentos ao mesmo tempo? | Update condicional ou `version`; com muita carga, `FOR UPDATE` ou um escritor por conta. |\n| Como guardas dinheiro? | Inteiro na unidade mínima + moeda; expoente ISO 4217; half-even; allocate do resto. |\n| Como corriges uma transação errada? | Um estorno: transação nova, oposta, com referência. O ledger é append-only. |\n| Como garantes que um evento sai depois de uma escrita? | Outbox na mesma transação + relay; consumidores idempotentes. |\n| Como manténs a ordem por conta no Kafka? | Chave de partição = `account_id`; o consumidor lê a partição por ordem. |\n| Que erros repetes? | Timeouts, 5xx, 429 — com backoff, jitter e orçamento. Nunca recusas nem 4xx de validação. |\n| Um webhook chegou duas vezes / fora de ordem? | Verificar a assinatura, deduplicar por id de evento; a máquina de estados ignora passos para trás. |\n| Saldo disponível vs saldo? | Disponível = liquidado − retenções a sair. Retenções a entrar não contam. |\n\n- Para recordar: cada resposta nomeia o mecanismo (UNIQUE, version, outbox), não só a intenção.\n- Pergunta: \"Como evitas cobrar duas vezes?\" — qual é a palavra que não pode faltar?\n\n\u003cdetails>\u003csummary>Ver resposta\u003c/summary>\n\n\"Reservada antes\": a chave é gravada com `UNIQUE` antes de cobrar, senão dois pedidos simultâneos passam os dois.\n\n\u003c/details>"},{"n":"","title":"Sources","kind":"md","body":"- Stripe — Idempotent requests: https://docs.stripe.com/api/idempotent_requests\n- Stripe — PaymentIntent lifecycle: https://docs.stripe.com/payments/paymentintents/lifecycle\n- Stripe — Place a hold (auth/capture, validade): https://docs.stripe.com/payments/place-a-hold-on-a-payment-method\n- AWS Builders' Library — Timeouts, retries and backoff with jitter: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter\n- Thought Machine — Vault Core (current accounts): https://www.thoughtmachine.net/vault-core/current-and-transaction-accounts\n- Thought Machine — Vault Pre-NDA brochure 2023 (PDF): https://info.thoughtmachine.net/hubfs/Vault_Pre_NDA_RGB_2023.pdf\n- Thought Machine — Performance whitepaper: https://www.thoughtmachine.net/whitepapers/performance-proven-the-right-way\n- Thoughtworks Radar — Thought Machine Vault: https://www.thoughtworks.com/radar/platforms/thought-machine-vault\n- FF News — \"We built this bank on smart contracts\": https://ffnews.com/thought-leadership/we-built-this-bank-on-smart-contracts\n- SEPA Inst 2025 (secundária; a EPC devolveu 403): https://www.aciworldwide.com/blog/sepa-instant-payments-whats-new-in-rulebook-2025-and-why-it-matters\n- **Sem acesso:** docs oficiais do Vault (`docs.thoughtmachine.net` → login). Os itens 9–10 do §10 são **[inferidos]**."}]}];
const BUILT = "2026-11-23";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const done = new Set(store.get("done") || []);
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderBody(sec) {
  if (sec.kind === "md") {
    const html = window.marked ? marked.parse(sec.body) : `<pre>${esc(sec.body)}</pre>`;
    return `<div class="md">${html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>")}</div>`;
  }
  // each "//-----" separator starts a new case → its own card; the prose comments become text boxes, only real code stays in <pre>
  const cases = sec.body.split(/^\s*\/\/-{20,}\s*$/m).map((c) => c.trim()).filter(Boolean).map(parseCase);
  // the block before the first labelled case is the section's intro ("Usar quando…"): a note on top, not a step
  const intro = cases.length && !Object.keys(cases[0].f).length && !cases[0].titled ? cases.shift() : null;
  const hl = (s) => {
    const h = window.hljs ? hljs.highlight(s, { language: "javascript" }).value : esc(s);
    return h.replace(/<span class="hljs-comment">\/\/ result ==&gt;/g, '<span class="hljs-comment res">// result ==&gt;');
  };
  const txt = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
  const box = (cls, label, s) => (s ? `<div class="f ${cls}"><span class="lbl">${label}</span>${txt(s)}</div>` : "");
  const html = cases.map((c, i) => `<article class="case" data-i="${i}">
      ${c.name ? `<h3 class="case-name">${txt(c.name)}</h3>${c.sub && !c.titled ? `<p class="case-sub">${txt(c.sub)}</p>` : ""}` : ""}
      ${box("serve", "Para que serve", c.titled ? c.sub.replace(/^serve para\s*/i, "") : c.f["Para que serve"])}
      ${box("rule", "Regra essencial", c.f["Regra essencial"])}
      ${box("keep", "O que guarda", c.f["O que guarda"])}
      ${c.code ? `<span class="lbl code-lbl">Exemplo</span><pre><code>${hl(c.code)}</code></pre>` : ""}
      ${box("confuse", "Confusão possível", c.f["Confusão possível"])}
      ${box("recall", "Para recordar", c.f["Para recordar"])}
      ${c.f["Avançado"] ? `<details class="adv"><summary>Avançado</summary><p>${txt(c.f["Avançado"])}</p></details>` : ""}
      ${c.f["Pergunta"] ? `<div class="f quiz"><span class="lbl">Pergunta</span>${txt(c.f["Pergunta"])}${c.f["Resposta"] ? `<details class="answer"><summary>Ver resposta</summary><p>${txt(c.f["Resposta"])}</p></details>` : ""}</div>` : ""}
    </article>`).join("");
  const nav = cases.length > 1 ? `<div class="stepper"><button type="button" data-step="-1" aria-label="Anterior">←</button><span class="pos"></span><button type="button" data-step="1">Seguinte →</button><button type="button" class="mode"></button></div>` : "";
  const introLines = intro ? intro.raw.split("\n").filter((l) => l.trim()) : [];
  const introHtml = !intro ? ""
    : introLines.every((l) => /^\s*\/\//.test(l))
      ? introLines.some((l) => /[{};]|^\s*\/\/\s*(let|const|while|if|for|else|return)\b/.test(l))
        ? `<pre class="intro-code"><code>${hl(intro.raw.split("\n").map((l) => l.replace(/^(\s*)\/\/ ?/, "$1")).join("\n"))}</code></pre>` // a commented-out template: keep it monospace
        : `<div class="f intro">${introLines.map((l) => `<p>${txt(l.replace(/^\s*\/\/\s?/, ""))}</p>`).join("")}</div>`
      : `<pre class="intro-code"><code>${hl(intro.raw)}</code></pre>`;
  return `${introHtml}${nav}<div class="cases">${html}</div>${nav}`;
}

/*parse:start*/
// Splits one case into its title, labelled prose fields ("// Label: text", with "//   " continuation lines) and the code that is left
function parseCase(c) {
  const LABELS = ["Para que serve", "Regra essencial", "O que guarda", "Confusão possível", "Para recordar", "Avançado", "Pergunta", "Resposta"];
  const re = new RegExp(`^\\s*// (${LABELS.join("|")}):\\s*(.*)$`);
  const lines = c.split("\n");
  const out = { name: "", sub: "", f: {}, code: "", raw: c };
  const code = [];
  let cur = null;
  let i = 0;
  // first line "// NAME — what it does" is the card title (only when it carries no label)
  const own = lines[0].match(/^\s*\/\/ (.+?) - \/\/ (.+)$/); // his own shape: "// nome - // serve para …"
  if (own) {
    out.name = own[1].trim();
    out.sub = own[2].trim();
    out.titled = true;
    i = 1;
  } else if (/^\s*\/\/ /.test(lines[0]) && !re.test(lines[0])) {
    const t = lines[0].replace(/^\s*\/\/\s*/, "");
    const [name, ...rest] = t.split(" — ");
    out.name = name.trim();
    out.sub = rest.join(" — ").trim();
    i = 1;
  }
  for (; i < lines.length; i++) {
    const l = lines[i];
    const m = l.match(re);
    if (m) { cur = m[1]; out.f[cur] = out.f[cur] ? out.f[cur] + " " + m[2] : m[2]; continue; }
    if (cur && /^\s*\/\/\s{2,}\S/.test(l)) { out.f[cur] += " " + l.replace(/^\s*\/\/\s*/, ""); continue; }
    cur = null;
    code.push(l);
  }
  while (code.length && !code[0].trim()) code.shift();
  while (code.length && !code.at(-1).trim()) code.pop();
  out.code = code.join("\n");
  return out;
}
/*parse:end*/

// "Um de cada vez": shows one case of an open section, with Anterior / Seguinte
let oneAtATime = store.get("oneAtATime") ?? true;
function showCase(body, idx) {
  const cases = [...body.querySelectorAll(".case")];
  if (!cases.length) return;
  idx = Math.max(0, Math.min(cases.length - 1, idx));
  body.dataset.idx = idx;
  cases.forEach((c, i) => (c.hidden = oneAtATime && i !== idx));
  body.querySelectorAll(".stepper").forEach((s) => {
    s.querySelector(".pos").textContent = oneAtATime ? `${idx + 1} de ${cases.length}` : `${cases.length} conceitos`;
    s.querySelectorAll("[data-step]").forEach((b) => (b.hidden = !oneAtATime));
    s.querySelector("[data-step='-1']").disabled = idx === 0;
    s.querySelector("[data-step='1']").disabled = idx === cases.length - 1;
    s.querySelector(".mode").textContent = oneAtATime ? "Todos" : "Um a um";
  });
  // a second stepper only helps at the bottom of a long list
  const bottom = body.querySelectorAll(".stepper")[1];
  if (bottom) bottom.hidden = !oneAtATime;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".stepper button");
  if (!b) return;
  const body = b.closest(".body");
  if (b.classList.contains("mode")) {
    oneAtATime = !oneAtATime;
    store.set("oneAtATime", oneAtATime);
    document.querySelectorAll(".body").forEach((x) => x.querySelector(".case") && showCase(x, +x.dataset.idx || 0));
  } else {
    showCase(body, (+body.dataset.idx || 0) + +b.dataset.step);
    if (b.closest(".stepper") === body.querySelectorAll(".stepper")[1]) body.closest("details.sec").scrollIntoView({ block: "start" });
  }
});

function card(tab, sec, i, showFrom) {
  const key = `${tab.id}:${sec.n || "x" + i}:${sec.title}`;
  const d = document.createElement("details");
  d.className = "sec" + (done.has(key) ? " is-done" : "");
  d.innerHTML = `<summary>
      <span class="num">${sec.n ? "§" + sec.n : "★"}</span>
      <span class="title">${showFrom ? `<span class="from">${tab.label}</span><br>` : ""}${esc(sec.title)}</span>
      <label class="done-box"><input type="checkbox" ${done.has(key) ? "checked" : ""} aria-label="Mark as studied"> ok</label>
    </summary><div class="body"></div>`;
  const box = d.querySelector("input");
  box.addEventListener("click", (e) => e.stopPropagation());
  box.addEventListener("change", () => {
    box.checked ? done.add(key) : done.delete(key);
    d.classList.toggle("is-done", box.checked);
    store.set("done", [...done]);
    updateProgress();
  });
  // render the content only when opened (keeps the page light on phones)
  d.addEventListener("toggle", () => {
    const body = d.querySelector(".body");
    if (d.open && !body.innerHTML) { body.innerHTML = renderBody(sec); showCase(body, 0); }
  });
  return d;
}

function currentTab() { return TABS.find((t) => "#" + t.id === location.hash) || TABS[0]; }

function updateProgress() {
  const t = currentTab();
  const total = t.sections.length;
  const n = t.sections.filter((s, i) => done.has(`${t.id}:${s.n || "x" + i}:${s.title}`)).length;
  $("progress").textContent = `${n}/${total} studied`;
}

function render() {
  const q = norm($("q").value.trim());
  const list = $("list");
  list.innerHTML = "";
  const t = currentTab();
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.hash === "#" + t.id && !q ? "page" : "false"));
  if (q) {
    let hits = 0;
    for (const tab of TABS) tab.sections.forEach((s, i) => {
      if (norm(s.title + "\n" + s.body).includes(q)) { list.append(card(tab, s, i, true)); hits++; }
    });
    list.prepend(Object.assign(document.createElement("p"), { className: "hint", textContent: hits ? `${hits} sections mention "${$("q").value.trim()}". Open one to read it.` : "No match. Try another word (e.g. sort, Map, pointers)." }));
  } else {
    list.append(Object.assign(document.createElement("p"), { className: "hint", textContent: `${t.file} · tap a section to open it · tick “ok” once you know it` }));
    t.sections.forEach((s, i) => list.append(card(t, s, i, false)));
    if (t.id === "start") list.querySelector("details").open = true;
  }
  const foot = document.createElement("footer");
  foot.textContent = `Generated on ${BUILT} from the cheatSheet repo. Progress is saved in this browser only.`;
  list.append(foot);
  $("toggle").textContent = "Open all";
  updateProgress();
}

$("tabs").innerHTML = TABS.map((t) => `<a href="#${t.id}">${t.label}</a>`).join("");
$("tabs").addEventListener("click", () => { $("q").value = ""; });
$("q").addEventListener("input", render);
$("toggle").addEventListener("click", () => {
  const all = [...document.querySelectorAll("details.sec")];
  const open = all.some((d) => !d.open);
  all.forEach((d) => (d.open = open));
  $("toggle").textContent = open ? "Close all" : "Open all";
});
window.addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
