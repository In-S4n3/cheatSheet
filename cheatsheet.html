[]); // result ==> []\ncheck(levelOrder(toTree([1, 2, null, 3])), [[1], [2], [3]]); // result ==> [[1], [2], [3]]  (lopsided tree)\n// note: same code solves LC 199 Right Side View (last of each level) and LC 103 Zigzag (reverse odd levels).\n// note: O(n) time, O(n) space"},{"n":"15","title":"FINAL TABLE: SIGNAL IN THE PROBLEM → PATTERN","kind":"code","body":"/*\n  SIGNAL IN THE PROBLEM                                → PATTERN                         §\n  ---------------------------------------------------------------------------------------------\n  \"subarray with sum K\" (with negatives)               → prefix sum + Map                 §2\n  \"group\", \"anagrams\", \"count\", \"seen it before?\"      → Map / Set                        §2\n  \"k most frequent\"                                    → Map + bucket sort (or sort)      §2\n  \"sorted\", \"pair/triplet with sum X\"                  → two pointers                     §3\n  \"longest/shortest contiguous substring/subarray\"     → sliding window                   §4\n  \"all positions of an anagram/permutation\"            → FIXED window + counting          §4\n  \"next greater/smaller\", \"how many days until\"        → monotonic stack                  §5\n  \"parentheses\", \"expression\", \"undo\"                  → stack                            §5\n  \"O(log n)\", \"sorted but rotated\"                     → binary search                    §6\n  \"smallest speed/capacity that can\"                   → binary search on the answer      §6\n  \"intervals\", \"meetings\", \"overlapping\"               → sort by start + merge            §7\n  \"grid\", \"islands\", \"regions\"                         → DFS on the grid                  §8\n  \"fewest steps\", \"minutes until it spreads\"           → BFS (multi-source)               §8\n  \"prerequisites\", \"dependencies\", \"valid order\"       → graph + Kahn (topological)       §9\n  \"all combinations/subsets/permutations\"              → backtracking                     §10\n  \"k-th largest\", \"top k\", \"always the minimum\"        → heap (or sort)                   §11\n  \"number of ways\", \"min/max of...\", \"is it possible?\" → dynamic programming              §12\n  \"remove from the end\", \"in one pass\" (list)          → dummy + two pointers             §13\n  \"valid BST\", \"common ancestor\", \"by levels\"          → DFS with bounds / BFS            §14\n\n  What n allows (≈ 10^8 simple steps per second):\n    n ≤ 12         → O(n!)       permutations\n    n ≤ 20         → O(2^n)      subsets / backtracking\n    n ≤ 500        → O(n³)\n    n ≤ 10^4       → O(n²)       two for loops, 2D DP\n    n ≤ 10^6       → O(n log n)  sort, heap, binary search in a loop\n    n ≤ 10^8       → O(n)        one loop, Map, two pointers, window\n    bigger         → O(log n) or O(1)\n  e.g. \"nums.length \u003c= 10^5\" → they want O(n) or O(n log n); two for loops will time out.\n\n  Hidden O(n) costs in JS: shift, unshift, includes, indexOf, splice, slice, [...arr], join, str + str in a loop.\n  sort → O(n log n). Map/Set get/has/set/add/delete → O(1).\n*/"},{"n":"16","title":"7-DAY PLAN","kind":"code","body":"/*\n  How to practise:\n    - 25 min alone per problem. Stuck? Read only the \"Use it when\" line and the template. 10 more min.\n    - Still stuck → read the solution, close it, rewrite it from memory. That counts.\n    - Talk out loud while you write.\n    - After each problem: say the complexity and write 2 edge cases.\n    - \"Review\" = rewrite from scratch, without looking, a problem from an earlier day.\n\n  DAY 1 — Hash map (the most important one for strings/arrays)\n    49 Group Anagrams · 347 Top K Frequent · 128 Longest Consecutive Sequence\n    + easy warm-up: 1 Two Sum, 242 Valid Anagram\n  DAY 2 — Prefix sum + two pointers\n    560 Subarray Sum Equals K · 15 3Sum · 11 Container With Most Water\n    + review: 49\n  DAY 3 — Sliding window (strings!)\n    3 Longest Substring Without Repeating · 424 Longest Repeating Char Replacement · 438 Find All Anagrams\n    + review: 560, 15\n  DAY 4 — Stack + binary search + intervals\n    739 Daily Temperatures · 155 Min Stack · 33 Search in Rotated Sorted Array · 56 Merge Intervals\n    + review: 3\n  DAY 5 — Grid, graphs, lists and trees\n    200 Number of Islands · 207 Course Schedule · 19 Remove Nth From End · 102 Level Order\n    + review: 438, 56\n  DAY 6 — DP + backtracking + heap\n    198 House Robber · 322 Coin Change · 78 Subsets · 215 Kth Largest (with sort first, then heap)\n    + review: 347, 739\n  DAY 7 — Mock interview (without looking at this file)\n    Pick 2 you haven't done yet: 238 Product of Array Except Self, 5 Longest Palindromic Substring\n    (or 875 Koko, 57 Insert Interval, 994 Rotting Oranges, 98 Validate BST).\n    45 min each, out loud, with the §1 checklist. Then redo the ones you failed on days 1–6.\n    The night before: reread only §1 and §15. Sleep.\n\n  Only time for 10: 49, 347, 560, 15, 3, 438, 56, 739, 200, 322.\n*/\n\nconsole.log(\"✅ Medium OK\");"}]},{"id":"payments","label":"Payments","file":"04-Payments.md + .js","sections":[{"n":"1","title":"Money in code","kind":"md","body":"**Minor unit** — Used to store money as a whole number of cents, never as a `float`.\n- Example: €12.34 is stored as `1234`. `toMinor(\"12.34\", \"EUR\")` → `1234n`.\n- note: `0.1 + 0.2 !== 0.3`. One wrong cent × millions of accounts = an audit.\n- note: parse from a string, never from a float. Use `BigInt` / `int64`, or a decimal library (`decimal.js`, Go `shopspring/decimal`).\n\n**Currency exponent** — Used to know how many decimal places a currency has. It comes from ISO 4217.\n\n| Currency | Exponent | 1 unit = |\n|-------|----------|-------------|\n| JPY | 0 | 1 |\n| EUR / USD | 2 | 100 |\n| BHD / KWD | 3 | 1000 |\n\n- note: never assume 2 decimal places.\n\n**Amount + currency** — Used to keep the number and its currency together.\n- Example: `{ amount: 1234, currency: \"EUR\" }`.\n- note: a number without a currency is not money.\n\n**Banker's rounding (half-even)** — Used to round a tie to the even number.\n- Example: 2.5 → 2, 3.5 → 4. `divHalfEven(25n, 10n)` → `2n`.\n- note: half-up always pushes ties up, so the error builds up. Half-even removes that bias.\n- note: round once, at the end, with an explicit rule.\n\n**Basis points** — Used to write rates as whole numbers: 150 bp = 1.5%.\n- Example: €1234.56 × 150 bp = €18.5184 → `1852` cents.\n\n**Allocate** — Used to split an amount without losing a cent. The leftover goes to the largest remainder.\n- Example: €10.00 / 3 = 3.34 + 3.33 + 3.33. `allocate(1000n, [1n, 1n, 1n])` → `[334n, 333n, 333n]`.\n- In an interview: \"Money is an integer in the minor unit, plus the currency. I round once, half-even, and allocate the remainder so the total always adds up.\"\n\n→ `04-Payments.js` §1\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// float - // Used to show why money is never a float: 0.1 can't be stored exactly.\n\ncheck(0.1 + 0.2 === 0.3, false); // result ==> false\n\n//--------------------------------------------------------------------\n// EXPONENT - // Used to know how many decimal places a currency has (ISO 4217).\n\nconst EXPONENT = { JPY: 0, EUR: 2, USD: 2, BHD: 3 };\n\ncheck(EXPONENT.EUR, 2); // result ==> 2 (1 euro = 100 cents)\n// note: never assume 2. JPY has 0, BHD has 3.\n\n//--------------------------------------------------------------------\n// toMinor() - // Used to turn \"12.34\" EUR into 1234n cents, reading from a string so it never touches a float.\n\nfunction toMinor(str, currency) {\n  const exp = EXPONENT[currency];\n  if (exp === undefined) throw new Error(`unknown currency ${currency}`);\n  if (!/^-?\\d+(\\.\\d+)?$/.test(str)) throw new Error(`invalid amount ${str}`);\n  const [int, frac = \"\"] = str.replace(\"-\", \"\").split(\".\");\n  if (frac.length > exp) throw new Error(`${currency} only has ${exp} decimal places`);\n  const minor = BigInt(int + frac.padEnd(exp, \"0\"));\n  return str.startsWith(\"-\") ? -minor : minor;\n}\n\ncheck(toMinor(\"12.34\", \"EUR\"), 1234n); // result ==> 1234n\ncheck(toMinor(\"500\", \"JPY\"), 500n); // result ==> 500n\ncheck(toMinor(\"1.234\", \"BHD\"), 1234n); // result ==> 1234n\nassert.throws(() => toMinor(\"1.234\", \"EUR\")); // result ==> throws: EUR only has 2 decimal places\n\n//--------------------------------------------------------------------\n// fromMinor() - // Used to turn cents back into text for showing it.\n\nfunction fromMinor(minor, currency) {\n  const exp = EXPONENT[currency];\n  const neg = minor \u003c 0n;\n  const s = (neg ? -minor : minor).toString().padStart(exp + 1, \"0\");\n  const out = exp === 0 ? s : `${s.slice(0, -exp)}.${s.slice(-exp)}`;\n  return (neg ? \"-\" : \"\") + out;\n}\n\ncheck(fromMinor(5n, \"EUR\"), \"0.05\"); // result ==> \"0.05\"\ncheck(fromMinor(-1234n, \"BHD\"), \"-1.234\"); // result ==> \"-1.234\"\n\n//--------------------------------------------------------------------\n// divHalfEven() - // Used to divide and round a tie to the even number (banker's rounding).\n\nfunction divHalfEven(a, b) {\n  // a, b BigInt, b > 0\n  let q = a / b;\n  const r = a % b;\n  const twice = 2n * (r \u003c 0n ? -r : r);\n  if (twice > b || (twice === b && q % 2n !== 0n)) q += a \u003c 0n ? -1n : 1n;\n  return q;\n}\n\ncheck(divHalfEven(25n, 10n), 2n); // result ==> 2n (2.5 → 2, even)\ncheck(divHalfEven(35n, 10n), 4n); // result ==> 4n (3.5 → 4, even)\ncheck(divHalfEven(26n, 10n), 3n); // result ==> 3n\ncheck(divHalfEven(-25n, 10n), -2n); // result ==> -2n\n// note: half-up always rounds ties up; over millions of roundings that adds up. Half-even does not.\n\n//--------------------------------------------------------------------\n// basis points - // Used to write rates as whole numbers: 150 bp = 1.5%.\n\ncheck(divHalfEven(123456n * 150n, 10000n), 1852n); // result ==> 1852n (€1234.56 × 1.5% = €18.5184 → €18.52)\n\n//--------------------------------------------------------------------\n// allocate() - // Used to split an amount without losing a cent; the leftover goes to the largest remainder.\n\nfunction allocate(total, ratios) {\n  const sum = ratios.reduce((a, b) => a + b, 0n);\n  const parts = ratios.map((r) => (total * r) / sum);\n  const rems = ratios.map((r, i) => ({ i, rem: (total * r) % sum }));\n  let left = total - parts.reduce((a, b) => a + b, 0n);\n  rems.sort((x, y) => (y.rem > x.rem ? 1 : y.rem \u003c x.rem ? -1 : x.i - y.i));\n  for (let k = 0; left > 0n; k++, left--) parts[rems[k].i] += 1n;\n  return parts;\n}\n\nconst split = allocate(1000n, [1n, 1n, 1n]); // €10.00 split three ways\ncheck(split, [334n, 333n, 333n]); // result ==> [334n, 333n, 333n]\ncheck(split.reduce((a, b) => a + b, 0n), 1000n); // result ==> 1000n (not a cent lost)\ncheck(allocate(100n, [70n, 30n]), [70n, 30n]); // result ==> [70n, 30n]\n```"},{"n":"2","title":"Double-entry ledger","kind":"md","body":"**Ledger** — Used to record every money movement as a list of entries that never changes.\n- Example: entry (posting) = `{ txId, account, amount ±, phase }`.\n- note: append-only. A mistake is never fixed with an `UPDATE`.\n\n**Double entry** — Used to make sure money never appears or disappears: every movement takes from one account and gives to another.\n- Example: a transaction has ≥ 2 entries, and they sum to 0.\n- note: an unbalanced ledger is a proven bug.\n\n**Account** — Used to hold entries for one owner: a customer, a merchant, or a bank internal account (cash, interest, fees).\n\n**Balance** — Used to know how much an account has. It is the sum of the account's entries.\n- Example: `SUM(amount)` of the account's entries (may have a cached snapshot).\n- note: never store `balance` as a column you edit. It is **derived** from the entries.\n\n**Debit / credit** — Used to name the two sides of an entry.\n- note: in bank accounting, a customer deposit is a **liability** of the bank. Crediting the customer's account raises their balance.\n- note: don't memorise signs; memorise \"sums to zero\".\n\n**Pending vs settled** — Used to tell held money apart from money that really moved.\n- Example: `L.authorise(\"auth-1\", \"alice\", \"merchant\", 3000n)` holds €30 in the pending phase only.\n- note: held (authorisation) ≠ settled.\n\n**Available balance** — Used to know what the customer can still spend: settled − outgoing holds.\n- Example: €100 settled, €30 held → `L.available(\"alice\")` = `7000n`.\n- note: incoming pending entries do **not** add to it.\n\n**Reversal** — Used to fix a wrong transaction by adding the opposite one.\n- Example: `L.settle(\"set-1\", \"auth-1\", 2500n)` posts €25; `L.reverse(\"ref-1\", \"set-1\")` refunds it.\n- note: `L.assertInvariants()` checks the global sum per phase = 0.\n- In an interview: \"An append-only, double-entry ledger: every transaction sums to zero, the balance is derived, and corrections are reversals.\"\n\n→ `04-Payments.js` §2\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// Ledger - // Used to record money as entries that always sum to zero; the balance is the sum of an account's entries.\n// note: each entry is signed (+ into the account, − out of it). Entries are never edited or deleted.\n\nclass Ledger {\n  #entries = []; // append-only: never edited or deleted\n  #txIds = new Set();\n  #internal = new Set(); // the bank's internal accounts may go negative\n\n  openInternal(acc) { this.#internal.add(acc); }\n\n  #post(txId, phase, legs) {\n    if (this.#txIds.has(txId)) throw new Error(`duplicate tx ${txId}`);\n    if (legs.length \u003c 2) throw new Error(\"needs ≥ 2 legs\");\n    const sum = legs.reduce((s, l) => s + l.amount, 0n);\n    if (sum !== 0n) throw new Error(`tx ${txId} does not sum to zero (${sum})`);\n    this.#txIds.add(txId);\n    for (const l of legs) this.#entries.push(Object.freeze({ txId, phase, ...l }));\n  }\n\n  balance(acc, phase = \"committed\") {\n    return this.#entries\n      .filter((e) => e.account === acc && e.phase === phase)\n      .reduce((s, e) => s + e.amount, 0n);\n  }\n\n  // Available = settled − outgoing holds. Incoming pending entries do NOT count.\n  available(acc) {\n    const pending = this.balance(acc, \"pending\");\n    return this.balance(acc, \"committed\") + (pending \u003c 0n ? pending : 0n);\n  }\n\n  #checkFunds(acc, amount) {\n    if (!this.#internal.has(acc) && this.available(acc) \u003c amount)\n      throw new Error(`insufficient funds in ${acc}`);\n  }\n\n  transfer(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"committed\", [\n      { account: from, amount: -amount },\n      { account: to, amount },\n    ]);\n  }\n\n  // Authorisation = hold. Touches only the pending phase.\n  authorise(txId, from, to, amount) {\n    this.#checkFunds(from, amount);\n    this.#post(txId, \"pending\", [\n      { account: from, amount: -amount },\n      { account: to, amount },\n    ]);\n  }\n\n  // Settlement: releases the hold and posts the final amount (may be \u003c authorised).\n  settle(txId, authTxId, finalAmount) {\n    const auth = this.#entries.filter((e) => e.txId === authTxId);\n    const [from, to] = [auth.find((e) => e.amount \u003c 0n), auth.find((e) => e.amount > 0n)];\n    if (finalAmount > to.amount) throw new Error(\"settle above the authorised amount\");\n    this.#post(`${txId}:release`, \"pending\", auth.map((e) => ({ account: e.account, amount: -e.amount })));\n    this.#post(txId, \"committed\", [\n      { account: from.account, amount: -finalAmount },\n      { account: to.account, amount: finalAmount },\n    ]);\n  }\n\n  // Correct = a new, opposite transaction with a reference. Never edit the original.\n  reverse(txId, originalTxId) {\n    const orig = this.#entries.filter((e) => e.txId === originalTxId && e.phase === \"committed\");\n    if (orig.length === 0) throw new Error(\"nothing to reverse\");\n    this.#post(txId, \"committed\", orig.map((e) => ({ account: e.account, amount: -e.amount, reverses: originalTxId })));\n  }\n\n  // Global invariant: the sum of ALL entries, per phase, is zero.\n  assertInvariants() {\n    for (const phase of [\"pending\", \"committed\"]) {\n      const total = this.#entries.filter((e) => e.phase === phase).reduce((s, e) => s + e.amount, 0n);\n      assert.equal(total, 0n, `ledger unbalanced in phase ${phase}`);\n    }\n  }\n}\n\n//--------------------------------------------------------------------\n// transfer() - // Used to move money now: one account goes down, the other goes up by the same amount.\n\nconst L = new Ledger();\nL.openInternal(\"bank:cash\");\nL.transfer(\"dep-1\", \"bank:cash\", \"alice\", 10000n); // deposit €100.00\n\ncheck(L.balance(\"alice\"), 10000n); // result ==> 10000n\nassert.throws(() => L.transfer(\"dep-1\", \"bank:cash\", \"alice\", 1n), /duplicate/); // result ==> throws: same tx id twice\n\n//--------------------------------------------------------------------\n// authorise() - // Used to hold money for a card payment without moving it yet.\n\nL.authorise(\"auth-1\", \"alice\", \"merchant\", 3000n); // €30.00 purchase, hold only\n\ncheck(L.balance(\"alice\"), 10000n); // result ==> 10000n (settled is still €100)\ncheck(L.available(\"alice\"), 7000n); // result ==> 7000n (€70 can still be spent)\nassert.throws(() => L.authorise(\"auth-2\", \"alice\", \"merchant\", 8000n), /insufficient/); // result ==> throws: insufficient funds\n\n//--------------------------------------------------------------------\n// settle() - // Used to release the hold and really move the money; it can be less than the hold.\n\nL.settle(\"set-1\", \"auth-1\", 2500n); // partial capture €25.00\n\ncheck(L.balance(\"alice\"), 7500n); // result ==> 7500n\ncheck(L.balance(\"alice\", \"pending\"), 0n); // result ==> 0n (hold released)\ncheck(L.available(\"alice\"), 7500n); // result ==> 7500n\n\n//--------------------------------------------------------------------\n// reverse() - // Used to undo a transaction by adding the opposite one, never by editing it.\n\nL.reverse(\"ref-1\", \"set-1\"); // refund = reversal\n\ncheck(L.balance(\"alice\"), 10000n); // result ==> 10000n\nL.assertInvariants(); // result ==> every phase still sums to 0\n```"},{"n":"3","title":"Card payment lifecycle","kind":"md","body":"**Payment lifecycle** — Used to move a card payment through states; it is not a single call.\n- note: each state has different money rules (held vs moved vs returned).\n- note: the trap is capturing after the authorisation expired, or refunding what was never settled.\n\n```\nauthorise ──► capture ──► settle ──► refund / partial refund\n    │                        └─────► dispute ──► chargeback (won/lost)\n    └──► void / expire (hold released)\n```\n\n| Step | What it means |\n|-------|----------------|\n| Authorise | The issuer says yes and **holds** the amount. No money has moved yet |\n| Capture | The merchant claims the amount (full or partial; the rest is released) |\n| Settle / clearing | The money really moves: issuer → scheme → acquirer → merchant (days) |\n| Refund | A new operation in the opposite direction; can be partial |\n| Chargeback | The cardholder disputes with the issuer; the merchant loses the amount + a fee, unless they prove otherwise |\n\n**Authorisation expiry** — Used to know how long a hold lasts before it is released (Stripe, online).\n- Example: Visa 5 days for MIT (exactly 4 d 18 h), 7 for CIT; Mastercard 7.\n\n**Stripe PaymentIntent** — Used by Stripe to track one payment's state.\n- Example: `requires_payment_method → requires_confirmation → requires_action (3DS) → processing / requires_capture → succeeded | canceled`.\n\n**3DS / SCA (PSD2)** — Used in Europe to prove it is really the cardholder: 2 of 3 (something you know, have, are).\n- note: with 3DS, fraud liability shifts to the issuer.\n\n| Actor | Role |\n|-------|-------|\n| Cardholder | Owner of the card |\n| Merchant | Sells; receives the money |\n| Acquirer | The merchant's bank |\n| Issuer | The cardholder's bank; approves or declines |\n| Scheme | Visa / Mastercard: rules and network |\n| PSP | Stripe, Adyen, RocketGate: connects the merchant to the acquirer |\n\n**State machine** — Used to allow only the moves in a table and refuse the rest.\n- Example: `transition(p0, \"captured\", 8 * DAY)` throws: expired → captured.\n- In an interview: \"I model the payment as a state machine with allowed transitions. A late capture is an illegal transition, not a stray if.\"\n\n→ `04-Payments.js` §3 (state machine with an expiry guard)\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// transition() - // Used to move a payment to its next state, and refuse any move that is not allowed.\n\nconst TRANSITIONS = {\n  authorised: [\"captured\", \"voided\", \"expired\"],\n  captured: [\"settled\"],\n  settled: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  partially_refunded: [\"refunded\", \"partially_refunded\", \"disputed\"],\n  disputed: [\"chargeback_lost\", \"chargeback_won\"],\n};\n\nfunction transition(payment, to, now = Date.now()) {\n  // Late-authorisation guard: once expired, capture is refused.\n  const from = payment.status === \"authorised\" && now > payment.authExpiresAt ? \"expired\" : payment.status;\n  if (!(TRANSITIONS[from] ?? []).includes(to)) throw new Error(`illegal transition ${from} → ${to}`);\n  return { ...payment, status: to };\n}\n\nconst DAY = 86_400_000;\nconst p0 = { status: \"authorised\", authExpiresAt: 7 * DAY };\n\ncheck(transition(p0, \"captured\", 1 * DAY).status, \"captured\"); // result ==> \"captured\"\nassert.throws(() => transition(p0, \"captured\", 8 * DAY), /expired → captured/); // result ==> throws: the hold expired\nassert.throws(() => transition({ status: \"captured\" }, \"refunded\"), /illegal/); // result ==> throws: refund only after settle\n// note: a late capture is an illegal move in the table, not a stray if.\n```"},{"n":"4","title":"Idempotency","kind":"md","body":"**Idempotency** — Used to make sure the same request only has its effect once, even if it is sent twice.\n- note: networks fail and the client retries. Without it, you charge twice.\n\n**Idempotency key** — Used to tag a request so a retry can be recognised.\n- Example: the client generates a UUID v4. Stripe: `Idempotency-Key` header, up to 255 chars.\n\n**Request hash** — Used to catch the same key sent with a different body.\n- Example: same key + different body → error (Stripe compares the parameters). In the `.js`: 422.\n\n**Stored response** — Used to give a retry the **same** status + body, without running again.\n- note: Stripe v1 stores 500s too.\n\n**Unique lock** — Used to let the DB decide who wins when two requests arrive together.\n- Example:\n```sql\nINSERT INTO idempotency_keys (key, request_hash, state)\nVALUES ($1, $2, 'in_progress')\nON CONFLICT (key) DO NOTHING;      -- 0 rows = already exists → replay or 409\n```\n- note: check-then-insert is not enough; two requests can pass the check at the same time. Reserve **before** running.\n- note: the second request gets 409 \"in progress\"; the client retries later.\n\n**TTL** — Used to clean old keys. Stripe v1 may delete keys once they are ≥ 24 h old.\n\n**Atomic write** — Used to save the effect (ledger) and the response in the same DB transaction.\n\n**Natural idempotency** — Used when the data already has a unique id.\n- Example: `UNIQUE(provider_event_id)` on webhooks; `UNIQUE(order_id)` on charges.\n- In an interview: \"An idempotency key with a unique constraint, reserved before the effect, with a request hash and a stored response for replay.\"\n\n→ `04-Payments.js` §4 (two concurrent requests → 1 charge, 201 + 409; different body → 422)\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// IdempotencyStore - // Used to make sure the same request only charges once, even if it is sent twice.\n// note: the key is reserved BEFORE the charge runs. In a DB that is INSERT ... UNIQUE(key).\n\nclass IdempotencyStore {\n  #rows = new Map(); // in production: a table with UNIQUE(key)\n\n  async run(key, body, handler) {\n    const hash = crypto.createHash(\"sha256\").update(JSON.stringify(body)).digest(\"hex\");\n    const row = this.#rows.get(key);\n    if (row) {\n      if (row.hash !== hash) return { status: 422, body: \"same key, different request\" };\n      if (row.state === \"in_progress\") return { status: 409, body: \"request in progress, try again later\" };\n      return row.response; // replay: the SAME response, without running again\n    }\n    // Reserve the key BEFORE the first await: the equivalent of INSERT ... UNIQUE.\n    this.#rows.set(key, { hash, state: \"in_progress\" });\n    try {\n      const response = { status: 201, body: await handler() };\n      this.#rows.set(key, { hash, state: \"done\", response });\n      return response;\n    } catch (err) {\n      this.#rows.delete(key); // failed before any effect: free the key for a retry\n      throw err;\n    }\n  }\n}\n\nasync function idempotencyDemo() {\n  const store = new IdempotencyStore();\n  let charges = 0;\n  const charge = async () => { await new Promise((r) => setTimeout(r, 5)); return { chargeId: `ch_${++charges}` }; };\n  const body = { amount: 1000, currency: \"EUR\" };\n\n  // Two requests at the same time with the same key (double click / client retry).\n  const [a, b] = await Promise.all([store.run(\"k1\", body, charge), store.run(\"k1\", body, charge)]);\n  check([a.status, b.status].sort(), [201, 409]); // result ==> [201, 409]\n  check(charges, 1); // result ==> 1 (charged once)\n\n  // A retry after it finished gets the saved answer back.\n  const replay = await store.run(\"k1\", body, charge);\n  check(replay, a.status === 201 ? a : b); // result ==> the same 201 response\n  check(charges, 1); // result ==> 1\n\n  // Same key with a different body is refused.\n  check((await store.run(\"k1\", { amount: 9999, currency: \"EUR\" }, charge)).status, 422); // result ==> 422\n}\n```"},{"n":"5","title":"Retries","kind":"md","body":"**Retry** — Used to try again only when the error may go away on its own.\n- note: bad retries knock over the service that is recovering, and duplicate charges.\n\n| Retry | Don't retry |\n|---------|-------------|\n| Timeout, `ECONNRESET` | Validation 4xx |\n| 5xx, 429 (respect `Retry-After`) | Issuer decline (`card_declined`) |\n| — | Suspected fraud, stolen card |\n\n- Example: `isRetryable({ status: 402, code: \"card_declined\" })` → `false`.\n\n**Backoff + jitter** — Used to wait longer on each try, at a random time, so clients don't all retry at once.\n- Example: `wait = random(0, min(cap, base·2^n))`. `backoff(3, () => 0.5)` → 400 ms.\n\n**Retry budget** — Used to cap retries: a token bucket per client; no tokens, no retry.\n- note: AWS: 3 attempts × 5 layers = **243×** load on the DB.\n\n**One layer** — Used to keep retries in a single place. Nested retries multiply.\n\n**Unknown outcome** — Used for a timeout where you don't know if the charge happened.\n- Example: timeout after charging → `psp.find(key)` before the retry → 1 charge.\n- note: timeout ≠ failure. The PSP may have charged and the response got lost.\n- note: check the status at the PSP with the **same** key. If you can't, mark it `unknown` and let reconciliation decide.\n- In an interview: \"I only retry transient errors, with backoff and jitter, in one layer, within a budget. A timeout is an unknown outcome: I check before retrying.\"\n\n→ `04-Payments.js` §5\n\n### Code (04-Payments.js)\n\n```js\n//--------------------------------------------------------------------\n// isRetryable() - // Used to decide if an error may go away on its own, so trying again makes sense.\n\nfunction isRetryable(err) {\n  if (err.code === \"ETIMEDOUT\" || err.code === \"ECONNRESET\") return true;\n  if (err.status === 429 || (err.status >= 500 && err.status \u003c= 599)) return true;\n  return false; // 4xx, issuer decline (card_declined), fraud → never retry\n}\n\ncheck(isRetryable({ status: 503 }), true); // result ==> true\ncheck(isRetryable({ status: 402, code: \"card_declined\" }), false); // result ==> false\ncheck(isRetryable({ status: 400 }), false); // result ==> false\n\n//--------------------------------------------------------------------\n// backoff() - // Used to wait a random time that grows on each try, so clients don't all retry at once (\"full jitter\").\n\nconst backoff = (attempt, rand, base = 100, cap = 5000) => Math.floor(rand() * Math.min(cap, base * 2 ** attempt));\n\ncheck(backoff(0, () => 0.999), 99); // result ==> 99\ncheck(backoff(3, () => 0.5), 400); // result ==> 400\ncheck(backoff(20, () => 0.999), 4995); // result ==> 4995 (never above the cap)\n// note: the wait is random(0, min(cap, base·2^n)).\n\n//--------------------------------------------------------------------\n// withRetry() - // Used to try again only on retryable errors, waiting with backoff, up to a limit.\n\nasync function withRetry(fn, { maxAttempts = 4, sleep = async () => {}, rand = Math.random } = {}) {\n  for (let attempt = 0; ; attempt++) {\n    try {\n      return await fn(attempt);\n    } catch (err) {\n      if (!isRetryable(err) || attempt + 1 >= maxAttempts) throw err;\n      await sleep(backoff(attempt, rand));\n    }\n  }\n}\n\n//--------------------------------------------------------------------\n// nested retries - // Used to show why you retry in one layer only: 3 tries in 5 layers hit the DB 3^5 times.\n\ncheck(3 ** 5, 243); // result ==> 243\n\nasync function retryDemo() {\n  let calls = 0;\n  const flaky = async () => { calls++; if (calls \u003c 3) throw { status: 503 }; return \"ok\"; };\n  check(await withRetry(flaky), \"ok\"); // result ==> \"ok\"\n  check(calls, 3); // result ==> 3 (failed twice, then worked)\n\n  let declines = 0;\n  await assert.rejects(withRetry(async () => { declines++; throw { status: 402, code: \"card_declined\" }; }));\n  check(declines, 1); // result ==> 1 (a decline is not retried)\n\n  //--------------------------------------------------------------------\n  // unknown outcome - // Used to handle a timeout where the PSP did charge but the answer got lost.\n\n  const psp = { charges: new Map(), dropNext: true };\n  psp.charge = async (key, amount) => {\n    if (!psp.charges.has(key)) psp.charges.set(key, { id: `ch_${psp.charges.size + 1}`, amount });\n    if (psp.dropNext) { psp.dropNext = false; throw { code: \"ETIMEDOUT\" }; }\n    return psp.charges.get(key);\n  };\n  psp.find = async (key) => psp.charges.get(key) ?? null;\n\n  // Before retrying, ask \"did this already happen?\" and reuse the SAME key.\n  const key = \"order-42\";\n  const result = await withRetry(async (attempt) => (attempt > 0 && (await psp.find(key))) || psp.charge(key, 1000));\n  check(result.id, \"ch_1\"); // result ==> \"ch_1\"\n  check(psp.charges.size, 1); // result ==> 1 (charged once)\n  // note: a timeout is not a failure. It means \"don't know yet\".\n}\n```"},{"n":"6","title":"Concurrency","kind":"md","body":"**Race on a balance** — Used to name the bug where two requests change the same balance at the same time.\n- Example: two €30 withdrawals from €50 both go through (double-spend).\n- note: the trap is read → check in code → write. Between the read and the write, the world changed.\n\n**Conditional update** — Used for the simple case: atomic on one row.\n- Example: `UPDATE ... SET balance = balance - $x WHERE balance >= $x`.\n\n**Optimistic lock (`version`)** — Used when conflicts are rare: write only if the version is still the one you read.\n- Example:\n```sql\nUPDATE accounts SET balance = $new, version = version + 1\nWHERE id = $id AND version = $read_version;   -- 0 rows → conflict, re-read\n```\n\n**`SELECT ... FOR UPDATE`** — Used when many requests hit one account: lock the row first.\n- Example:\n```sql\nBEGIN;\nSELECT balance FROM accounts WHERE id = $id FOR UPDATE;\n-- validate and insert the ledger entries\nCOMMIT;\n```\n- note: lock in id order to avoid deadlock.\n\n**`SERIALIZABLE`** — Used when the rule spans several rows. Be ready to retry on serialization errors.\n\n**Unique constraint** — Used when \"only one can win\": idempotency, one refund per payment.\n\n**One writer per account** — Used to remove the race instead of managing it (queue/partition by `account_id`).\n- note: **[inferred]** It is a common pattern in high-volume ledgers.\n\n**Go mutex** — `sync.Mutex` protects one process's memory, not a DB shared by several replicas.\n- In an interview: \"The DB is the referee: a conditional update, a version, or FOR UPDATE. I never check the balance in code between a read and a write.\"\n\n→ `04-Payments.js` §6 (lost update reproduced and fixed with `version`)\n\n### Code (04-Payments.js)\n\n```js\nconst tick = () => new Promise((r) => setImmediate(r));\n\nasync function lostUpdateDemo() {\n  //--------------------------------------------------------------------\n  // lost update - // Used to show the bug: read, wait, write. Two €30 withdrawals from €50 both pass.\n\n  const acc = { balance: 5000n };\n  const naiveWithdraw = async (amt) => {\n    const read = acc.balance;\n    await tick(); // the other \"request\" runs here\n    if (read \u003c amt) throw new Error(\"no funds\");\n    acc.balance = read - amt;\n  };\n  await Promise.all([naiveWithdraw(3000n), naiveWithdraw(3000n)]);\n  check(acc.balance, 2000n); // result ==> 2000n — BUG: €60 went out, only €30 was debited\n\n  //--------------------------------------------------------------------\n  // optimistic lock - // Used to write only if nobody changed the row since I read it (UPDATE ... WHERE version = $read).\n\n  const row = { balance: 5000n, version: 0 };\n  const compareAndSet = (expectedVersion, balance) => {\n    if (row.version !== expectedVersion) return false; // 0 rows updated\n    Object.assign(row, { balance, version: row.version + 1 });\n    return true;\n  };\n  const safeWithdraw = async (amt) => {\n    for (;;) {\n      const { balance, version } = { ...row };\n      await tick();\n      if (balance \u003c amt) return \"declined\";\n      if (compareAndSet(version, balance - amt)) return \"ok\";\n    }\n  };\n  const results = await Promise.all([safeWithdraw(3000n), safeWithdraw(3000n)]);\n  check(results.sort(), [\"declined\", \"ok\"]); // result ==> [\"declined\", \"ok\"]\n  check(row.balance, 2000n); // result ==> 2000n (50 − 30; the second was declined)\n  check(row.version, 1); // result ==> 1\n  // note: if the version changed, re-read and try again.\n}\n\n(async () => {\n  await idempotencyDemo();\n  await retryDemo();\n  await lostUpdateDemo();\n  console.log(\"✅ Payments OK\");\n})().catch((err) => {\n  console.error(\"❌\", err);\n  process.exit(1);\n});\n```"},{"n":"7","title":"Consistency across systems","kind":"md","body":"**Consistency** — Used to keep the ledger, PSP, queue and emails in agreement without a distributed transaction.\n- note: \"I wrote to the DB but the event never went out\" (or the reverse) is the classic bug.\n- note: the trap is `db.commit(); kafka.publish()` — if the process dies in between, the event is lost.\n\n**Outbox** — Used to send an event safely: write it to an `outbox` table in the **same** transaction; a relay publishes it later.\n\n**At-least-once** — Used to describe delivery where an event may arrive 2×. So the consumer must be idempotent.\n\n**Idempotent consumer** — Used to process each event once: `UNIQUE(event_id)` in a `processed_events` table, inside the effect's transaction.\n\n**Kafka ordering** — Used to keep one account's events in order.\n- Example: key = `account_id`. Ordering only holds within a partition.\n\n**Saga** — Used to undo a multi-step flow with **compensations** (refund, release the hold), not a rollback.\n\n**Webhooks** — Used by a PSP to tell you something happened.\n- Example: verify the HMAC signature; dedupe by id; reply 2xx fast and process from a queue.\n- note: they can arrive out of order — `refunded` before `succeeded`. Use the state machine (§3) and ignore backward moves, or re-read the object from the API.\n\n**Exactly-once** — In practice = at-least-once + idempotency.\n- In an interview: \"Outbox to publish, idempotent consumers to receive, sagas with compensations across services. Exactly-once is at-least-once plus dedupe.\""},{"n":"8","title":"Reconciliation & settlement","kind":"md","body":"**Reconciliation** — Used to compare your ledger with the PSP's reports and the bank statement.\n- note: it is the safety net. It catches what idempotency and retries missed.\n- note: never reconcile on the day's total. Go line by line, by reference.\n\n| Step | What to do |\n|-------|---------|\n| Match | By external id (charge id, end-to-end id), then amount + currency + date |\n| Differences | Missing at the PSP, missing on our side, different amount, duplicate |\n| Fees | Settlement arrives **net** of fees: post the fee to the ledger |\n| Timing | T+1 / T+2: the money arrives days after capture |\n| Exceptions | A queue for humans; never \"adjust\" a balance by hand without a posting |\n\n**FX record** — Used to make a converted amount reproducible: store the rate, its source, the timestamp and the amount in both currencies.\n- note: never recalculate later.\n\n**Rate fallback** — Used when the rate source fails: a secondary source with a maximum age; if both fail, refuse rather than make one up.\n\n**FX rounding** — Convert into the minor unit with half-even (§1) and record the result.\n- In an interview: \"Daily reconciliation, line by line, by external reference. For FX I store the rate, the source and the time — the amount must be reproducible.\""},{"n":"9","title":"Rails and a short glossary","kind":"md","body":"| Term | One line |\n|-------|-----------|\n| SEPA SCT | Euro bank transfer; settles the next business day |\n| SEPA SCT Inst | Instant, 24/7, ≤ 10 s; IPR (EU) 2024/886 has required it of euro-area PSPs since 9 Oct 2025 |\n| SEPA SDD | Direct debit; needs a mandate; the debtor can dispute it |\n| SWIFT | Messaging network between banks (international); does not move money by itself |\n| ISO 20022 | XML message standard. `pain` customer↔bank, `pacs` bank↔bank, `camt` statements |\n| Examples | `pain.001` order, `pacs.008` transfer, `pacs.002` status, `camt.053` statement |\n| Card schemes | Visa, Mastercard, Amex: rules, network, interchange fees |\n| IBAN / BIC | Account id / bank id |\n| KYC / AML | Know your customer / anti-money laundering (screening, monitoring) |\n| PCI DSS | Rules for card data. **Never** store the full PAN or the CVV |\n| Tokenisation | The PSP stores the card; you store a token (`pm_...`) |\n\n- **[inferred]** The ISO 20022 examples above are from memory; the official page (iso20022.org) returned 403.\n- In an interview: \"Cards are authorisation plus deferred settlement; SEPA Inst is push and final within seconds. I don't store the PAN or CVV — I tokenise at the PSP.\""},{"n":"10","title":"Thought Machine / Vault in 10 lines","kind":"md","body":"1. **Vault Core** is the core banking platform: ledger + products. **Vault Payments** is a separate product (payment processing).\n2. **Real-time ledger**, a \"single source of truth\", holding funds in any **asset and denomination** (currencies, crypto, points).\n3. **No batch** says the 2023 brochure; the 2025 whitepaper already measures low-priority \"offline\" postings.\n4. **Products = smart contracts** in Python (a sandboxed subset), in the \"Universal Product Engine\". The bank changes them without touching the platform code.\n5. **Contracts are versioned and immutable**; each account stays on the version it was opened with. **Supervisor contracts** run several contracts together.\n6. A synchronous **Postings API** (target \u003c 100 ms) moves funds; contracts also create postings (e.g. daily interest).\n7. **Stack:** microservices, Kubernetes, Istio, **Kafka**; real-time data streaming; cloud-agnostic.\n8. **Measured scale:** 4,769 TPS online (p95 \u003c 500 ms), 15,035 TPS balance enquiries, 30 M accounts.\n9. **[inferred — docs behind a login]** Postings are grouped into a *Posting Instruction Batch*; types such as authorisation, settlement, release, transfer, hard settlement, custom.\n10. **[inferred — docs behind a login]** Balance indexed by account + address + asset + denomination + phase (`committed`, `pending_in`, `pending_out`). My mini-ledger (§2) mimics this.\n\n- In an interview: \"Vault is a real-time ledger where the product is versioned code. My part would be making sure every posting is atomic, idempotent and balanced.\""},{"n":"11","title":"Bridge to your experience","kind":"md","body":"> ⚠️ The \"Model line\" column is an example of how to name the concept. Check in the code what you actually did before you say it.\n\n| What you did | Concept | Model line |\n|---------------|------------------------|-------|\n| Rebill failure notifications (RocketGate, Paynova) | Decline vs temporary error; webhooks; recurring MIT | \"Only a technical failure is retried, never an issuer decline.\" |\n| Top Up pricing and discounts | Cents; rounding; allocation | \"Discounts as integers, rounded once, with an explicit rule.\" |\n| FX rate fallback | Rate source; max age; reproducible | \"I store the rate and its source, so the amount can be audited.\" |\n| Cancellation + refund (Duffel) | Refund as a saga compensation | \"The refund is a compensation step, not a rollback.\" |\n| Late authorisation guard | Auth lifecycle; state machine | \"Capturing after expiry is an illegal transition.\" |\n| Nested retries | Retry storm; budget; one layer | \"Nested retries multiply load; I moved them into one layer.\" |\n| \"Charged N, delivered N\" hotfix | Idempotency + atomic charge and delivery | \"One key ties charge and delivery; a retry duplicates neither.\" |\n\n- Rule: tell the real story in your own words; use the \"Concept\" column to name the pattern.\n- Go vs TypeScript: same concepts. Say \"in Go I'd do the same with `database/sql` and a transaction\"."},{"n":"12","title":"Likely questions + short answer","kind":"md","body":"| Question | Short answer |\n|----------|----------------|\n| How do you avoid charging twice? | Idempotency key with `UNIQUE`, reserved before the charge, passed to the PSP, response saved for replay. |\n| The PSP timed out. Do you retry? | Not blindly. I look it up by id/key; if unclear, mark it `unknown` and let reconciliation decide. |\n| Two withdrawals at the same time? | Conditional update or `version`; under heavy load, `FOR UPDATE` or one writer per account. |\n| How do you store money? | Integer in the minor unit + currency; ISO 4217 exponent; half-even; allocate the remainder. |\n| How do you fix a wrong transaction? | A reversal: a new, opposite transaction with a reference. The ledger is append-only. |\n| How do you make sure an event goes out after a write? | Outbox in the same transaction + a relay; idempotent consumers. |\n| How do you keep per-account order in Kafka? | Partition key = `account_id`; the consumer reads the partition in order. |\n| Which errors do you retry? | Timeouts, 5xx, 429 — with backoff, jitter and a budget. Never declines or 4xx. |\n| A webhook arrived twice / out of order? | Verify the signature, dedupe by event id; the state machine ignores backward moves. |\n| Available balance vs balance? | Available = settled − outgoing holds. Incoming pending doesn't count. |"},{"n":"","title":"Sources","kind":"md","body":"- Stripe — Idempotent requests: https://docs.stripe.com/api/idempotent_requests\n- Stripe — PaymentIntent lifecycle: https://docs.stripe.com/payments/paymentintents/lifecycle\n- Stripe — Place a hold (auth/capture, validity): https://docs.stripe.com/payments/place-a-hold-on-a-payment-method\n- AWS Builders' Library — Timeouts, retries and backoff with jitter: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter\n- Thought Machine — Vault Core (current accounts): https://www.thoughtmachine.net/vault-core/current-and-transaction-accounts\n- Thought Machine — Vault Pre-NDA brochure 2023 (PDF): https://info.thoughtmachine.net/hubfs/Vault_Pre_NDA_RGB_2023.pdf\n- Thought Machine — Performance whitepaper: https://www.thoughtmachine.net/whitepapers/performance-proven-the-right-way\n- Thoughtworks Radar — Thought Machine Vault: https://www.thoughtworks.com/radar/platforms/thought-machine-vault\n- FF News — \"We built this bank on smart contracts\": https://ffnews.com/thought-leadership/we-built-this-bank-on-smart-contracts\n- SEPA Inst 2025 (secondary; EPC returned 403): https://www.aciworldwide.com/blog/sepa-instant-payments-whats-new-in-rulebook-2025-and-why-it-matters\n- **Not accessible:** official Vault docs (`docs.thoughtmachine.net` → login). Items 9–10 of §10 are **[inferred]**."}]}];
const BUILT = "2026-11-13";
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const done = new Set(store.get("done") || []);
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderBody(sec) {
  if (sec.kind === "md") {
    const html = window.marked ? marked.parse(sec.body) : `<pre>${esc(sec.body)}</pre>`;
    return `<div class="md">${html.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, "</table></div>")}</div>`;
  }
  // each "//-----" separator starts a new case → its own block
  return `<div class="cases">${sec.body
    .split(/^\s*\/\/-{20,}\s*$/m)
    .map((c) => c.trim())
    .filter(Boolean)
    .map((c) => `<pre><code>${window.hljs ? hljs.highlight(c, { language: "javascript" }).value : esc(c)}</code></pre>`)
    .join("")}</div>`;
}

function card(tab, sec, i, showFrom) {
  const key = `${tab.id}:${sec.n || "x" + i}:${sec.title}`;
  const d = document.createElement("details");
  d.className = "sec" + (done.has(key) ? " is-done" : "");
  d.innerHTML = `<summary>
      <span class="num">${sec.n ? "§" + sec.n : "★"}</span>
      <span class="title">${showFrom ? `<span class="from">${tab.label}</span><br>` : ""}${esc(sec.title)}</span>
      <label class="done-box"><input type="checkbox" ${done.has(key) ? "checked" : ""} aria-label="Mark as studied"> ok</label>
    </summary><div class="body"></div>`;
  const box = d.querySelector("input");
  box.addEventListener("click", (e) => e.stopPropagation());
  box.addEventListener("change", () => {
    box.checked ? done.add(key) : done.delete(key);
    d.classList.toggle("is-done", box.checked);
    store.set("done", [...done]);
    updateProgress();
  });
  // render the content only when opened (keeps the page light on phones)
  d.addEventListener("toggle", () => {
    const body = d.querySelector(".body");
    if (d.open && !body.innerHTML) body.innerHTML = renderBody(sec);
  });
  return d;
}

function currentTab() { return TABS.find((t) => "#" + t.id === location.hash) || TABS[0]; }

function updateProgress() {
  const t = currentTab();
  const total = t.sections.length;
  const n = t.sections.filter((s, i) => done.has(`${t.id}:${s.n || "x" + i}:${s.title}`)).length;
  $("progress").textContent = `${n}/${total} studied`;
}

function render() {
  const q = norm($("q").value.trim());
  const list = $("list");
  list.innerHTML = "";
  const t = currentTab();
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.hash === "#" + t.id && !q ? "page" : "false"));
  if (q) {
    let hits = 0;
    for (const tab of TABS) tab.sections.forEach((s, i) => {
      if (norm(s.title + "\n" + s.body).includes(q)) { list.append(card(tab, s, i, true)); hits++; }
    });
    list.prepend(Object.assign(document.createElement("p"), { className: "hint", textContent: hits ? `${hits} sections mention "${$("q").value.trim()}". Open one to read it.` : "No match. Try another word (e.g. sort, Map, pointers)." }));
  } else {
    list.append(Object.assign(document.createElement("p"), { className: "hint", textContent: `${t.file} · tap a section to open it · tick “ok” once you know it` }));
    t.sections.forEach((s, i) => list.append(card(t, s, i, false)));
    if (t.id === "start") list.querySelector("details").open = true;
  }
  const foot = document.createElement("footer");
  foot.textContent = `Generated on ${BUILT} from the cheatSheet repo. Progress is saved in this browser only.`;
  list.append(foot);
  $("toggle").textContent = "Open all";
  updateProgress();
}

$("tabs").innerHTML = TABS.map((t) => `<a href="#${t.id}">${t.label}</a>`).join("");
$("tabs").addEventListener("click", () => { $("q").value = ""; });
$("q").addEventListener("input", render);
$("toggle").addEventListener("click", () => {
  const all = [...document.querySelectorAll("details.sec")];
  const open = all.some((d) => !d.open);
  all.forEach((d) => (d.open = open));
  $("toggle").textContent = open ? "Close all" : "Open all";
});
window.addEventListener("hashchange", () => { scrollTo(0, 0); render(); });
render();
</script>
