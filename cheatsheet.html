e":"FUNCTIONS","kind":"code","body":"//--------------------------------------------------------------------\n// três formas de criar uma function - // serve para escolher a forma certa e saber ler as três em código alheio.\n{\n  declared(2); // funciona: a declaration sobe para o topo do bloco (hoisting)\n  function declared(a) {\n    return a * 2;\n  }\n  const expression = function (a) {\n    return a * 2;\n  };\n  const arrow = (a) => a * 2; //                     1 linha sem { } → devolve sozinha\n  const arrowBlock = (a) => { return a * 2; }; //    com { } → precisa de return\n  const arrowObject = () => ({ ok: true }); //       para devolver um object, envolver em ( )\n  const iife = (() => 42)(); //                      IIFE: criada e chamada logo\n  declared(2); // result ==> 4\n  expression(2) + arrow(2) + arrowBlock(2); // result ==> 12\n  arrowObject(); // result ==> { ok: true }\n  iife; // result ==> 42\n  const f = (a) => { a + 1; };\n  f(1); // result ==> undefined  (com { } é um bloco e falta o return)\n}\n// nota: só a declaration (function name) se pode chamar antes da linha onde está. As outras duas dão erro (TDZ).\n// nota2: () => { ok: true } devolve undefined, as { } são lidas como bloco. Uma arrow function não tem this próprio (§18).\n\n//--------------------------------------------------------------------\n// return - // serve para entregar a quem chamou o value da function; só esse value sai.\n{\n  function total(price, qty, shipping) {\n    const subtotal = price * qty; // calculado, invisível lá fora\n    if (qty === 0) return 0; //      termina aqui se não há nada\n    return subtotal + shipping; //   devolvido a quem chamou\n  }\n  const noReturn = (a) => { a * 2; }; // calcula, mas não devolve\n  function two() { return 1; return 2; }\n  total(10, 2, 5); // result ==> 25\n  total(10, 0, 5); // result ==> 0  (o último return nem corre)\n  noReturn(5); // result ==> undefined\n  two(); // result ==> 1  (o primeiro return termina a function)\n}\n// nota: console.log mostra no ecrã; return entrega o value ao código.\n\n//--------------------------------------------------------------------\n// default parameters - // serve para cumprimentar \"anonymous\" quando não vem nome.\n{\n  const hi = (name = \"anonymous\") => `hi ${name}`;\n  hi(); // result ==> \"hi anonymous\"\n  hi(undefined); // result ==> \"hi anonymous\"\n  hi(null); // result ==> \"hi null\"  (null não ativa o default value)\n  hi(\"\"); // result ==> \"hi \"  (a string vazia também não)\n}\n// nota: o default value só entra para undefined. name ?? \"x\" troca também o null.\n\n//--------------------------------------------------------------------\n// object passado a uma function - // serve para saber se uma function pode alterar os dados de quem a chama.\n{\n  const mutate = (o) => { o.x = 1; };\n  const reassign = (o) => { o = { x: 99 }; };\n  const target = {};\n  mutate(target); //   altera o object partilhado\n  reassign(target); // o passa a apontar para outro object; target não muda\n  target; // result ==> { x: 1 }\n  const g = (n) => { n = n + 1; };\n  let a = 5;\n  g(a);\n  a; // result ==> 5  (n é outra variable)\n}\n// nota: a function recebe a mesma reference: mudar uma property vê-se fora, trocar o parameter não.\n\n//--------------------------------------------------------------------\n// callback e higher-order function - // serve para passar \"o que fazer\" a outra function, como em map, filter e setTimeout.\n{\n  const apply = (value, callback) => callback(value);\n  const multiplier = (factor) => (n) => n * factor;\n  const triple = multiplier(3);\n  apply(5, (v) => v + 1); // result ==> 6  (callback(5) → 5 + 1)\n  triple(4); // result ==> 12\n  multiplier(2)(5); // result ==> 10  (multiplier(2) devolve uma function, já chamada com 5)\n}\n// nota: callback = function passada como argument. Higher-order = function que recebe ou devolve functions.\n// nota2: apply(5, f) passa a function; apply(5, f()) chama-a já e passa o resultado.\n\n//--------------------------------------------------------------------\n// recursion - // serve para problemas que se repetem em tamanho menor, como o fatorial.\n{\n  const factorial = (n) => (n \u003c= 1 ? 1 : n * factorial(n - 1));\n  factorial(3); // result ==> 6  (3 * 2 * 1; as contas fazem-se na subida)\n  factorial(5); // result ==> 120\n  factorial(0); // result ==> 1  (0 \u003c= 1 é o base case)\n}\n// nota: sem base case a stack esgota (RangeError)."},{"n":"17","title":"CLOSURES","kind":"code","body":"//--------------------------------------------------------------------\n// closure - // serve para ter um counter privado que só as suas functions podem mexer.\n{\n  function createCounter() {\n    let count = 0;\n    return { inc: () => ++count, get: () => count };\n  }\n  const counterA = createCounter();\n  const counterB = createCounter();\n  counterA.inc();\n  counterA.inc();\n  counterB.inc();\n  counterA.get(); // result ==> 2\n  counterB.get(); // result ==> 1\n  counterB.inc();\n  counterA.get(); // result ==> 2  (o count de B é outra variable)\n}\n// nota: cada call a createCounter() cria um count novo, vivo enquanto as functions devolvidas existirem.\n// nota2: a closure guarda a variable, não uma cópia; por isso get() vê sempre o value atual.\n\n//--------------------------------------------------------------------\n// memoization - // serve para tornar rápida uma function lenta e chamada muitas vezes com os mesmos values, como o fibonacci.\n{\n  function memo(fn) {\n    const cache = new Map();\n    return (n) => {\n      if (!cache.has(n)) cache.set(n, fn(n)); // calcula só da 1.ª vez\n      return cache.get(n); //                     devolve o guardado\n    };\n  }\n  const fib = memo((n) => (n \u003c 2 ? n : fib(n - 1) + fib(n - 2)));\n  fib(2); // result ==> 1\n  fib(50); // result ==> 12586269025  (instantâneo; sem memo seriam milhares de milhões de calls)\n}\n// nota: a cache vive na closure. Ordem: perguntar à cache, calcular se falta, guardar, devolver.\n// nota2: só funciona se a function der sempre o mesmo resultado para o mesmo n.\n\n//--------------------------------------------------------------------\n// var vs let num loop - // serve para perceber porque functions criadas num loop com var veem todas o último value.\n{\n  const fnsVar = [];\n  for (var iv = 0; iv \u003c 3; iv++) fnsVar.push(() => iv); // var: UMA variable para o loop todo\n  const fnsLet = [];\n  for (let il = 0; il \u003c 3; il++) fnsLet.push(() => il); // let: uma variable nova por iteration\n  fnsVar.map((fn) => fn()); // result ==> [3, 3, 3]\n  fnsLet.map((fn) => fn()); // result ==> [0, 1, 2]\n}\n// nota: as functions só leem iv quando são chamadas, e nessa altura o loop já acabou (iv = 3).\n// nota2: em loops, usa let."},{"n":"18","title":"THIS, CALL/APPLY/BIND","kind":"code","body":"//--------------------------------------------------------------------\n// this - // serve para um method ler os dados do próprio object.\n{\n  const account = {\n    owner: \"Tiago\",\n    normal() { return this?.owner; },\n    withArrow() { return [1].map(() => this.owner)[0]; }, // a arrow function usa o this do method\n  };\n  const loose = account.normal; // tirada do object\n  account.normal(); // result ==> \"Tiago\"  (this = o que está antes do ponto)\n  loose(); // result ==> undefined  (sem nada antes do ponto, this é undefined)\n  account.withArrow(); // result ==> \"Tiago\"\n}\n// nota: um method escrito como arrow function { f: () => this.owner } não vê o object: a arrow apanha o this de fora.\n// nota2: setTimeout(account.normal, 0) também passa a function solta. Sem o ?. em this?.owner, loose() daria TypeError.\n\n//--------------------------------------------------------------------\n// call / apply / bind - // serve para usar um method com outro object, ou fixar o this antes de passar a function.\n{\n  function normal() { return this.owner; }\n  const bound = normal.bind({ owner: \"Bia\" }); // bind não chama: devolve uma function nova com this fixo\n  normal.call({ owner: \"Ana\" }); // result ==> \"Ana\"  (chama já, arguments um a um)\n  normal.apply({ owner: \"Rui\" }, []); // result ==> \"Rui\"  (chama já, arguments num array)\n  bound(); // result ==> \"Bia\"\n  bound.call({ owner: \"Zé\" }); // result ==> \"Bia\"  (o this de um bind já não muda)\n}\n// nota: call e apply fazem o mesmo; só muda como se passam os arguments (A de apply = Array)."},{"n":"19","title":"CLASSES E PROTOTYPES","kind":"code","body":"//--------------------------------------------------------------------\n// class + constructor - // serve para criar muitas pessoas com as mesmas properties e methods, sem repetir código.\n\nclass Person {\n  static species = \"human\"; // pertence à class, não a cada pessoa\n  #secret; //                  private: só a class vê\n  kind = \"person\"; //          public field\n\n  constructor(name = \"Adelia\", age = 34) { // corre no new\n    this.name = name;\n    this.age = age;\n    this.#secret = \"1234\";\n  }\n  birthYear(currentYear) { // method\n    return currentYear - this.age;\n  }\n  get intro() { return `${this.name}, ${this.age}`; }\n  set safeAge(v) {\n    if (v \u003c 0) throw new RangeError(\"negative age\");\n    this.age = v;\n  }\n  checkSecret(attempt) { return attempt === this.#secret; }\n  static baby(name) { return new Person(name, 0); }\n}\nconst personTiago = new Person(\"Tiago\", 33);\n// new faz: 1) cria object vazio  2) corre o constructor com this = esse object  3) devolve-o\npersonTiago.name; // result ==> \"Tiago\"\nnew Person().name; // result ==> \"Adelia\"  (default value)\nnew Person(\"Ana\").age; // result ==> 34  (a age não foi passada, entra a default)\npersonTiago.birthYear(2020); // result ==> 1987\n// nota: sem o new, Person(\"Tiago\") dá TypeError numa class.\n\n//--------------------------------------------------------------------\n// get / set / #private / static - // serve para properties calculadas, validar ao atribuir, esconder dados e ter coisas que são da class.\n\npersonTiago.intro; // result ==> \"Tiago, 33\"  (get usa-se sem parênteses, como uma property)\nassert.throws(() => { personTiago.safeAge = -1; }, RangeError);\npersonTiago.checkSecret(\"1234\"); // result ==> true\npersonTiago.secret; // result ==> undefined  (o #secret está escondido)\nPerson.species; // result ==> \"human\"  (static usa-se pela class)\nPerson.baby(\"Bia\").age; // result ==> 0\npersonTiago.species; // result ==> undefined  (pelo object não se vê)\n// nota: personTiago.intro() dá TypeError, porque um get é lido como property, não chamado.\n\n//--------------------------------------------------------------------\n// extends + super - // serve para um Athlete ser uma Person com a height a mais, sem copiar a class.\n\nclass Athlete extends Person {\n  constructor(name, age, height) {\n    super(name, age); // corre o constructor de Person\n    this.height = height;\n  }\n  get intro() { // substitui o da parent class, mas reutiliza-o\n    return `${super.intro} — ${this.height}cm`;\n  }\n}\nconst athleteRui = new Athlete(\"Rui\", 33, 175);\nathleteRui.intro; // result ==> \"Rui, 33 — 175cm\"  (versão da child class + super)\nathleteRui instanceof Athlete; // result ==> true\nathleteRui instanceof Person; // result ==> true  (a chain passa pelas duas)\nathleteRui.birthYear(2020); // result ==> 1987  (method herdado da parent class)\nathleteRui.checkSecret(\"1234\"); // result ==> true  (o #secret foi criado pelo constructor da parent class)\n// nota: usar this antes de super() dá ReferenceError.\n\n//--------------------------------------------------------------------\n// prototypes - // serve para perceber porque os methods não são copiados para cada object.\n{\n  const base = { speak() { return \"hi from \" + this.n; } };\n  const child = Object.create(base); // child herda de base\n  child.n = \"child\";\n\n  // personTiago.birthYear: não tem no object -> procura em Person.prototype -> tem -> usa esse\n  Object.getPrototypeOf(personTiago) === Person.prototype; // result ==> true\n  Object.getPrototypeOf(Athlete.prototype) === Person.prototype; // result ==> true  (chain Athlete -> Person)\n  Object.hasOwn(personTiago, \"birthYear\"); // result ==> false  (partilhado, não copiado)\n  typeof Person; // result ==> \"function\"\n  child.speak(); // result ==> \"hi from child\"\n  Object.hasOwn(child, \"speak\"); // result ==> false  (vive em base, child só o encontra pela chain)\n}\n// nota: class não é um type novo, por baixo é uma function com prototype."},{"n":"20","title":"ERRORS","kind":"code","body":"//--------------------------------------------------------------------\n// try/catch/finally - // serve para uma string inválida não rebentar o programa todo.\n{\n  function readAge(txt) {\n    const num = Number(txt);\n    if (Number.isNaN(num)) throw new TypeError(`not a number: ${txt}`); // termina a function, como um return\n    return num;\n  }\n  const steps = [];\n  try {\n    steps.push(\"try\");\n    readAge(\"abc\");\n    steps.push(\"never gets here\");\n  } catch (err) {\n    steps.push(`catch ${err.name}`); // err.name, err.message, err.stack\n  } finally {\n    steps.push(\"finally\");\n  }\n  // o throw salta logo para o catch, o resto do try não corre; o finally corre sempre\n  steps; // result ==> [\"try\", \"catch TypeError\", \"finally\"]\n}\n// nota: lança sempre um Error (TypeError, RangeError...) e não uma string: traz name e stack. Se readAge(\"5\") não falhasse, o catch não corria.\n\n//--------------------------------------------------------------------\n// custom error + cause - // serve para dizer \"invalid config\" e manter o SyntaxError que o causou.\n{\n  class ValidationError extends Error {\n    constructor(msg, options) {\n      super(msg, options);\n      this.name = \"ValidationError\";\n    }\n  }\n  let caught;\n  try {\n    try {\n      JSON.parse(\"{bad\");\n    } catch (e) {\n      throw new ValidationError(\"invalid config\", { cause: e });\n    }\n  } catch (e) {\n    caught = e;\n  }\n  caught instanceof ValidationError; // result ==> true\n  caught instanceof Error; // result ==> true  (herda de Error)\n  caught.cause instanceof SyntaxError; // result ==> true  (o erro original)\n  caught.name; // result ==> \"ValidationError\"  (o constructor escreveu por cima do \"Error\")\n}\n// nota: sem { cause: e } o erro original perde-se e só fica a mensagem nova.\n\n//--------------------------------------------------------------------\n// catch sem variable e finally depois de return - // serve para ignorar o erro quando não preciso dele, e limpar mesmo quando a function já devolveu.\n{\n  let failed = false;\n  try { null.x; } catch { failed = true; }  // catch { } dispensa o (err)\n  const log = [];\n  const withFinally = () => { try { return \"try\"; } finally { log.push(\"finally ran\"); } };\n  failed; // result ==> true\n  withFinally(); // result ==> \"try\"  (o return fica pendente, o finally corre, e devolve-se o do try)\n  log; // result ==> [\"finally ran\"]\n  const f = () => { try { return 1; } finally { return 2; } };\n  f(); // result ==> 2  (o return do finally substitui o 1 pendente)\n}\n// nota: um return dentro do finally substitui o do try. Evita-o."},{"n":"21","title":"DATES","kind":"code","body":"//--------------------------------------------------------------------\n// new Date(a, m, d) - // serve para criar uma data em hora local e ler as suas partes (31 de janeiro de 2024).\n{\n  const date = new Date(2024, 0, 31);\n  date.getFullYear(); // result ==> 2024\n  date.getMonth(); // result ==> 0  (janeiro, os meses começam em 0)\n  date.getDate(); // result ==> 31  (dia do mês)\n  date.getDay(); // result ==> 3  (dia da semana: quarta, 0 = domingo)\n  new Date(2024, 11, 25).getMonth(); // result ==> 11  (dezembro)\n}\n// nota: Date = dia do mês (começa em 1); Day = dia da semana (começa em 0).\n// nota2: também há getHours(), getMinutes(), getSeconds() e getMilliseconds().\n\n//--------------------------------------------------------------------\n// setDate e Date.UTC - // serve para calcular \"amanhã\" ou quantos dias tem um mês.\n{\n  const date = new Date(2024, 0, 31);\n  date.setDate(date.getDate() + 1); // 31 + 1 = 32, passa sozinho para 1 de fevereiro\n  date.getMonth(); // result ==> 1  (fevereiro)\n  date.getDate(); // result ==> 1\n  const days = (Date.UTC(2024, 2, 1) - Date.UTC(2024, 1, 1)) / 86_400_000; // 86 400 000 = ms num dia\n  days; // result ==> 29  (2024 é bissexto)\n  const feb = new Date(2024, 1, 29);\n  feb.setDate(30);\n  feb.getMonth(); // result ==> 2  (março: fevereiro só tem 29 dias)\n}\n// nota: setDate muda a data original, não devolve uma cópia.\n// nota2: para contas entre datas usa Date.UTC, sem surpresas de fuso horário nem de hora de verão.\n\n//--------------------------------------------------------------------\n// toISOString, new Date(\"...\"), Intl, Date.now - // serve para guardar, ler e mostrar datas.\n{\n  new Date(Date.UTC(2024, 0, 15)).toISOString(); // result ==> \"2024-01-15T00:00:00.000Z\"  (o Z quer dizer UTC)\n  new Date(\"2024-01-15\").getTime(); // result ==> 1705276800000  (só a data é lida como UTC)\n  new Intl.DateTimeFormat(\"pt-PT\").format(new Date(2024, 0, 5)); // result ==> \"05/01/2024\"\n  typeof Date.now(); // result ==> \"number\"  (ms desde 1970, serve para medir tempo: Date.now() - t0)\n}\n// nota: \"2024-01-15T10:00\" com hora é lido como hora local; sem hora é UTC.\n// nota2: guardar em ISO (UTC) e mostrar com Intl.\n\n//--------------------------------------------------------------------\n// comparar datas - // serve para saber qual vem primeiro ou se são o mesmo instante.\n{\n  new Date(0) \u003c new Date(1); // result ==> true  (\u003c e > comparam ms)\n  new Date(0) === new Date(0); // result ==> false  (dois objects diferentes)\n  new Date(0).getTime() === new Date(0).getTime(); // result ==> true  (compara números)\n  +new Date(5) === 5; // result ==> true  (o + transforma a data nos seus ms)\n}\n// nota: == também compara objects; só getTime() (ou +date) compara o instante."},{"n":"22","title":"REGEX","kind":"code","body":"//--------------------------------------------------------------------\n// /regex/.test() - // serve para validar formatos (código postal, email) com uma linha.\n{\n  //   .  qualquer carácter     *  0 ou mais       \\d  dígito          \\w  letra/dígito/_      \\s  espaço\n  //   +  1 ou mais             ?  0 ou 1          {2,4}  de 2 a 4     [^abc]  nenhum destes   a|b  a ou b\n  //   ^ $  início / fim        (...)  group; (?\u003cn>...) named group\n  //   flags: g todas, i ignora maiúsculas, m multilinha, s \".\" apanha \\n, u unicode\n  /^\\d{4}-\\d{3}$/.test(\"1000-123\"); // result ==> true  (código postal português)\n  /^\\w+@\\w+\\.[a-z]{2,4}$/.test(\"tiago@mail.com\"); // result ==> true\n  /^[^0-9]+\\s?!?$/.test(\"Lisboa !\"); // result ==> true\n  /hello/i.test(\"HELLO world\"); // result ==> true  (flag i)\n  /^\\d{4}-\\d{3}$/.test(\"1000-1234\"); // result ==> false  ($ obriga a acabar ali)\n  /^\\d+$/.test(\"\"); // result ==> false  (+ exige pelo menos 1 dígito)\n  /\\d{4}/.test(\"abc12345\"); // result ==> true  (sem ^ e $ basta encontrar 4 dígitos em qualquer sítio)\n}\n// nota: ^...$ = a string toda.\n\n//--------------------------------------------------------------------\n// match / matchAll - // serve para tirar números ou partes de uma data de uma string.\n{\n  const iso = \"2024-01-15\".match(/(?\u003cyear>\\d{4})-(?\u003cmonth>\\d{2})-(?\u003cday>\\d{2})/);\n  \"a1b22c333\".match(/\\d+/g); // result ==> [\"1\", \"22\", \"333\"]  (com g devolve todas as partes)\n  \"no numbers\".match(/\\d/); // result ==> null  (não encontrou: é null, não [])\n  iso.groups.month; // result ==> \"01\"  (named group)\n  [...\"k1=v1;k2=v2\".matchAll(/(\\w+)=(\\w+)/g)].map((m) => m[2]); // result ==> [\"v1\", \"v2\"]  (matchAll exige g)\n  (\"a1b2\".match(/\\d/g) ?? []).length; // result ==> 2\n}\n// nota: \"x\".match(/\\d/g).length rebenta com TypeError porque match deu null. Usa (str.match(re) ?? []).length.\n\n//--------------------------------------------------------------------\n// replace / split com regex - // serve para reformatar datas, limpar strings para um palíndromo e partir por separadores irregulares.\n{\n  \"2024-01-15\".replace(/(\\d+)-(\\d+)-(\\d+)/, \"$3/$2/$1\"); // result ==> \"15/01/2024\"  ($1 = o que o group 1 apanhou)\n  \"A man, a plan!\".toLowerCase().replace(/[^a-z0-9]/g, \"\"); // result ==> \"amanaplan\"  (fica só com letras e dígitos)\n  \"a, b ,c\".split(/\\s*,\\s*/); // result ==> [\"a\", \"b\", \"c\"]  (vírgula com espaços à volta)\n  \"a-b-c\".replace(/-/, \"+\"); // result ==> \"a+b-c\"  (sem g: só a 1.ª)\n  \"a-b-c\".replace(/-/g, \"\"); // result ==> \"abc\"  (com g: todas)\n}\n// nota: replace(\"-\", \"+\") com string também troca só a 1.ª; para todas usa replaceAll ou /-/g.\n// nota2: cada call devolve uma string ou array novo, o original fica igual.\n\n//--------------------------------------------------------------------\n// lastIndex - // serve para perceber um test() que dá true e depois false com a mesma string.\n{\n  const reG = /a/g; // com g, a regex guardada lembra-se de onde parou (lastIndex)\n  reG.test(\"a\"); // result ==> true  (começa em 0, encontra, lastIndex fica 1)\n  reG.test(\"a\"); // result ==> false  (começa em 1, não encontra, lastIndex volta a 0)\n  reG.test(\"a\"); // result ==> true  (voltou ao início)\n}\n// nota: só acontece com g (ou y) e a regex reutilizada; /a/.test(\"a\") dá sempre true. Repetiu o test()? Tira o g.\n\n//--------------------------------------------------------------------\n// regex ou loop - // serve para limpar ou validar strings num desafio sem decorar regex: cada regex tem um loop equivalente.\n{\n  const isLetter = (c) => c.toLowerCase() !== c.toUpperCase(); // só letras mudam de maiúscula para minúscula\n  \"a1 b22\".replace(/\\d/g, \"\"); // result ==> \"a b\"  (tirar dígitos)\n  [...\"a1 b22\"].filter((c) => c \u003c \"0\" || c > \"9\").join(\"\"); // result ==> \"a b\"  (o mesmo, em loop)\n  \"Hello, World!\".replace(/[^a-z]/gi, \"\"); // result ==> \"HelloWorld\"  (só letras)\n  [...\"Hello, World!\"].filter(isLetter).join(\"\"); // result ==> \"HelloWorld\"\n  \"  a   b \".trim().split(/\\s+/); // result ==> [\"a\", \"b\"]  (partir por espaços)\n  \"  a   b \".split(\" \").filter((w) => w !== \"\"); // result ==> [\"a\", \"b\"]\n  /^\\d+$/.test(\"12a\"); // result ==> false  (só dígitos?)\n  [...\"12a\"].every((c) => c >= \"0\" && c \u003c= \"9\"); // result ==> false\n  \"x9y9\".replace(/\\d/, \"\"); // result ==> \"xy9\"  (sem g: só o 1.º dígito)\n}\n// nota: \"  a   b \".split(\" \") sem filtro dá [\"\", \"\", \"a\", \"\", \"\", \"b\", \"\"]; \\s+ junta os espaços seguidos.\n// nota2: na entrevista, se não te lembrares da regex, escreve o loop: correto e claro vale mais."},{"n":"23","title":"PROMISES E ASYNC/AWAIT","kind":"code","body":"// §23–§25 são assíncronos: correm dentro de main() para o ficheiro esperar por eles.\n// sleep(ms, value) devolve uma Promise que resolve com value ao fim de ms.\nconst sleep = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));\n\nasync function main() {\n  //--------------------------------------------------------------------\n  // new Promise + await - // serve para esperar por um pedido à rede sem bloquear o resto do programa.\n  {\n    const p = new Promise((resolve, reject) => {\n      const ok = true;\n      ok ? resolve(\"done\") : reject(new Error(\"failed\"));\n    });\n    // resolve(\"done\") cumpre a promise; reject(erro) falha-a\n    await p; // result ==> \"done\"\n    const f = async () => 5;\n    await f(); // result ==> 5\n  }\n  // nota: uma function async devolve SEMPRE uma Promise, mesmo com return 5. Para ter o 5, faz await f().\n  // nota2: await só funciona dentro de uma function async.\n\n  //--------------------------------------------------------------------\n  // then() / catch() / finally() - // serve para encadear passos assíncronos, sem async/await.\n  {\n    const viaThen = await Promise.resolve(2)\n      .then((v) => v * 10) //          devolve um value, o próximo then recebe-o\n      .then((v) => sleep(1, v + 1)) // devolve uma Promise, a chain espera\n      .catch(() => -1) //              só corre se houver erro acima\n      .finally(() => {}); //           corre sempre, não muda o value\n    viaThen; // result ==> 21\n    await Promise.reject(new Error(\"x\")).catch(() => 7).then((v) => v + 1); // result ==> 8  (o catch transforma o erro em 7)\n  }\n  // nota: .then((v) => { v * 10 }) com braces e sem return passa undefined ao seguinte.\n\n  //--------------------------------------------------------------------\n  // try / catch com await - // serve para apanhar o erro de uma call assíncrona como se fosse código normal.\n  {\n    async function explode() {\n      throw new Error(\"exploded\");\n    }\n    let message;\n    try {\n      await explode(); // Promise rejeitada, lança o erro aqui\n      assert.fail(\"should not get here\");\n    } catch (e) {\n      message = e.message;\n    }\n    message; // result ==> \"exploded\"\n    await assert.rejects(explode(), /exploded/);\n  }\n  // nota: try { explode(); } sem await NÃO apanha nada. O erro chega depois de o try acabar.\n\n  //--------------------------------------------------------------------\n  // Promise.all() - // serve para fazer dois pedidos que não dependem um do outro em metade do tempo.\n  {\n    let t0 = Date.now();\n    const seq1 = await sleep(30, \"a\"); // espera 30ms...\n    const seq2 = await sleep(30, \"b\"); // ...e mais 30ms = 60ms\n    const tSeq = Date.now() - t0;\n    t0 = Date.now();\n    const [par1, par2] = await Promise.all([sleep(30, \"a\"), sleep(30, \"b\")]); // os dois ao mesmo tempo = 30ms\n    const tPar = Date.now() - t0;\n    [seq1, seq2]; // result ==> [\"a\", \"b\"]\n    [par1, par2]; // result ==> [\"a\", \"b\"]  (mesmos values, metade do tempo)\n    tSeq >= 55; // result ==> true  (as esperas somam)\n    void tPar; // ≈ 30ms; não é verificado: numa máquina ocupada podia falhar ao acaso\n  }\n  // nota: três sleep(100) com Promise.all demoram cerca de 100ms. O total é o do mais lento.\n\n  //--------------------------------------------------------------------\n  // all() / allSettled() / race() / any() - // serve para escolher como esperar por várias Promises ao mesmo tempo.\n  {\n    // all: espera por todas, falha à primeira que falhar\n    await Promise.all([sleep(20, \"slow\"), sleep(1, \"fast\")]); // result ==> [\"slow\", \"fast\"]  (ordem do array, não de chegada)\n    await assert.rejects(Promise.all([sleep(1, 1), Promise.reject(new Error(\"x\"))]), /x/);\n    // allSettled: espera por todas e nunca falha, dá um relatório\n    const settled = await Promise.allSettled([Promise.resolve(1), Promise.reject(new Error(\"no\"))]);\n    settled.map((r) => r.status); // result ==> [\"fulfilled\", \"rejected\"]\n    settled[0].value; // result ==> 1\n    settled[1].reason.message; // result ==> \"no\"\n    // race: fica com a primeira a acabar, mesmo que falhe\n    await Promise.race([sleep(20, \"slow\"), sleep(1, \"fast\")]); // result ==> \"fast\"\n    await assert.rejects(Promise.race([Promise.reject(new Error(\"x\")), sleep(10, \"ok\")]), /x/);\n    // any: ignora as que falham e fica com a primeira que corre bem\n    await Promise.any([Promise.reject(new Error()), sleep(1, \"ok\")]); // result ==> \"ok\"\n    await assert.rejects(Promise.any([Promise.reject(new Error())]), AggregateError);\n  }\n  // nota: race aceita a primeira a acabar, mesmo rejeitada. any só falha se TODAS falharem (AggregateError).\n\n  //--------------------------------------------------------------------\n  // Timeout com race() - // serve para não ficar à espera para sempre de um pedido lento.\n  {\n    const withTimeout = (promise, ms) =>\n      Promise.race([promise, sleep(ms).then(() => { throw new Error(\"timeout\"); })]);\n    // corrida entre o trabalho e um timer que lança erro\n    await assert.rejects(withTimeout(sleep(50), 5), /timeout/); // o timer ganha\n    await withTimeout(sleep(1, \"ok\"), 50); // result ==> \"ok\"  (o trabalho ganha)\n  }\n  // nota: o trabalho lento NÃO é cancelado. Só deixamos de esperar por ele.\n\n  //--------------------------------------------------------------------\n  // await num loop - // serve para fazer passos que dependem do anterior, um de cada vez e por ordem.\n  {\n    const order = [];\n    for (const ms of [10, 1]) order.push(await sleep(ms, ms));\n    order; // result ==> [10, 1]  (o de 1ms esperou pelo de 10ms)\n  }\n  // nota: [10, 1].forEach(async (ms) => ...) NÃO espera. Lança os dois, e o de 1ms acabava primeiro.\n  // nota2: com Promise.all em vez do loop, demorava cerca de 10ms e não 11ms."},{"n":"24","title":"EVENT LOOP","kind":"code","body":"//--------------------------------------------------------------------\n// Event loop - // serve para prever a ordem de um console.log numa pergunta de entrevista.\n{\n  const log = [];\n  log.push(\"sync 1\");\n  setTimeout(() => log.push(\"setTimeout\"), 0); // macrotask\n  Promise.resolve().then(() => log.push(\"then\")); // microtask\n  queueMicrotask(() => log.push(\"queueMicrotask\")); // microtask\n  log.push(\"sync 2\");\n  await sleep(5); // dá tempo ao setTimeout\n  log; // result ==> [\"sync 1\", \"sync 2\", \"then\", \"queueMicrotask\", \"setTimeout\"]\n  /* sync 1            \u003c- 1.º: o código síncrono todo\n     sync 2\n     then              \u003c- 2.º: TODAS as microtasks, pela ordem em que entraram\n     queueMicrotask\n     setTimeout        \u003c- 3.º: UMA macrotask, mesmo com 0ms */\n}\n// nota: setTimeout(fn, 0) não corre já. Vai para o fim da queue, depois de todas as microtasks.\n// nota2: no Node, process.nextTick corre ainda antes das Promises.\n\n//--------------------------------------------------------------------\n// async até ao primeiro await - // serve para acertar no exercício clássico de entrevista de ordenar letras.\n{\n  const q = [];\n  const task = async () => {\n    q.push(\"B\"); // antes do await, corre logo\n    await null;\n    q.push(\"D\"); // depois do await, vira microtask\n  };\n  q.push(\"A\");\n  setTimeout(() => q.push(\"F\"), 0);\n  task();\n  Promise.resolve().then(() => q.push(\"E\"));\n  q.push(\"C\");\n  await sleep(5);\n  q.join(\"\"); // result ==> \"ABCDEF\"\n  /* A    \u003c- síncrono\n     B    \u003c- task() corre até ao await\n     C    \u003c- síncrono\n     D    \u003c- microtask, entrou primeiro\n     E    \u003c- microtask, entrou depois\n     F    \u003c- macrotask, por último */\n}\n// nota: task() não fica toda para depois. Só a parte a seguir ao await é adiada.\n// nota2: se task() fosse chamada DEPOIS do then(E), dava \"ABCEDF\". O E entrava primeiro na queue."},{"n":"25","title":"TIMERS","kind":"code","body":"  //--------------------------------------------------------------------\n  // setTimeout() / setInterval() - // serve para correr código uma vez daqui a ms, ou de ms em ms até eu mandar parar.\n  {\n    const ran = [];\n    const cancelledId = setTimeout(() => ran.push(\"never\"), 5);\n    clearTimeout(cancelledId); // o id serve para cancelar\n    await sleep(10);\n\n    let tick = 0;\n    await new Promise((resolve) => {\n      const intervalId = setInterval(() => {\n        tick++;\n        if (tick === 3) {\n          clearInterval(intervalId); // sem isto corria para sempre\n          resolve();\n        }\n      }, 5);\n    });\n    ran; // result ==> []  (cancelado, nunca correu)\n    tick; // result ==> 3\n  }\n  // nota: setTimeout corre UMA vez; setInterval repete até clearInterval. ms é uma espera mínima, não exata.\n  // nota2: sem o clearInterval o programa nunca acabava, porque o interval mantém o Node vivo.\n\n  //--------------------------------------------------------------------\n  // timers/promises - // serve para ter um sleep pronto, sem escrever a Promise à mão.\n  {\n    const { setTimeout: wait } = require(\"node:timers/promises\");\n    await wait(1, \"value\"); // result ==> \"value\"\n    await wait(1); // result ==> undefined  (sem 2.º argument não há value)\n  }\n  // nota: este setTimeout não recebe callback. O global recebe (fn, ms).\n\n  //--------------------------------------------------------------------\n  // debounce - // serve para uma caixa de pesquisa só pedir à rede quando a pessoa para de escrever.\n  {\n    const debounce = (fn, ms) => {\n      let id;\n      return (...args) => {\n        clearTimeout(id); // cada call cancela a anterior...\n        id = setTimeout(() => fn(...args), ms); // ...e começa outra\n      };\n    };\n    const calls = [];\n    const search = debounce((txt) => calls.push(txt), 10);\n    search(\"t\");\n    search(\"ti\");\n    search(\"tia\");\n    await sleep(30);\n    calls; // result ==> [\"tia\"]  (só a última chegou ao fim)\n  }\n  // nota: com um sleep(20) entre \"t\" e \"ti\", ficava [\"t\", \"tia\"]. O \"t\" teve 10ms de pausa e correu.\n  // nota2: throttle é diferente. Corre no máximo uma vez por intervalo, em vez de esperar pela pausa.\n}"},{"n":"26","title":"MODULES","kind":"code","body":"//--------------------------------------------------------------------\n// require / import - // serve para usar num ficheiro a function escrita noutro.\n//   CommonJS (Node clássico, .js e .cjs)     ES Modules (browsers; Node com .mjs ou \"type\": \"module\")\n//   // math.js                               // math.js\n//   module.exports = { sum };                export const PI = 3.14;\n//                                            export default function sum(a, b) { return a + b; }\n//   // app.js                                // app.js\n//   const { sum } = require(\"./math\");       import sum, { PI } from \"./math.js\";  // default sem { }, named com { }\n//                                            import * as math from \"./math.js\";    // tudo num object\n//   carregar só quando precisas (nos dois):  const mod = await import(\"./math.js\");\n{\n  typeof module.exports; // result ==> \"object\"  (este ficheiro é CommonJS)\n  typeof require; // result ==> \"function\"\n}\n// nota: o default importa-se sem { } e com o nome que quiseres; o named, com { } e o nome exato.\n// nota2: em ESM não há require (usa import ou createRequire), a extensão \".js\" é obrigatória e há await no topo."},{"n":"27","title":"DATA STRUCTURES","kind":"code","body":"// Linked lists, trees, BST e binary search estão em 02-LeetCode-Easy.js.\n\nmain().then(\n  () => console.log(\"✅ Fundamentals OK\"),\n  (err) => {\n    console.error(err);\n    process.exitCode = 1;\n  }\n);"}]},{"id":"easy","label":"Easy","file":"02-LeetCode-Easy.js","sections":[{"n":"0","title":"COMO ATACAR UM PROBLEMA","kind":"code","body":"// 1. Ler os exemplos e inventar 1 caso pequeno e 1 caso estranho (vazio, 1 elemento, negativos, repetidos).\n// 2. Resolver à mão no papel. O que os olhos fizeram é o algoritmo.\n// 3. Escrever primeiro a força bruta (dois for). Depois perguntar:\n//      procuro a mesma coisa vezes sem conta?        → Map/Set (§2)\n//      o array está ordenado?                        → two pointers (§3) ou binary search (§6)\n//      um pedaço seguido do array/string?            → sliding window (§4) ou prefix sum (§5)\n//      parênteses, desfazer, \"o mais recente\"?       → stack (§7)\n//      head e .next?                                 → pointers prev/slow/fast (§8)\n//      root, .left e .right?                         → recursion (§9)\n// 4. Testar os meus casos antes de submeter.\n// 5. Velocidade (Big O): O(1) arr[i], map.get · O(log n) binary search · O(n) um loop · O(n log n) sort · O(n²) loop dentro de loop.\n// Nota: includes(), indexOf(), shift(), splice() são O(n) — dentro de um loop tornam tudo O(n²)."},{"n":"1","title":"ARMADILHAS DE JS QUE CHUMBAM TESTES","kind":"code","body":"//--------------------------------------------------------------------\n// sort() - // serve para pôr [10, 1, 2] do menor para o maior antes de usar two pointers.\n{\n  // sem function, o sort compara como STRING: \"10\" vem antes de \"2\".\n  [10, 1, 2].sort(); // result ==> [1, 10, 2]\n  // a function devolve um número: negativo = a fica antes, positivo = b fica antes.\n  [10, 1, 2].sort((a, b) => a - b); // result ==> [1, 2, 10]\n  [10, 1, 2].sort((a, b) => b - a); // result ==> [10, 2, 1]\n  [5, 25, 100].sort(); // result ==> [100, 25, 5]\n  const original = [3, 1, 2];\n  const sorted = original.toSorted((a, b) => a - b);\n  original; // result ==> [3, 1, 2]\n  sorted; // result ==> [1, 2, 3]\n}\n// nota: sort() altera o original e devolve o mesmo array; toSorted() deixa o original e devolve uma cópia.\n// nota2: [5, 25, 100].sort() dá [100, 25, 5] porque \"1\" \u003c \"2\" \u003c \"5\" como string. Ver 01 §11 e §16.\n\n//--------------------------------------------------------------------\n// Math.floor() - // serve para calcular o index do meio, Math.floor((left + right) / 2), na binary search.\n{\n  7 / 2; // result ==> 3.5\n  Math.floor(7 / 2); // result ==> 3\n  Math.floor(9 / 4); // result ==> 2\n  Math.trunc(-7 / 2); // result ==> -3\n  Math.floor(-7 / 2); // result ==> -4\n}\n// nota: JS não tem divisão inteira. floor desce sempre; trunc corta para o zero. Só diferem nos negativos.\n// nota2: divisão inteira = Math.floor(a / b). Ver 01 §8.\n\n//--------------------------------------------------------------------\n// split(\"\") - // serve para trocar uma letra de \"abc\", porque as strings não se alteram.\n{\n  const word = \"abc\";\n  const letters = word.split(\"\"); // ou [...word]\n  letters[0] = \"x\";\n  letters.join(\"\"); // result ==> \"xbc\"\n  letters.join(); // result ==> \"x,b,c\"\n  word; // result ==> \"abc\"\n}\n// nota: word[0] = \"x\" não faz nada e não dá erro (em strict mode dá TypeError). Caminho: string → array → mudar → join(\"\"). Ver 01 §7 e §13.\n// nota2: join() sem argumento põe vírgulas.\n\n//--------------------------------------------------------------------\n// === em arrays - // serve para perceber porque comparar dois resultados [1, 2] dá false.\n{\n  const first = [1];\n  const second = first;\n  [1, 2] === [1, 2]; // result ==> false\n  [1, 2].join() === [1, 2].join(); // result ==> true\n  first === second; // result ==> true\n}\n// nota: arrays comparam a referência (\"é o mesmo?\"), não o conteúdo (\"é igual?\"). second aponta para o mesmo array que first.\n// nota2: para comparar o conteúdo, faz join() aos dois e compara a string. Ver 01 §3, §7 e §15.\n\n//--------------------------------------------------------------------\n// Infinity - // serve para encontrar o mínimo de [5, 3, 8] sem saber de antemão os values.\n{\n  // passo 1 — esqueleto: o value inicial, o loop e o resultado\n  let smallest = Infinity;\n  for (const number of [5, 3, 8]) {\n    // passo 2 — guardar o menor visto até agora\n    smallest = Math.min(smallest, number);\n  }\n  smallest; // result ==> 3\n\n  let biggest = -Infinity;\n  for (const number of [5, 3, 8]) {\n    biggest = Math.max(biggest, number);\n  }\n  biggest; // result ==> 8\n}\n// nota: o mínimo começa em Infinity e o máximo em -Infinity. Com 0, o mínimo de [5, 3, 8] ficaria 0, que nem está no array.\n// nota2: ver Infinity e Math.min em 01 §8, for...of em 01 §6.\n\n//--------------------------------------------------------------------\n// Array.from() - // serve para criar uma grid 2 × 3 de zeros para dynamic programming.\n{\n  const matrix = Array.from({ length: 2 }, () => new Array(3).fill(0));\n  matrix[0][0] = 1;\n  matrix; // result ==> [[1, 0, 0], [0, 0, 0]]\n  matrix[1][2] = 5;\n  matrix[0][2]; // result ==> 0\n\n  const bad = new Array(2).fill([]);\n  bad[0].push(1);\n  bad; // result ==> [[1], [1]]\n  bad[0] === bad[1]; // result ==> true\n}\n// nota: Array.from chama a function uma vez por row, por isso cada row é um array NOVO. fill([]) põe o MESMO [] nas duas posições.\n// nota2: fill(0) não dá problema (um número é copiado); fill([]) partilha o array. Ver 01 §9.\n\n//--------------------------------------------------------------------\n// at(-1) - // serve para ler o último elemento, por exemplo o topo de uma stack, sem a alterar.\n{\n  [1, 2, 3].at(0); // result ==> 1\n  [1, 2, 3].at(-1); // result ==> 3\n  [1, 2, 3].at(-2); // result ==> 2\n  [1, 2, 3][-1]; // result ==> undefined\n  \"abc\".at(-1); // result ==> \"c\"\n}\n// nota: indexes negativos contam do fim. arr[-1] procura uma propriedade \"-1\" e dá undefined.\n// nota2: at() funciona em arrays e em strings. Ver 01 §10 e §7.\n\n//--------------------------------------------------------------------\n// charCodeAt() - // serve para contar letras num array de 26 posições (a = 0 … z = 25).\n{\n  \"a\".charCodeAt(0); // result ==> 97\n  String.fromCharCode(98); // result ==> \"b\"\n  \"c\".charCodeAt(0) - \"a\".charCodeAt(0); // result ==> 2\n  \"z\".charCodeAt(0) - \"a\".charCodeAt(0); // result ==> 25\n}\n// nota: posição = código da letra − código de \"a\". O 0 é o index da letra dentro da string; para uma letra é sempre 0.\n// nota2: ver 01 §7.\n\n//--------------------------------------------------------------------\n// Dígitos de um número - // serve para somar os dígitos de 1234 sem passar a string.\n{\n  String(1234).split(\"\").map(Number); // result ==> [1, 2, 3, 4]\n\n  // passo 1 — esqueleto: o número, a soma e o loop\n  let number = 1234;\n  let digitSum = 0;\n  while (number > 0) {\n    // passo 2 — ler o último dígito\n    const lastDigit = number % 10;\n    digitSum += lastDigit;\n    // passo 3 — apagar o último dígito\n    number = Math.floor(number / 10);\n  }\n  digitSum; // result ==> 10\n  907 % 10; // result ==> 7\n  Math.floor(907 / 10); // result ==> 90\n}\n// nota: % 10 lê o último dígito; Math.floor(/ 10) apaga-o. Sem o floor, 907 / 10 daria 90.7.\n// nota2: ver split em 01 §7, map(Number) em 01 §8, % e += em 01 §3, while em 01 §6."},{"n":"2","title":"HASH MAP / SET","kind":"code","body":"//--------------------------------------------------------------------\n// Contar com um Map - // serve para responder \"já vi isto?\" ou \"quantas vezes aparece cada letra?\".\n// count fica fora do bloco porque o isAnagram e o firstUniqChar também a usam.\nfunction count(items) {\n  // passo 1 — esqueleto: o Map, o loop e o return\n  const freq = new Map();\n  for (const item of items) {\n    // passo 2 — ler a contagem anterior (0 se ainda não existe)\n    let previous = 0;\n    if (freq.has(item)) {\n      previous = freq.get(item);\n    }\n    // passo 3 — somar 1 e guardar\n    freq.set(item, previous + 1);\n  }\n  return freq;\n}\n{\n  count(\"banana\").get(\"a\"); // result ==> 3\n  count(\"banana\").get(\"n\"); // result ==> 2\n  count(\"banana\").size; // result ==> 3\n  count(\"banana\").get(\"z\"); // result ==> undefined\n}\n// nota: o Map não soma sozinho: lê o anterior, soma 1 e guarda com set(). Cada get/set é O(1). Versão curta: freq.set(item, (freq.get(item) ?? 0) + 1).\n// nota2: o Map aceita qualquer tipo de key e tem .size; num object {} as keys viram string. Ver 01 §14.\n\n//--------------------------------------------------------------------\n// Two Sum (LC 1) - // serve para encontrar o par de [2, 7, 11, 15] que soma 9 sem testar todos os pares.\n{\n  function twoSum(nums, target) {\n    // passo 1 — esqueleto: o Map, o loop e o return\n    const seen = new Map();\n    for (let index = 0; index \u003c nums.length; index++) {\n      // passo 2 — o complemento que falta para chegar ao target\n      const needed = target - nums[index];\n      // passo 3 — o complemento já passou? Devolve os dois indexes\n      if (seen.has(needed)) {\n        return [seen.get(needed), index];\n      }\n      // passo 4 — guardar o número (key) e o index (value), só DEPOIS de perguntar\n      seen.set(nums[index], index);\n    }\n    // nenhum par existe\n    return [];\n  }\n  twoSum([2, 7, 11, 15], 9); // result ==> [0, 1]\n  twoSum([3, 3], 6); // result ==> [0, 1]\n  twoSum([3, 2, 4], 6); // result ==> [1, 2]\n}\n// nota: a key é o VALUE (é por ele que procuramos) e o index é o que se guarda. Guardar só depois evita usar o mesmo número duas vezes.\n// nota2: em [3, 2, 4] com target 6: em index 0 o Map está vazio; em index 2 precisa de 2, que está no index 1.\n\n//--------------------------------------------------------------------\n// Contains Duplicate (LC 217) - // serve para saber se [1, 2, 3, 1] tem repetidos.\n{\n  function containsDuplicate(nums) {\n    // passo 1 — esqueleto: o Set tira os repetidos\n    const unique = new Set(nums);\n    // passo 2 — comparar os tamanhos\n    return unique.size !== nums.length;\n  }\n  containsDuplicate([1, 2, 3, 1]); // result ==> true\n  containsDuplicate([1, 2, 3]); // result ==> false\n  containsDuplicate([]); // result ==> false\n}\n// nota: Set menor que o array = há repetidos. size é do Set; o array usa length. Versão curta: new Set(nums).size !== nums.length. Ver 01 §14.\n\n//--------------------------------------------------------------------\n// Valid Anagram (LC 242) - // serve para saber se \"anagram\" e \"nagaram\" usam exatamente as mesmas letras.\n{\n  function isAnagram(a, b) {\n    // passo 1 — esqueleto: contar a palavra a, descontar a palavra b\n    // passo 2 — tamanhos diferentes: não pode ser\n    if (a.length !== b.length) {\n      return false;\n    }\n    const freq = count(a);\n    for (const letter of b) {\n      // passo 3 — a letra nunca existiu em a\n      if (!freq.has(letter)) {\n        return false;\n      }\n      // passo 4 — a letra já foi toda gasta\n      if (freq.get(letter) === 0) {\n        return false;\n      }\n      // passo 5 — descontar uma\n      freq.set(letter, freq.get(letter) - 1);\n    }\n    return true;\n  }\n  isAnagram(\"anagram\", \"nagaram\"); // result ==> true\n  isAnagram(\"rat\", \"car\"); // result ==> false\n  isAnagram(\"aab\", \"abb\"); // result ==> false\n}\n// nota: em \"aab\" vs \"abb\", freq começa a → 2, b → 1; o segundo \"b\" encontra b → 0 e devolve false.\n// nota2: sem o passo 2, \"ab\" e \"abc\" teriam de ser comparados letra a letra. Ver 01 §14.\n\n//--------------------------------------------------------------------\n// First Unique Character (LC 387) - // serve para devolver o index da primeira letra que aparece uma só vez.\n{\n  function firstUniqChar(s) {\n    // passo 1 — esqueleto: contar tudo, depois andar pela ordem original\n    const freq = count(s);\n    for (let index = 0; index \u003c s.length; index++) {\n      // passo 2 — esta letra aparece uma só vez? Devolve o index\n      if (freq.get(s[index]) === 1) {\n        return index;\n      }\n    }\n    // nenhuma letra única\n    return -1;\n  }\n  firstUniqChar(\"aabc\"); // result ==> 2\n  firstUniqChar(\"leetcode\"); // result ==> 0\n  firstUniqChar(\"aabb\"); // result ==> -1\n  firstUniqChar(\"abab\"); // result ==> -1\n}\n// nota: a 2.ª passagem é na string, não no Map, porque a resposta tem de seguir a ordem original.\n// nota2: duas passagens: contar tudo, depois procurar pela ordem. Ver 01 §7.\n\n//--------------------------------------------------------------------\n// Group Anagrams (LC 49) - // serve para juntar [\"eat\", \"tea\", \"tan\", \"nat\"] em [[\"eat\", \"tea\"], [\"tan\", \"nat\"]].\n{\n  function groupAnagrams(words) {\n    // passo 1 — esqueleto: o Map de grupos, o loop e o return\n    const groups = new Map();\n    for (const word of words) {\n      // passo 2 — a key: as letras da palavra, ordenadas\n      const letters = word.split(\"\");\n      letters.sort();\n      const key = letters.join(\"\");\n      // passo 3 — key nova: criar o grupo vazio\n      if (!groups.has(key)) {\n        groups.set(key, []);\n      }\n      // passo 4 — pôr a palavra no grupo\n      groups.get(key).push(word);\n    }\n    // só os grupos, sem as keys\n    return [...groups.values()];\n  }\n  groupAnagrams([\"eat\", \"tea\", \"tan\", \"nat\"]); // result ==> [[\"eat\", \"tea\"], [\"tan\", \"nat\"]]\n  [\"n\", \"a\", \"t\"].sort().join(\"\"); // result ==> \"ant\"\n}\n// nota: groups.get(key).push(word) não precisa de set(): o push altera o array que já está guardado no Map. Versão curta da key: [...word].sort().join(\"\").\n// nota2: aqui o sort sem function está certo, porque ordenamos letras (string). Ver 01 §11, §13 e §14.\n\n//--------------------------------------------------------------------\n// Roman to Integer (LC 13) - // serve para converter \"MCMXCIV\" em 1994.\n{\n  const VALUE = new Map([[\"I\", 1], [\"V\", 5], [\"X\", 10], [\"L\", 50], [\"C\", 100], [\"D\", 500], [\"M\", 1000]]);\n\n  function romanToInt(s) {\n    // passo 1 — esqueleto: o total, o loop e o return\n    let total = 0;\n    for (let index = 0; index \u003c s.length; index++) {\n      // passo 2 — o value desta letra\n      const current = VALUE.get(s[index]);\n      // passo 3 — o value da seguinte (0 se esta for a última)\n      let next = 0;\n      if (index + 1 \u003c s.length) {\n        next = VALUE.get(s[index + 1]);\n      }\n      // passo 4 — menor do que a seguinte: subtrai (IV = 5 − 1)\n      if (current \u003c next) {\n        total -= current;\n      }\n      // passo 5 — senão: soma\n      if (current >= next) {\n        total += current;\n      }\n    }\n    return total;\n  }\n  romanToInt(\"III\"); // result ==> 3\n  romanToInt(\"LVIII\"); // result ==> 58\n  romanToInt(\"MCMXCIV\"); // result ==> 1994\n  romanToInt(\"XIV\"); // result ==> 14\n}\n// nota: menor antes de maior → subtrai. O passo 3 existe porque na última letra VALUE.get(s[index + 1]) seria undefined.\n// nota2: em \"XIV\": X soma 10, I (1 \u003c 5) subtrai 1, V soma 5 → 14. Ver 01 §14.\n\n//--------------------------------------------------------------------\n// Integer to Roman (LC 12, Medium) - // serve para o caminho inverso: 1994 → \"MCMXCIV\".\n{\n  // do maior para o menor, com os pares de subtração (CM, CD, XC, XL, IX, IV) na tabela\n  const TABLE = [[1000, \"M\"], [900, \"CM\"], [500, \"D\"], [400, \"CD\"], [100, \"C\"], [90, \"XC\"],\n    [50, \"L\"], [40, \"XL\"], [10, \"X\"], [9, \"IX\"], [5, \"V\"], [4, \"IV\"], [1, \"I\"]];\n\n  function intToRoman(num) {\n    // passo 1 — esqueleto: o romano a construir, o loop pela tabela e o return\n    let result = \"\";\n    for (const [value, symbol] of TABLE) {\n      // passo 2 — enquanto o value cabe, usa-o outra vez\n      while (num >= value) {\n        result += symbol;\n        num -= value;\n      }\n    }\n    return result;\n  }\n  intToRoman(3); // result ==> \"III\"\n  intToRoman(58); // result ==> \"LVIII\"\n  intToRoman(1994); // result ==> \"MCMXCIV\"\n  intToRoman(44); // result ==> \"XLIV\"\n}\n// nota: guloso: maior que cabe, repete, desce. Sem 900/400/90/40/9/4 na tabela, 4 sairia \"IIII\" em vez de \"IV\".\n// nota2: 44 → 40 cabe (\"XL\"), falta 4; 4 cabe (\"IV\")."},{"n":"3","title":"TWO POINTERS","kind":"code","body":"//--------------------------------------------------------------------\n// Two pointers - // serve para percorrer um array ordenado, um palíndromo, ou alterá-lo no sítio sem cópia.\n{\n  // forma 1 — pontas opostas: left no início, right no fim, aproximam-se até se cruzarem\n  const array = [1, 2, 3, 4, 5];\n  const pairs = [];\n  let left = 0;\n  let right = array.length - 1;\n  while (left \u003c right) {\n    pairs.push([array[left], array[right]]);\n    left++;\n    right--;\n  }\n  pairs; // result ==> [[1, 5], [2, 4]]\n\n  // forma 2 — mesmo sentido: read lê tudo, write só avança quando guarda algo\n  const numbers = [1, 2, 3, 4];\n  let write = 0;\n  for (let read = 0; read \u003c numbers.length; read++) {\n    if (numbers[read] % 2 === 0) {\n      numbers[write] = numbers[read];\n      write++;\n    }\n  }\n  numbers.slice(0, write); // result ==> [2, 4]\n}\n// nota: while (left \u003c right) deixa o elemento do meio em paz (o 3 nunca aparece). \u003c= é da binary search (§6). Num array de 4 elementos corre 2 vezes: (0, 3) e (1, 2).\n// nota2: pontas opostas fecham (palíndromo, inverter); read/write andam juntos (remover repetidos, zeros).\n\n//--------------------------------------------------------------------\n// Valid Palindrome (LC 125) - // serve para saber se \"A man, a plan, a canal: Panama\" se lê igual nos dois sentidos.\n{\n  function isPalindrome(s) {\n    // passo 1 — esqueleto: limpar, os dois pointers, o loop e o return\n    const lower = s.toLowerCase();\n    const clean = lower.replace(/[^a-z0-9]/g, \"\");\n    let left = 0;\n    let right = clean.length - 1;\n    while (left \u003c right) {\n      // passo 2 — as pontas são diferentes: uma basta, termina já\n      if (clean[left] !== clean[right]) {\n        return false;\n      }\n      // passo 3 — fechar as pontas\n      left++;\n      right--;\n    }\n    return true;\n  }\n  isPalindrome(\"A man, a plan, a canal: Panama\"); // result ==> true\n  isPalindrome(\"race a car\"); // result ==> false\n  isPalindrome(\".,\"); // result ==> true\n}\n// nota: \"race a car\" → clean = \"raceacar\"; em left = 2, right = 5 compara \"c\" com \"c\"; em left = 3, right = 4 compara \"e\" com \"a\" e devolve false.\n// nota2: \".,\"  fica \"\" e o while nem corre. Versão curta da limpeza: s.toLowerCase().replace(/[^a-z0-9]/g, \"\"). Ver 01 §7 e §22.\n\n//--------------------------------------------------------------------\n// Reverse String (LC 344) - // serve para inverter [\"h\", \"e\", \"l\", \"l\", \"o\"] no sítio, quando o enunciado proíbe outro array.\n{\n  function reverseString(chars) {\n    // passo 1 — esqueleto: os dois pointers, o loop e o return\n    let left = 0;\n    let right = chars.length - 1;\n    while (left \u003c right) {\n      // passo 2 — trocar as pontas, com uma variable temporária\n      const temporary = chars[left];\n      chars[left] = chars[right];\n      chars[right] = temporary;\n      // passo 3 — fechar\n      left++;\n      right--;\n    }\n    return chars;\n  }\n  const letters = [\"h\", \"e\", \"l\", \"l\", \"o\"];\n  reverseString(letters);\n  letters; // result ==> [\"o\", \"l\", \"l\", \"e\", \"h\"]\n  reverseString([\"a\", \"b\"]); // result ==> [\"b\", \"a\"]\n}\n// nota: reverse() altera o original (aqui serviria); toReversed() cria cópia. Com [\"a\", \"b\"] há 1 troca só: depois left = 1, right = 0 e pára.\n// nota2: a troca curta é [chars[left], chars[right]] = [chars[right], chars[left]]. Ver 01 §13.\n\n//--------------------------------------------------------------------\n// Remove Duplicates from Sorted Array (LC 26) - // serve para compactar [0, 0, 1, 1, 1, 2, 2, 3] sem array extra.\n{\n  function removeDuplicates(nums) {\n    // passo 1 — esqueleto: write, o loop de read e o return\n    if (nums.length === 0) {\n      return 0;\n    }\n    let write = 1; // nums[0] já é único\n    for (let read = 1; read \u003c nums.length; read++) {\n      // passo 2 — é diferente do último escrito: guardar e avançar write\n      if (nums[read] !== nums[write - 1]) {\n        nums[write] = nums[read];\n        write++;\n      }\n    }\n    return write;\n  }\n  const dups = [0, 0, 1, 1, 1, 2, 2, 3];\n  removeDuplicates(dups); // result ==> 4\n  dups.slice(0, 4); // result ==> [0, 1, 2, 3]\n  removeDuplicates([1, 1, 1]); // result ==> 1\n}\n// nota: devolve um número (quantos únicos); o array muda no sítio e o que fica depois do index 3 é lixo. Ver 01 §6 e §10.\n// nota2: read lê tudo, write só escreve novidades. Em [1, 1, 1] o read nunca encontra um value diferente.\n\n//--------------------------------------------------------------------\n// Move Zeroes (LC 283) - // serve para levar os 0 de [0, 1, 0, 3, 12] para o fim, mantendo a ordem dos outros.\n{\n  function moveZeroes(nums) {\n    // passo 1 — esqueleto: write, o loop e o return\n    let write = 0;\n    for (let read = 0; read \u003c nums.length; read++) {\n      // passo 2 — não é zero: copiar para a frente e avançar write\n      if (nums[read] !== 0) {\n        nums[write] = nums[read];\n        write++;\n      }\n    }\n    // passo 3 — encher o resto com zeros\n    while (write \u003c nums.length) {\n      nums[write] = 0;\n      write++;\n    }\n    return nums;\n  }\n  const nums = [0, 1, 0, 3, 12];\n  moveZeroes(nums);\n  nums; // result ==> [1, 3, 12, 0, 0]\n  // antes do while, write vale quantos não-zeros existem\n  [0, 1, 0, 3, 12].filter((n) => n !== 0).length; // result ==> 3\n}\n// nota: a versão curta, if (n !== 0) nums[write++] = n, usa write e só depois soma 1; nums[++write] avançaria primeiro. Ver 01 §3.\n// nota2: copiar os não-zeros, depois encher com zeros.\n\n//--------------------------------------------------------------------\n// Merge Sorted Array (LC 88) - // serve para juntar dois arrays ordenados dentro do primeiro, que tem zeros livres no fim.\n{\n  function merge(nums1, m, nums2, n) {\n    // passo 1 — esqueleto: três indexes, o loop e o return\n    let i = m - 1; // último real de nums1\n    let j = n - 1; // último de nums2\n    let k = m + n - 1; // posição onde escrever\n    while (j >= 0) {\n      // passo 2 — qual é o maior? nums1 ainda tem elementos e o seu é maior\n      const useNums1 = i >= 0 && nums1[i] > nums2[j];\n      // passo 3 — o maior é de nums1\n      if (useNums1) {\n        nums1[k] = nums1[i];\n        i--;\n      }\n      // passo 4 — o maior é de nums2\n      if (!useNums1) {\n        nums1[k] = nums2[j];\n        j--;\n      }\n      // passo 5 — recuar a escrita\n      k--;\n    }\n    return nums1;\n  }\n  const nums1 = [1, 2, 3, 0, 0, 0];\n  merge(nums1, 3, [2, 5, 6], 3);\n  nums1; // result ==> [1, 2, 2, 3, 5, 6]\n  nums1[2]; // result ==> 2\n}\n// nota: enche-se de TRÁS para a frente com o maior, por isso nada por ler é apagado. Na 4.ª iteration (i = 1, j = 0, k = 2) vai o 2 de nums2, porque nums1[1] = 2 não é > 2.\n// nota2: while (j >= 0) chega: quando nums2 acaba, o que resta de nums1 já está no sítio certo. Ver 01 §6."},{"n":"4","title":"SLIDING WINDOW","kind":"code","body":"//--------------------------------------------------------------------\n// Sliding window - // serve para achar o pedaço seguido mais longo ou mais curto de um array ou string.\n//   passo 1 — esqueleto:        let left = 0;  for (let right = 0; right \u003c s.length; right++) { ... }\n//   passo 2 — juntar à direita: right avança sempre, uma vez por iteration\n//   passo 3 — encolher:         while (window inválida) { left = left + 1; }\n//   passo 4 — medir:            tamanho = right - left + 1\n// left é o início da window, right é o fim. Com left = 2 e right = 5 a window tem os indexes 2, 3, 4 e 5.\nconst windowLeft = 2;\nconst windowRight = 5;\nwindowRight - windowLeft + 1; // result ==> 4\n// nota: não é \"two pointers de pontas opostas\" - aqui left e right andam os dois para a direita.\n\n//--------------------------------------------------------------------\n// Best Time to Buy and Sell Stock (LC 121) - // serve para saber o melhor lucro a comprar num dia e vender num dia seguinte.\nfunction maxProfit(prices) {\n  // passo 1 — esqueleto: o preço mais baixo, o melhor lucro e um loop pelos dias\n  let lowest = Infinity;\n  let best = 0;\n  for (const price of prices) {\n    // passo 2 — hoje é o dia mais barato até agora?\n    if (price \u003c lowest) {\n      lowest = price;\n    }\n    // passo 3 — se vendesse hoje, qual era o lucro?\n    const profit = price - lowest;\n    // passo 4 — é o melhor lucro até agora?\n    if (profit > best) {\n      best = profit;\n    }\n  }\n  return best;\n}\nmaxProfit([7, 1, 5, 3, 6, 4]); // result ==> 5  (compra a 1, vende a 6)\nmaxProfit([7, 6, 4, 3, 1]); // result ==> 0  (só desce)\nmaxProfit([2, 4, 1]); // result ==> 2  (o 1 vem depois e já não tem dia para vender)\n// nota: não há left a encolher, só \"o mais barato até agora\"; fica aqui porque também varre o array uma vez.\n// nota2: com Math.min e Math.max cada if fica numa linha: lowest = Math.min(lowest, price).\n\n//--------------------------------------------------------------------\n// Window fixa de tamanho k - // serve para achar a melhor soma de k números seguidos, como o maior total de 4 dias.\nfunction maxSumK(nums, k) {\n  // passo 1 — esqueleto: somar a primeira window, depois deslizar uma casa de cada vez\n  let sum = 0;\n  for (let i = 0; i \u003c k; i++) {\n    sum = sum + nums[i];\n  }\n  let best = sum;\n  for (let i = k; i \u003c nums.length; i++) {\n    // passo 2 — entra o número novo\n    const entering = nums[i];\n    // passo 3 — sai o número que está k posições atrás\n    const leaving = nums[i - k];\n    sum = sum + entering - leaving;\n    // passo 4 — é a melhor soma até agora?\n    if (sum > best) {\n      best = sum;\n    }\n  }\n  return best;\n}\nmaxSumK([1, 12, -5, -6, 50, 3], 4); // result ==> 51  (12 - 5 - 6 + 50)\nmaxSumK([1, 2, 3], 2); // result ==> 5  (1 + 2 = 3, depois 3 + 3 - 1 = 5)\n// nota: não somar tudo outra vez; entra um, sai um. nums[i - k] sai; nums[i - k + 1] ainda está dentro.\n\n//--------------------------------------------------------------------\n// Longest Substring Without Repeating Characters (LC 3) - // serve para achar o maior pedaço sem letras repetidas, o molde da window de tamanho variável.\nfunction lengthOfLongestSubstring(s) {\n  // passo 1 — esqueleto: as letras da window, o início, o melhor tamanho e um loop pelo fim\n  const inWindow = new Set();\n  let left = 0;\n  let best = 0;\n  for (let right = 0; right \u003c s.length; right++) {\n    // passo 2 — encolher: tirar da esquerda até s[right] deixar de estar repetido\n    while (inWindow.has(s[right])) {\n      inWindow.delete(s[left]);\n      left = left + 1;\n    }\n    // passo 3 — juntar a letra nova\n    inWindow.add(s[right]);\n    // passo 4 — é a maior window até agora?\n    const size = right - left + 1;\n    if (size > best) {\n      best = size;\n    }\n  }\n  return best;\n}\nlengthOfLongestSubstring(\"abcabcbb\"); // result ==> 3  (\"abc\")\nlengthOfLongestSubstring(\"\"); // result ==> 0\nlengthOfLongestSubstring(\"bbbb\"); // result ==> 1  (cada \"b\" novo obriga a tirar o anterior)\nlengthOfLongestSubstring(\"abba\"); // result ==> 2  (com \"if\" em vez de \"while\" daria 3)\n// nota: tem de ser while, não if - em \"abba\" é preciso tirar várias letras até sair a repetida.\n// nota2: compacto: while (inWindow.has(s[right])) inWindow.delete(s[left++]);"},{"n":"5","title":"PREFIX SUM / KADANE","kind":"code","body":"//--------------------------------------------------------------------\n// Prefix sum - // serve para responder muitas vezes \"quanto soma de l a r?\" no mesmo array, sem somar tudo de novo.\nfunction prefixSums(nums) {\n  // passo 1 — esqueleto: o array começa com um 0 à frente, depois um loop pelos números\n  const p = [0];\n  for (const n of nums) {\n    // passo 2 — a soma até agora é o último value do array\n    const last = p[p.length - 1];\n    // passo 3 — acrescentar a soma nova\n    p.push(last + n);\n  }\n  return p;\n}\nconst P = prefixSums([1, 2, 3, 4]);\nP; // result ==> [0, 1, 3, 6, 10]\nP[3] - P[1]; // result ==> 5  (soma dos indexes 1 a 2: 2 + 3)\nP[4] - P[0]; // result ==> 10  (soma dos indexes 0 a 3)\n// nota: por causa do 0 à frente, a soma de l a r é P[r + 1] - P[l], não P[r] - P[l].\n// nota2: compacto: p.push(p.at(-1) + n).\n\n//--------------------------------------------------------------------\n// Running Sum (LC 1480) - // serve para que cada posição some tudo o que veio antes: [1, 2, 3, 4] passa a [1, 3, 6, 10].\nfunction runningSum(nums) {\n  // passo 1 — esqueleto: reutilizar prefixSums\n  const withZero = prefixSums(nums);\n  // passo 2 — tirar o 0 da frente\n  const withoutZero = withZero.slice(1);\n  return withoutZero;\n}\nrunningSum([1, 2, 3, 4]); // result ==> [1, 3, 6, 10]\nrunningSum([5]); // result ==> [5]  (prefixSums dá [0, 5] e slice(1) tira o 0)\n// nota: slice(1) devolve uma cópia a partir do index 1; splice(1) cortaria o array original.\n\n//--------------------------------------------------------------------\n// Maximum Subarray, Kadane (LC 53) - // serve para achar a maior soma de números seguidos, como o melhor pedaço de [-2, 1, -3, 4, -1, 2, 1, -5, 4].\nfunction maxSubArray(nums) {\n  // passo 1 — esqueleto: o pedaço que acaba aqui, o melhor de todos, e um loop a partir do 2.º número\n  let current = nums[0];\n  let best = nums[0];\n  for (let i = 1; i \u003c nums.length; i++) {\n    // passo 2 — o pedaço anterior ajuda (soma positiva): continuar\n    if (current > 0) {\n      current = current + nums[i];\n    }\n    // passo 3 — o pedaço anterior não ajuda: recomeçar aqui\n    if (current \u003c= 0) {\n      current = nums[i];\n    }\n    // passo 4 — é a melhor soma até agora?\n    if (current > best) {\n      best = current;\n    }\n  }\n  return best;\n}\nmaxSubArray([-2, 1, -3, 4, -1, 2, 1, -5, 4]); // result ==> 6  (4 - 1 + 2 + 1)\nmaxSubArray([-3, -1]); // result ==> -1\nmaxSubArray([2, -1, 2]); // result ==> 3  (continuar compensa: 2, depois 1, depois 3)\n// nota: começar com 0 em vez de nums[0] daria 0 num array só de negativos, que não é a soma de nenhum pedaço.\n// nota2: compacto: current = Math.max(nums[i], current + nums[i])."},{"n":"6","title":"BINARY SEARCH","kind":"code","body":"//--------------------------------------------------------------------\n// Binary Search (LC 704) - // serve para encontrar um número num array ORDENADO em O(log n).\nfunction binarySearch(nums, target) {\n  // passo 1 — esqueleto: os limites do que ainda é possível e um loop enquanto sobrar intervalo\n  let left = 0;\n  let right = nums.length - 1;\n  while (left \u003c= right) {\n    const mid = Math.floor((left + right) / 2);\n    // passo 2 — o meio é o número procurado\n    if (nums[mid] === target) {\n      return mid;\n    }\n    // passo 3 — o meio é pequeno: deitar fora a metade esquerda\n    if (nums[mid] \u003c target) {\n      left = mid + 1;\n    }\n    // passo 4 — o meio é grande: deitar fora a metade direita\n    if (nums[mid] > target) {\n      right = mid - 1;\n    }\n  }\n  // intervalo vazio: não existe\n  return -1;\n}\nbinarySearch([-1, 0, 3, 5, 9, 12], 9); // result ==> 4\nbinarySearch([-1, 0, 3, 5, 9, 12], 2); // result ==> -1  (não existe)\n// nota: usar sempre left \u003c= right com mid ± 1; com \u003c o intervalo de 1 elemento nunca era testado.\n// nota2: com target 9 o while corre 2 vezes: mid = 2 (3 \u003c 9, left = 3), depois mid = 4 (achou).\n\n//--------------------------------------------------------------------\n// Search Insert Position (LC 35) - // serve para saber onde entraria um número num array ordenado sem estragar a ordem.\nfunction searchInsert(nums, target) {\n  // passo 1 — esqueleto: a mesma binary search\n  let left = 0;\n  let right = nums.length - 1;\n  while (left \u003c= right) {\n    const mid = Math.floor((left + right) / 2);\n    // passo 2 — achou: é essa a posição\n    if (nums[mid] === target) {\n      return mid;\n    }\n    // passo 3 — o meio é pequeno\n    if (nums[mid] \u003c target) {\n      left = mid + 1;\n    }\n    // passo 4 — o meio é grande\n    if (nums[mid] > target) {\n      right = mid - 1;\n    }\n  }\n  // passo 5 — não achou: left é o primeiro index com value maior que target\n  return left;\n}\nsearchInsert([1, 3, 5, 6], 2); // result ==> 1  (entre o 1 e o 3)\nsearchInsert([1, 3, 5, 6], 7); // result ==> 4  (no fim)\nsearchInsert([1, 3, 5, 6], 0); // result ==> 0  (tudo é maior; right desce a -1 e left fica em 0)\n// nota: no fim right = left - 1; right aponta para o último menor, left para onde o target entra."},{"n":"7","title":"STACK","kind":"code","body":"//--------------------------------------------------------------------\n// Stack - // serve para parênteses, desfazer e tudo onde \"o último a entrar é o primeiro a sair\".\nconst st = [];\nst.push(1); // result ==> 1  (push devolve o novo length)\nst.push(2); // result ==> 2\nst.at(-1); // result ==> 2  (espreita o topo, não tira)\nst.pop(); // result ==> 2\nst; // result ==> [1]\n[].pop(); // result ==> undefined  (stack vazia não tem topo e não dá erro)\n// nota: a stack é um array simples, o fim é o topo: push e pop no fim são O(1).\n// nota2: shift() tira do início (queue) e é O(n); pop() tira do fim (stack).\n\n//--------------------------------------------------------------------\n// Valid Parentheses (LC 20) - // serve para saber se todos os parênteses fecham pela ordem certa: \"()[]{}\" é válido, \"([)]\" não.\nfunction isValid(s) {\n  // passo 1 — esqueleto: a tabela fecho → abertura, a stack das aberturas por fechar e um loop pelas letras\n  const pair = { \")\": \"(\", \"]\": \"[\", \"}\": \"{\" };\n  const stack = [];\n  for (const ch of s) {\n    // passo 2 — é um fecho: tirar a última abertura e ver se é o par certo\n    if (ch in pair) {\n      const top = stack.pop();\n      if (top !== pair[ch]) {\n        return false;\n      }\n    }\n    // passo 3 — é uma abertura: fazer push\n    if (!(ch in pair)) {\n      stack.push(ch);\n    }\n  }\n  // passo 4 — no fim a stack tem de estar vazia\n  return stack.length === 0;\n}\nisValid(\"()[]{}\"); // result ==> true\nisValid(\"([)]\"); // result ==> false  (ordem errada: \")\" encontra \"[\" no topo)\nisValid(\"((\"); // result ==> false  (sobrou abertura sem fecho)\nisValid(\")\"); // result ==> false  (pop() da stack vazia dá undefined, que não é \"(\")\n// nota: \"ch in pair\" pergunta se a KEY existe; aqui só os fechos são keys.\n// nota2: uma queue com push() + shift() funciona, mas shift() é O(n); se der Time Limit, andar com um index."},{"n":"8","title":"LINKED LIST","kind":"code","body":"//--------------------------------------------------------------------\n// Linked list - // serve para quando o LeetCode dá `head` e pede para mudar as setas .next; só se chega a um node pelo anterior.\nclass ListNode {\n  constructor(val, next = null) {\n    this.val = val;\n    this.next = next;\n  }\n}\n// helper para testar: array → linked list, a começar pelo fim (o último aponta para null)\nfunction toList(arr) {\n  let list = null;\n  for (let i = arr.length - 1; i >= 0; i--) {\n    list = new ListNode(arr[i], list);\n  }\n  return list;\n}\n// helper para testar: linked list → array\nfunction toArray(head) {\n  const out = [];\n  let node = head;\n  while (node !== null) {\n    out.push(node.val);\n    node = node.next;\n  }\n  return out;\n}\ntoArray(toList([1, 2, 3])); // result ==> [1, 2, 3]\ntoList([7]).next; // result ==> null  (o único node é também o último)\n// nota: cada node tem val e next (null no último). Perder a referência ao resto é perder o resto - desenhar as setas primeiro.\n// nota2: compacto: arr.reduceRight((next, val) => new ListNode(val, next), null); reduceRight começa no fim, que é o que a linked list precisa.\n\n//--------------------------------------------------------------------\n// Reverse Linked List (LC 206) - // serve para virar a linked list ao contrário: 1 → 2 → 3 passa a 3 → 2 → 1.\nfunction reverseList(head) {\n  // passo 1 — esqueleto: prev é a parte já virada, current é o node a virar\n  let prev = null;\n  let current = head;\n  while (current !== null) {\n    // passo 2 — guardar o resto da linked list\n    const next = current.next;\n    // passo 3 — virar a seta para trás\n    current.next = prev;\n    // passo 4 — avançar os dois\n    prev = current;\n    current = next;\n  }\n  // chegou ao fim (null): a nova cabeça é prev\n  return prev;\n}\ntoArray(reverseList(toList([1, 2, 3]))); // result ==> [3, 2, 1]\nreverseList(null); // result ==> null  (o while não corre e devolve prev)\n// nota: no fim current é null; devolver prev, não current.\n\n//--------------------------------------------------------------------\n// Merge Two Sorted Lists (LC 21) - // serve para juntar duas linked lists ordenadas numa só: [1, 2, 4] + [1, 3, 4] dá [1, 1, 2, 3, 4, 4].\nfunction mergeTwoLists(first, second) {\n  // passo 1 — esqueleto: um node falso à frente, tail é o último node da resposta\n  const dummy = new ListNode(0);\n  let tail = dummy;\n  while (first !== null && second !== null) {\n    // passo 2 — o primeiro é menor ou igual: ligar o primeiro\n    if (first.val \u003c= second.val) {\n      tail.next = first;\n      first = first.next;\n    }\n    // passo 3 — o segundo é menor: ligar o segundo\n    else {\n      tail.next = second;\n      second = second.next;\n    }\n    tail = tail.next;\n  }\n  // passo 4 — sobrou o primeiro: pendurar o resto\n  if (first !== null) {\n    tail.next = first;\n  }\n  // passo 5 — sobrou o segundo: pendurar o resto\n  if (second !== null) {\n    tail.next = second;\n  }\n  // salta o node falso\n  return dummy.next;\n}\ntoArray(mergeTwoLists(toList([1, 2, 4]), toList([1, 3, 4]))); // result ==> [1, 1, 2, 3, 4, 4]\ntoArray(mergeTwoLists(null, toList([5]))); // result ==> [5]  (o while não corre; sobra só o segundo)\n// nota: o dummy evita o caso especial \"a linked list nova ainda está vazia\"; devolver dummy.next, não dummy.\n// nota2: compacto: tail.next = first ?? second pendura o resto sem os dois if.\n\n//--------------------------------------------------------------------\n// Middle of the Linked List (LC 876) - // serve para achar o node do meio numa só passagem.\nfunction middleNode(head) {\n  // passo 1 — esqueleto: dois corredores, ambos a começar na head\n  let slow = head;\n  let fast = head;\n  // passo 2 — enquanto o rápido tem dois passos para dar\n  while (fast !== null && fast.next !== null) {\n    // passo 3 — o lento anda 1, o rápido anda 2\n    slow = slow.next;\n    fast = fast.next.next;\n  }\n  // o rápido chegou ao fim: o lento está no meio\n  return slow;\n}\nmiddleNode(toList([1, 2, 3, 4, 5])).val; // result ==> 3\nmiddleNode(toList([1, 2, 3, 4])).val; // result ==> 3  (com número par fica o segundo do meio)\n// nota: a condição precisa dos dois, fast e fast.next; fast.next.next rebenta se um deles for null.\n\n//--------------------------------------------------------------------\n// Linked List Cycle (LC 141) - // serve para saber se a linked list tem um cycle, sem guardar os nodes visitados.\nfunction hasCycle(head) {\n  // passo 1 — esqueleto: o mesmo slow e fast\n  let slow = head;\n  let fast = head;\n  while (fast !== null && fast.next !== null) {\n    slow = slow.next;\n    fast = fast.next.next;\n    // passo 2 — encontraram-se no mesmo node: há cycle\n    if (slow === fast) {\n      return true;\n    }\n  }\n  // passo 3 — o rápido chegou ao fim (null): não há cycle\n  return false;\n}\nconst cycle = toList([1, 2, 3]);\ncycle.next.next.next = cycle; // o 3 aponta de volta para o 1\nhasCycle(cycle); // result ==> true\nhasCycle(toList([1, 2])); // result ==> false\nhasCycle(null); // result ==> false  (fast é null, o while não corre)\n// nota: slow === fast compara o NODE (a referência), não o value; dois nodes com val 1 diferentes não contam."},{"n":"9","title":"BINARY TREES","kind":"code","body":"//--------------------------------------------------------------------\n// Binary tree - // serve para quando o LeetCode dá `root`, com .left e .right; quase tudo é recursion.\nclass TreeNode {\n  constructor(val, left = null, right = null) {\n    this.val = val;\n    this.left = left;\n    this.right = right;\n  }\n}\n//        3\n//       / \\\n//      9   20\n//         /  \\\n//        15   7\nconst tree = new TreeNode(3, new TreeNode(9), new TreeNode(20, new TreeNode(15), new TreeNode(7)));\ntree.right.left.val; // result ==> 15\ntree.left.right; // result ==> null  (o 9 é leaf, não tem right child)\n// nota: a receita é sempre a mesma: 1. se o node é null, devolve a resposta vazia; 2. confiar que left e right já funcionam; 3. combinar.\n// nota2: leaf é um node sem children; null é a ausência de node (o base case).\n\n//--------------------------------------------------------------------\n// Maximum Depth (LC 104) - // serve para saber quantos levels tem a tree.\nfunction maxDepth(node) {\n  // passo 1 — esqueleto: chegou ao fim (null), vale 0\n  if (node === null) {\n    return 0;\n  }\n  // passo 2 — lado esquerdo\n  const leftDepth = maxDepth(node.left);\n  // passo 3 — lado direito\n  const rightDepth = maxDepth(node.right);\n  // passo 4 — este node (1) + o lado mais fundo\n  return 1 + Math.max(leftDepth, rightDepth);\n}\nmaxDepth(tree); // result ==> 3\nmaxDepth(new TreeNode(1, new TreeNode(2))); // result ==> 2  (o node 2 dá 1, o lado direito dá 0)\nmaxDepth(new TreeNode(1)); // result ==> 1  (conta nodes, não edges)\n// nota: compacto: const maxDepth = (node) => (node ? 1 + Math.max(maxDepth(node.left), maxDepth(node.right)) : 0);\n\n//--------------------------------------------------------------------\n// Invert Binary Tree (LC 226) - // serve para espelhar a tree, trocando left e right em todos os nodes.\nfunction invertTree(node) {\n  // passo 1 — esqueleto: chegou ao fim (null)\n  if (node === null) {\n    return null;\n  }\n  // passo 2 — lado esquerdo: inverter o child\n  const invertedLeft = invertTree(node.left);\n  // passo 3 — lado direito: inverter o child\n  const invertedRight = invertTree(node.right);\n  // passo 4 — trocar os dois\n  node.left = invertedRight;\n  node.right = invertedLeft;\n  return node;\n}\nconst small = new TreeNode(1, new TreeNode(2), new TreeNode(3));\ninvertTree(small);\nsmall.left.val; // result ==> 3\nsmall.val; // result ==> 1  (a root não muda de value; só os children trocam)\n// nota: node.left = invertTree(node.right) seguido de node.right = invertTree(node.left) está ERRADO - o segundo já lê o left novo. Guardar primeiro.\n// nota2: compacto: [node.left, node.right] = [invertTree(node.right), invertTree(node.left)].\n\n//--------------------------------------------------------------------\n// Same Tree (LC 100) - // serve para saber se duas trees são iguais, na forma e nos values, node a node.\nfunction isSameTree(p, q) {\n  // passo 1 — esqueleto: os dois chegaram ao fim (null)\n  if (p === null && q === null) {\n    return true;\n  }\n  // passo 2 — só um chegou ao fim\n  if (p === null || q === null) {\n    return false;\n  }\n  // passo 3 — values diferentes\n  if (p.val !== q.val) {\n    return false;\n  }\n  // passo 4 — lado esquerdo\n  const sameLeft = isSameTree(p.left, q.left);\n  // passo 5 — lado direito\n  const sameRight = isSameTree(p.right, q.right);\n  return sameLeft && sameRight;\n}\nisSameTree(invertTree(invertTree(tree)), tree); // result ==> true  (inverter duas vezes devolve a original)\nisSameTree(new TreeNode(1), new TreeNode(1)); // result ==> true  (values iguais e os quatro children são null)\nisSameTree(null, new TreeNode(1)); // result ==> false\n// nota: p === q em nodes compara referências; aqui só se usava quando pelo menos um era null, por isso os if explícitos.\n\n//--------------------------------------------------------------------\n// Path Sum (LC 112) - // serve para saber se algum caminho da root a uma leaf soma target: 3 + 20 + 7 = 30.\nfunction hasPathSum(node, target) {\n  // passo 1 — esqueleto: chegou ao fim (null), não é caminho\n  if (node === null) {\n    return false;\n  }\n  // passo 2 — o que falta somar abaixo deste node\n  const rest = target - node.val;\n  // passo 3 — é leaf: tem de faltar exatamente 0\n  if (node.left === null && node.right === null) {\n    return rest === 0;\n  }\n  // passo 4 — lado esquerdo\n  if (hasPathSum(node.left, rest)) {\n    return true;\n  }\n  // passo 5 — lado direito\n  if (hasPathSum(node.right, rest)) {\n    return true;\n  }\n  return false;\n}\nhasPathSum(tree, 30); // result ==> true  (3 + 20 + 7)\nhasPathSum(tree, 5); // result ==> false\nhasPathSum(tree, 12); // result ==> true  (3 + 9 = 12 e o 9 é leaf)\n// nota: parar na leaf, não no null - o caminho tem de acabar numa leaf; um null sozinho devolve false.\n\n//--------------------------------------------------------------------\n// Inorder Traversal (LC 94) - // serve para visitar todos os nodes e listar os values pela ordem left, node, right (DFS).\
